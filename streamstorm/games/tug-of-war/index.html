<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перетягивание над пропастью — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<div id="panel">
  <h3>🪢 Пульт ведущего <small style="display:inline">(H — скрыть)</small></h3>
  <div id="status" class="wait">⏳</div>
  <div class="row"><button data-a="L1">◀ 🌹 1</button><button data-a="R1">🌹 1 ▶</button></div>
  <div class="row"><button data-a="L30">◀ 💎 30</button><button data-a="R30">💎 30 ▶</button></div>
  <div class="row"><button data-a="L199">◀ 🚀 199</button><button data-a="R199">🚀 199 ▶</button></div>
  <div class="row"><button data-a="Llike">◀ ❤️</button><button data-a="Rlike">❤️ ▶</button></div>
  <button data-a="bots" id="botsBtn">🤖 Демо-боты</button>
  <button data-a="restart">🔄 Новый матч</button>
  <small>Клавиши: Q/W/E подарки левым · I/O/P правым · B боты · R рестарт · H пульт</small>
</div>
<script>
"use strict";
/* ===================== НАСТРОЙКИ (или параметры ссылки, см. README) ===================== */
const CONFIG = {
  wsUrl: "ws://localhost:21213/",
  roundSeconds: 90,      // один раунд
  winsNeeded: 2,         // матч до 2 побед
  endSeconds: 6, matchEndSeconds: 10,
  teams: [ {name:"КРАСНЫЕ", color:"#ff4d5e", words:["красные","красный","red","left"]},
           {name:"СИНИЕ",   color:"#3fa4ff", words:["синие","синий","blue","right"]} ],
  track: 300,            // до края пропасти N шагов
  coinPull: 1.0,         // 1 монета = 1 шаг
  maxPerEvent: 0.3,      // один подарок двигает канат не больше чем на 30% пути
  likesPerStep: 15,
  anchorSeconds: 5,      // подарок 100+: якорь — рывки соперника вдвое слабее N сек
  anchorMax: 8,
  drift: 2,              // канат сам тянется к центру, шаг/сек
  safe: {top: 150, right: 110},
};
const Q=new URLSearchParams(location.search);
if(Q.get("ws")) CONFIG.wsUrl=Q.get("ws");
if(Q.get("round")) CONFIG.roundSeconds=Math.max(20,+Q.get("round")||90);
if(Q.get("left")) CONFIG.teams[0].name=Q.get("left").toUpperCase().slice(0,14);
if(Q.get("right")) CONFIG.teams[1].name=Q.get("right").toUpperCase().slice(0,14);
const SRC=(Q.get("src")||"demo").toLowerCase();
const STREAMER=(Q.get("user")||"").replace(/^@/,"").slice(0,30);
const LIKES_ON=Q.get("likes")!=="0";
const JOIN_CMD=(Q.get("join")||"!join").trim().toLowerCase();
// map=giftId:action:power — pull (тянуть N) · anchor (якорь N сек) · none
const GIFT_MAP=new Map();
(Q.get("map")||"").split(",").forEach(x=>{const [id,a,p]=x.split(":"); if(id&&a) GIFT_MAP.set(String(id).trim(),{action:a.trim().toLowerCase(),power:+p||0});});
const OBS=Q.get("obs")==="1";
if(OBS||!!window.obsstudio||(Q.has("src")&&Q.get("panel")!=="1")) document.getElementById("panel").style.display="none";

const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, PW=W-CONFIG.safe.right, CX=PW/2+20;
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';
const RY=1000; // высота каната

/* ===================== Состояние ===================== */
let pos=0, vpos=0;            // -100 (победа левых) … +100 (победа правых)
let score=[0,0], phase="play", phaseT=CONFIG.roundSeconds, roundN=1, time=0, shake=0;
let anchor=[0,0], queue=[0,0];            // сек якоря у команды i (противник не тянет)
let members=new Map();       // id -> 0/1
let contrib=[new Map(),new Map()]; // id -> {name,avatar,pts}
let parts=[], floaters=[], feed=[], banner=null, faller=null, lastWin=-1, jerk=0;
const streaks=new Map(), likeBank=new Map(), avatars=new Map();
let botsOn=SRC==="demo"||Q.get("demo")==="1";

function teamOf(u){ if(members.has(u.id)) return members.get(u.id);
  const c0=[...members.values()].filter(v=>v===0).length, c1=members.size-c0; const t=c0<=c1?0:1; members.set(u.id,t);
  addFeed(`${u.name} → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color); return t; }
function credit(t,u,pts){ let c=contrib[t].get(u.id); if(!c){c={name:u.name,avatar:u.avatar,pts:0};contrib[t].set(u.id,c);} c.name=u.name; if(u.avatar)c.avatar=u.avatar; c.pts+=pts; }

function newRound(){ pos=0; anchor=[0,0]; queue=[0,0]; phase="play"; phaseT=CONFIG.roundSeconds; faller=null; showBanner(`РАУНД ${roundN}`,"Дарите подарки — тяните канат!","#ffd23f"); }
function newMatch(){ score=[0,0]; roundN=1; contrib=[new Map(),new Map()]; newRound(); }
function winRound(t){
  score[t]++; lastWin=t; phase="roundEnd"; shake=1;
  const loser=1-t; const top=[...contrib[loser].values()].sort((a,b)=>b.pts-a.pts)[0];
  faller={name:top?top.name:CONFIG.teams[loser].name, x:t===0?PW-170:190, y:RY, vy:0, side:loser};
  burst(t===0?190:PW-170,RY-120,CONFIG.teams[t].color,80);
  if(score[t]>=CONFIG.winsNeeded){ phase="matchEnd"; phaseT=CONFIG.matchEndSeconds; }
  else { phaseT=CONFIG.endSeconds; showBanner(`${CONFIG.teams[t].name} +1`,`${faller.name} летит в пропасть!`,CONFIG.teams[t].color); }
}

/* ===================== Действия ===================== */
function pull(t,u,steps,label){
  if(phase!=="play"||steps<=0) return;
  if(anchor[1-t]>0) steps*=0.5; // якорь соперника — рывок вдвое слабее
  queue[t]+=steps; credit(t,u,steps); // рывки идут через очередь: не больше 30% пути за ~2.5 с
  if(steps>=5&&floaters.length<25) floaters.push({x:t===0?320:PW-320,y:RY-180,text:`${t===0?"◀":""} ${Math.round(steps)} ${t===1?"▶":""}`,c:CONFIG.teams[t].color,life:1.3});
}
function onGift(u,unit,count,name,giftId){
  if(phase!=="play") return; const t=teamOf(u); const coins=unit*count;
  const mp=giftId!=null&&GIFT_MAP.get(String(giftId));
  if(mp){ if(mp.action==="none") return; if(mp.action==="anchor") return setAnchor(t,u,mp.power*count,name); credit(t,u,0); return pull(t,u,mp.power*count,name); }
  if(unit>=100){ setAnchor(t,u,CONFIG.anchorSeconds*count,name); }
  pull(t,u,coins*CONFIG.coinPull,name);
  if(coins>=10) addFeed(`🎁 ${u.name}: ${name}×${count} → ${CONFIG.teams[t].name} +${coins} 💰`,CONFIG.teams[t].color);
}
function setAnchor(t,u,sec,name){ anchor[t]=Math.min(CONFIG.anchorMax,anchor[t]+sec); showBanner(`⚓ ${u.name}`,`${name}: ${CONFIG.teams[1-t].name} тянут вдвое слабее ${Math.round(anchor[t])} с`,CONFIG.teams[t].color); }
function onLike(u,n){ if(phase!=="play"||!LIKES_ON) return; const t=teamOf(u); const b=(likeBank.get(u.id)||0)+n; const s=Math.floor(b/CONFIG.likesPerStep); likeBank.set(u.id,b%CONFIG.likesPerStep); if(s) pull(t,u,s,"лайки");
  if(Math.random()<.3) parts.push({x:t===0?120+Math.random()*250:PW-120-Math.random()*250,y:1500,vx:0,vy:-220,life:1.3,emo:"❤️",size:32}); }
function onComment(u,text){ const s=" "+String(text).toLowerCase().replace(/[!?.,]/g," ")+" ";
  const ex=String(text).trim(); if(ex==="1"||ex==="2"){ const t=+ex-1; if(members.get(u.id)!==t){ members.set(u.id,t); addFeed(`${u.name} → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color);} return; }
  for(let t=0;t<2;t++) for(const w of [CONFIG.teams[t].name.toLowerCase(),...CONFIG.teams[t].words]) if(s.includes(" "+w+" ")){ if(members.get(u.id)!==t){ members.set(u.id,t); addFeed(`${u.name} → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color);} return; }
  if(s.trim().startsWith(JOIN_CMD.replace(/[!?.,]/g,"").trim())) teamOf(u); }
function onFollow(u){ const t=teamOf(u); pull(t,u,5,"подписка"); addFeed(`➕ ${u.name} подписался: +5 → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color); }

/* ===================== Подключение ===================== */
let ws=null, wsState="wait";
function setStatus(s,t){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=t; }
function connect(){ try{ws=new WebSocket(CONFIG.wsUrl);}catch(e){setStatus("bad","❌ Неверный адрес");return;}
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl); ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{try{handleRaw(JSON.parse(e.data));}catch(_){}}; ws.onclose=()=>{setStatus("bad","🔴 Нет связи — переподключаюсь…");setTimeout(connect,3000);}; ws.onerror=()=>{try{ws.close();}catch(_){}}; }
function handleRaw(msg){
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user, base={uniqueId:u.id,nickname:u.name};
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};
    else msg={event:msg.type,data:base}; }
  const ev=String(msg.event||msg.type||"").toLowerCase(), d=msg.data||msg, uu=d.user||{};
  const u={id:String(d.uniqueId||d.userId||uu.uniqueId||"anon"), name:String(d.nickname||uu.nickname||d.uniqueId||"Зритель").slice(0,22), avatar:d.profilePictureUrl||uu.profilePictureUrl||null};
  switch(ev){
    case "chat": case "comment": onComment(u,d.comment||""); break;
    case "like": onLike(u,Math.min(200,+d.likeCount||1)); break;
    case "follow": onFollow(u); break;
    case "gift": { const unit=+(d.diamondCount||1), name=String(d.giftName||"подарок").slice(0,20), rc=+(d.repeatCount||1);
      if(+d.giftType===1){ const key=u.id+"|"+(d.giftId||name), prev=streaks.get(key)||0, delta=(prev>0&&rc>=prev)?rc-prev:rc;
        if(d.repeatEnd) streaks.delete(key); else streaks.set(key,rc); if(delta>0) onGift(u,unit,delta,name,d.giftId); }
      else onGift(u,unit,rc,name,d.giftId); }
  }
}

/* ===================== Обновление ===================== */
function update(dt){
  phaseT-=dt;
  if(phase==="play"){
    for(let i=0;i<2;i++){ anchor[i]=Math.max(0,anchor[i]-dt); const rel=Math.min(queue[i],CONFIG.track*CONFIG.maxPerEvent/2.5*dt); queue[i]-=rel; pos+=(i===0?-1:1)*rel; jerk=Math.min(1,jerk+rel/4); }
    if(Math.abs(pos)>0.1) pos-=Math.sign(pos)*Math.min(Math.abs(pos),CONFIG.drift*dt);
    if(pos<=-CONFIG.track) winRound(0); else if(pos>=CONFIG.track) winRound(1);
    else if(phaseT<=0){ if(Math.abs(pos)<1){ showBanner("НИЧЬЯ","Ещё раунд!","#fff"); newRound(); } else winRound(pos<0?0:1); }
  } else if(phase==="roundEnd"&&phaseT<=0){ roundN++; newRound(); }
  else if(phase==="matchEnd"&&phaseT<=0) newMatch();
  pos=Math.max(-CONFIG.track,Math.min(CONFIG.track,pos)); vpos+=(pos-vpos)*Math.min(1,dt*6); jerk=Math.max(0,jerk-dt*2); shake=Math.max(0,shake-dt*2);
  if(faller){ faller.vy+=1400*dt; faller.y+=faller.vy*dt; }
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;} parts=parts.filter(p=>p.life>0); if(parts.length>500) parts.splice(0,parts.length-500);
  floaters.forEach(f=>{f.life-=dt;f.y-=60*dt;}); floaters=floaters.filter(f=>f.life>0);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);
  if(banner){banner.life-=dt; if(banner.life<=0) banner=null;}
  if(botsOn) runBots(dt);
}

/* ===================== Отрисовка ===================== */
function txt(s,x,y,size,c,align="center",w=900,stroke=true){ ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";
  if(stroke){ctx.lineWidth=Math.max(4,size/6);ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineJoin="round";ctx.strokeText(s,x,y);} ctx.fillStyle=c; ctx.fillText(s,x,y); }
function fit(s,x,y,size,maxW,c){ ctx.font=`900 ${size}px ${FONT}`; while(size>14&&ctx.measureText(s).width>maxW){size--;ctx.font=`900 ${size}px ${FONT}`;} txt(s,x,y,size,c); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function avatarImg(url){ if(!url) return null; if(avatars.has(url)) return avatars.get(url); const im=new Image(); im.src=url; avatars.set(url,im); return im; }
function avatar(name,url,x,y,r,ring){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); const im=avatarImg(url);
  if(im&&im.complete&&im.naturalWidth){ctx.clip();ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();}
  else { let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))|0; ctx.fillStyle=`hsl(${Math.abs(h)%360},60%,45%)`; ctx.fill(); ctx.restore(); txt([...name][0].toUpperCase(),x,y+2,r*1.1,"#fff","center",900,false); }
  ctx.lineWidth=Math.max(3,r*.14); ctx.strokeStyle=ring; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); }
function person(x,y,c,lean,name,url){ // игрок, тянущий канат: упор ногами, корпус назад
  const br=Math.sin(time*7+x*.05)*2.5;
  ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(x,y+74,44,9,0,0,Math.PI*2); ctx.fill();
  // ноги: передняя упирается, задняя согнута
  ctx.strokeStyle="#4a5677"; ctx.lineWidth=16;
  ctx.beginPath(); ctx.moveTo(x,y+12); ctx.lineTo(x-lean*22,y+42); ctx.lineTo(x-lean*34,y+70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y+12); ctx.lineTo(x+lean*14,y+44); ctx.lineTo(x+lean*6,y+70); ctx.stroke();
  ctx.fillStyle="#0b0f1a"; for(const fx of [x-lean*34,x+lean*6]){ ctx.beginPath(); ctx.ellipse(fx-lean*6,y+72,15,7,0,0,Math.PI*2); ctx.fill(); }
  // корпус-майка цвета команды
  ctx.strokeStyle="#2b3350"; ctx.lineWidth=30; ctx.beginPath(); ctx.moveTo(x,y+14); ctx.lineTo(x+lean*6,y+2); ctx.stroke();
  ctx.strokeStyle=c; ctx.lineWidth=30; ctx.beginPath(); ctx.moveTo(x+lean*4,y); ctx.lineTo(x+lean*26,y-48+br); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x-lean*6,y-4); ctx.lineTo(x+lean*16,y-48+br); ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x+lean*14,y+2); ctx.lineTo(x+lean*36,y-42+br); ctx.stroke();
  // руки тянут канат
  ctx.strokeStyle=c; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(x+lean*24,y-42+br); ctx.lineTo(x-lean*4,y-22); ctx.lineTo(x-lean*32,y-10); ctx.stroke();
  ctx.fillStyle="#f2c9a0"; ctx.beginPath(); ctx.arc(x-lean*34,y-10,9,0,Math.PI*2); ctx.fill();
  // голова-аватар с повязкой
  avatar(name,url,x+lean*34,y-80+br,27,c);
  ctx.strokeStyle=c; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(x+lean*34,y-80+br,28,-2.7,-.45); ctx.stroke();
  if(name&&name.trim()){ ctx.font=`800 20px ${FONT}`; const tw=Math.min(110,ctx.measureText(name).width+20); ctx.fillStyle="rgba(0,0,0,.55)"; rr(x+lean*30-tw/2,y-150,tw,30,15); ctx.fill(); fit(name,x+lean*30,y-135,20,96,"#fff"); }
  ctx.restore();
}

function draw(){
  ctx.save(); if(shake>0) ctx.translate((Math.random()-.5)*26*shake,(Math.random()-.5)*26*shake);
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#0d1630"); sky.addColorStop(.5,"#2b2350"); sky.addColorStop(1,"#05030a"); ctx.fillStyle=sky; ctx.fillRect(-40,-40,W+80,H+80);
  for(let i=0;i<60;i++){ ctx.fillStyle=`rgba(255,255,255,${.3+.3*Math.sin(time+i)})`; ctx.fillRect((i*173)%W,(i*97)%700+120,3,3); }
  // луна и горы вдали
  const mg=ctx.createRadialGradient(780,740,10,780,740,140); mg.addColorStop(0,"rgba(255,250,230,.95)"); mg.addColorStop(.35,"rgba(255,240,200,.25)"); mg.addColorStop(1,"rgba(255,240,200,0)"); ctx.fillStyle=mg; ctx.fillRect(640,600,280,280);
  ctx.fillStyle="#fffbe9"; ctx.beginPath(); ctx.arc(780,740,44,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(200,195,180,.5)"; ctx.beginPath(); ctx.arc(765,730,9,0,Math.PI*2); ctx.arc(795,755,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#241a3d"; ctx.beginPath(); ctx.moveTo(0,RY+60); for(let i=0;i<=12;i++) ctx.lineTo(i*W/12,RY-150-((i*53)%5)*34-(i%2)*60); ctx.lineTo(W,RY+60); ctx.fill();
  ctx.fillStyle="#1a1330"; ctx.beginPath(); ctx.moveTo(0,RY+60); for(let i=0;i<=9;i++) ctx.lineTo(i*W/9,RY-60-((i*37)%4)*30); ctx.lineTo(W,RY+60); ctx.fill();
  // пропасть с туманом
  const ab=ctx.createLinearGradient(0,RY+60,0,H); ab.addColorStop(0,"#1a1230"); ab.addColorStop(1,"#000"); ctx.fillStyle=ab; ctx.fillRect(0,RY+60,W,H);
  for(let i=0;i<8;i++){ ctx.fillStyle=`rgba(160,140,220,${.06})`; ctx.beginPath(); ctx.ellipse((i*190+time*25)%(W+300)-150,RY+260+i*60,260,50,0,0,Math.PI*2); ctx.fill(); }
  // утёсы
  const cliff=(x0,x1,dir)=>{ ctx.fillStyle="#3a2d48"; ctx.beginPath(); ctx.moveTo(x0,RY+60); ctx.lineTo(x1,RY+60); ctx.lineTo(x1-dir*40,RY+300); ctx.lineTo(x1-dir*10,RY+520); ctx.lineTo(x1-dir*70,H); ctx.lineTo(x0,H); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.22)"; ctx.lineWidth=4; for(let k=1;k<6;k++){ const yy=RY+60+k*70; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x1-dir*(20+k*8),yy+((k%2)?10:-6)); ctx.stroke(); }
    ctx.fillStyle="rgba(255,255,255,.05)"; ctx.beginPath(); ctx.moveTo(x1,RY+60); ctx.lineTo(x1-dir*40,RY+300); ctx.lineTo(x1-dir*70,RY+300); ctx.lineTo(x1-dir*30,RY+60); ctx.fill();
    ctx.fillStyle="#4f8a3c"; ctx.fillRect(Math.min(x0,x1),RY+52,Math.abs(x1-x0),16);
    ctx.fillStyle="#6cb34f"; for(let gx=Math.min(x0,x1)+8;gx<Math.max(x0,x1)-8;gx+=22){ ctx.beginPath(); ctx.moveTo(gx,RY+54); ctx.lineTo(gx+5,RY+38+Math.sin(time*2+gx)*3); ctx.lineTo(gx+10,RY+54); ctx.fill(); } };
  cliff(-20,300,1); cliff(PW+40,PW-260,-1);
  // зона победы
  for(const [x,c] of [[300,CONFIG.teams[0].color],[PW-260,CONFIG.teams[1].color]]){ ctx.strokeStyle=c; ctx.setLineDash([14,10]); ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x,RY-260); ctx.lineTo(x,RY+60); ctx.stroke(); ctx.setLineDash([]); }
  // канат: середина смещается по pos
  const off=(vpos/CONFIG.track)*150;

    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    if(MERGED) g.restore(); else requestAnimationFrame(step);
  }
  if(MERGED) window.__fxStep=step; else requestAnimationFrame(step);
})();
</script>
<script id="license" data-game="tug-of-war">
/* StreamStorm license client. Public file: holds only the Supabase URL and the PUBLIC anon key.
   Usage:
     SSLicense.check(key, gameId) -> Promise<{ok, scope, expires_at, reason, offline}>
     SSLicense.saved()            -> last key the user entered ("" if none)
   gameId = game folder id (e.g. "lava-rising"); a key with scope "all" fits every game.
   reason: not_found | revoked | wrong_game | expired | rate_limited | no_key | not_configured | offline_no_cache
   If the network is down, a cached OK result is trusted until its expires_at (offline:true). */
(function(){
var CFG={ url:"https://bxkdvddbjusbcjnzktry.supabase.co", anon:"sb_publishable_loLJqmab1TolWXLIdIrgHA_AlyghDQF" };          /* fill: "https://XXXX.supabase.co", "eyJ..." (anon public key) */
var LS="ss_license_v1";
function norm(k){return String(k||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^SS/,"").replace(/(.{4})(?=.)/g,"$1-").replace(/^/,"SS-")}
function load(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function save(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}
function cached(key,game){var c=load(),r=c.res&&c.res[key];if(!r||!r.ok)return null;
  if(game&&r.scope!=="all"&&r.scope!==game)return null;
  if(new Date(r.expires_at)<new Date())return null;return Object.assign({},r,{offline:true})}
var SSLicense={
  config:function(url,anon){CFG.url=String(url||"").replace(/\/+$/,"");CFG.anon=anon||""},
  normalize:norm,
  saved:function(){return load().key||""},
  check:function(key,game){
    if(!key)return Promise.resolve({ok:false,reason:"no_key"});
    key=norm(key);if(!CFG.url||!CFG.anon)return Promise.resolve({ok:false,reason:"not_configured"});
    var c=load();c.key=key;save(c);
    return fetch(CFG.url+"/rest/v1/rpc/check_license",{method:"POST",
      headers:{"Content-Type":"application/json",apikey:CFG.anon,Authorization:"Bearer "+CFG.anon},
      body:JSON.stringify({p_key:key,p_game:game||null})})
    .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json()})
    .then(function(res){var c=load();c.res=c.res||{};if(res.ok)c.res[key]=res;else delete c.res[key];save(c);return res})
    .catch(function(){return cached(key,game)||{ok:false,reason:"offline_no_cache"}});
  },
  daysLeft:function(res){return res&&res.expires_at?Math.max(0,Math.ceil((new Date(res.expires_at)-new Date())/864e5)):0},
  message:function(res){if(res.ok)return "Ключ активен ещё "+SSLicense.daysLeft(res)+" дн."+(res.offline?" (офлайн)":"");
    return {not_found:"Ключ не найден",revoked:"Ключ отключён",wrong_game:"Ключ для другого режима",expired:"Срок ключа закончился",
      no_key:"Введите ключ",not_configured:"Проверка ключей ещё не настроена",offline_no_cache:"Нет связи с сервером ключей",rate_limited:"Слишком много проверок, подождите минуту"}[res.reason]||"Ошибка проверки"}
};
window.SSLicense=SSLicense;
})();
/* StreamStorm: проверка ключа в игре. Только при src=tikfinity; демо не трогаем.
   Ключ не активен -> маленькая метка «DEMO · StreamStorm» в углу, игра работает.
   Проверка не настроена (нет URL Supabase) -> ничего не показываем. */
(function(){
  var GAME=document.currentScript&&document.currentScript.dataset.game||"";
  var q=new URLSearchParams(location.search);
  if((q.get("src")||"demo").toLowerCase()!=="tikfinity"||!window.SSLicense) return;
  var key=q.get("key")||SSLicense.saved(), mark=null;
  function place(){ if(!mark) return; var k=Math.min(innerWidth/1080,innerHeight/1920), r={left:(innerWidth-1080*k)/2, top:(innerHeight-1920*k)/2}; mark.style.left=(r.left+24*k)+"px"; mark.style.top=(r.top+968*k)+"px"; mark.style.fontSize=Math.max(9,22*k)+"px"; }
  function show(on){
    if(on&&!mark){ mark=document.createElement("div"); mark.id="ss-demo"; mark.textContent="DEMO · StreamStorm";
      mark.style.cssText="position:fixed;z-index:9999;pointer-events:none;font:800 26px system-ui,sans-serif;letter-spacing:.06em;color:#F5C542;"+
        "background:rgba(10,20,40,.72);border:1px solid rgba(245,197,66,.55);border-radius:999px;padding:.3em .8em;opacity:.85;";
      document.body.appendChild(mark); place(); addEventListener("resize",place); }
    else if(!on&&mark){ mark.remove(); mark=null; }
  }
  /* нет связи с сервером ключей -> метку не показываем (платный стример не должен видеть DEMO), повтор через 60 с */
  var tm=0;
  function run(){ clearTimeout(tm); SSLicense.check(key,GAME).then(function(r){ window.SS_LICENSE=r;
      var net=r.reason==="offline_no_cache"||r.reason==="rate_limited";
      if(!net) show(!r.ok&&r.reason!=="not_configured");
      tm=setTimeout(run,net?60*1000:30*60*1000); })
    .catch(function(){ tm=setTimeout(run,60*1000); }); }
  run();
})();
</script>
