<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Перетягивание над пропастью — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
<script id="sspro" data-game="tug-of-war">
/* ===================== StreamStorm PRO: гибкие настройки + премиальный стиль текста =====================
   1) Настройки. Любой ключ CONFIG можно поменять:
      ?c.roundSeconds=60&c.gifts.smallMax=4   (точка = вложенный ключ)
      ?cfg=<base64url JSON {"roundSeconds":60}>
      ?power=2      сила подарков (монеты ×2; 0.25–10)
      ?title=Текст  своё название игры в шапке;  ?accent=%23F5C542  цвет акцента
      Лаунчер: игра шлёт parent.postMessage({type:"ss-schema",game,title,schema}); живые правки
      {type:"ss-set",values:{"roundSeconds":60}}, каталог подарков {type:"ss-gifts",list:[{name,coins,img}]}.
   2) Стиль: шрифт Inter / SF / Segoe Variable, мягкая обводка, тёмно-синие стеклянные подложки вместо чёрных. */
(function(){
  "use strict";
  const Q=new URLSearchParams(location.search);
  // пока игра не получила свой масштаб — не показываем её (иначе первые кадры видно огромный заголовок)
  try{ const st=document.createElement("style"); st.textContent='#game:not([style*="width"]),#stage:not([style*="transform"]),#stagebg:not([style*="transform"]){visibility:hidden} html,body{background:#0A1428}'; document.head.appendChild(st); }catch(e){}

  // непрозрачные холсты (игра и рамка сцены): браузеру не нужно смешивать их с фоном страницы — дешевле на 120/144 Гц
  try{ const gc=HTMLCanvasElement.prototype.getContext; HTMLCanvasElement.prototype.getContext=function(t,o){ if(t==="2d"&&(this.id==="game"||this.id==="stagebg")) o=Object.assign({alpha:false},o||{}); return gc.call(this,t,o); }; }catch(e){}

  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const SKIP={wsUrl:1,safe:1};
  const num=(v,d)=>{ const n=parseFloat(v); return isFinite(n)?n:d; };
  // ---------- значения из ссылки
  const SET={};
  try{ const c=Q.get("cfg"); if(c){ const j=JSON.parse(decodeURIComponent(escape(atob(c.replace(/-/g,"+").replace(/_/g,"/"))))); if(j&&typeof j==="object") Object.assign(SET,flat(j)); } }catch(e){}
  for(const [k,v] of Q) if(k.startsWith("c.")&&k.length>2) SET[k.slice(2)]=v;
  function flat(o,p="",r={}){ for(const k in o){ const v=o[k], kk=p?p+"."+k:k; if(v&&typeof v==="object"&&!Array.isArray(v)) flat(v,kk,r); else r[kk]=v; } return r; }
  function coerce(old,v){ if(typeof old==="number") return num(v,old); if(typeof old==="boolean") return v===true||v==="1"||v==="true";
    if(Array.isArray(old)){ if(Array.isArray(v)) return v; const a=String(v).split(",").map(s=>s.trim()).filter(Boolean); return old.length&&typeof old[0]==="number"?a.map(x=>num(x,0)):a; }
    if(typeof old==="string") return String(v).slice(0,200); return v; }
  function setPath(C,path,v){ const ks=path.split("."); let o=C; for(let i=0;i<ks.length-1;i++){ if(!o||typeof o[ks[i]]!=="object") return false; o=o[ks[i]]; }
    const last=ks[ks.length-1]; if(!o||!(last in o)||SKIP[ks[0]]) return false; const old=o[last]; if(old&&typeof old==="object"&&!Array.isArray(old)) return false; o[last]=coerce(old,v); return true; }
  // ---------- схема для лаунчера: ключи CONFIG + подписи из комментариев исходника
  function schema(C,src){ const lab={}; if(src){ const m=src.match(/const CONFIG\s*=\s*\{[\s\S]*?\n\};/); if(m) for(const line of m[0].split("\n")){ const r=line.match(/^\s*(\w+)\s*:[^\/]*\/\/\s*(.+)$/); if(r) lab[r[1]]=r[2].trim().slice(0,120); } }
    const out=[]; (function walk(o,p){ for(const k in o){ if(!p&&SKIP[k]) continue; const v=o[k], kk=p?p+"."+k:k;
      if(v&&typeof v==="object"&&!Array.isArray(v)){ walk(v,kk); continue; }
      const t=Array.isArray(v)?(v.every(x=>typeof x!=="object")?"list":null):typeof v; if(!t||t==="function") continue;
      out.push({k:kk,type:t,v,label:lab[k]||LBL[kk]||LBL[k]||""}); } })(C,"");
    return out; }
  // подписи по умолчанию (если у ключа в CONFIG нет комментария)
  const LBL={endSeconds:"Экран победителя, сек",matchEndSeconds:"Экран победителя матча, сек",roundSeconds:"Длина раунда, сек",lobbySeconds:"Сбор перед раундом, сек",
    a:"Команда слева (код страны или цвета)",b:"Команда справа (код страны или цвета)",teams:"Команды (коды через запятую)",
    "vsTheme.from":"Фон дуэли: верхний цвет","vsTheme.to":"Фон дуэли: нижний цвет","vsTheme.edge":"Фон дуэли: цвет кромки","vsTheme.icon":"Значок дуэли (эмодзи)",
    burnerMult:"Горелка: множитель подъёма",stormLoss:"Шторм: потеря высоты",maxPerEvent:"Максимум за один подарок",maxPerSecond:"Максимум в секунду",
    maxPlayers:"Максимум бойцов",baseHP:"HP на старте",maxHP:"Максимум HP",hpGrowth:"Рост HP босса за раунд",stunSeconds:"Оглушение, сек",healShare:"Доля лечения",
    friction:"Трение мяча",distance:"Длина трассы",turboSeconds:"Турбо, сек",chargeMult:"Заряд: множитель",debateLen:"Длина дебатов, сек",debateBonus:"Бонус дебатов",
    blizzardMult:"Метель: множитель",contractIncome:"Доход контракта",tariffFactor:"Сила пошлины",housePerWave:"Домик: +HP за волну",fuelDrain:"Расход бензина в секунду",
    nitroMult:"Нитро: множитель",rocketMult:"Турбо-реактор: множитель",rageMult:"Ярость: множитель",spurMult:"Шпоры: множитель",shoeMult:"Золотая подкова: множитель",
    windGain:"Второе дыхание: прибавка",lives:"Жизни",likesPerPower:"Лайков на 1 очко силы",maxHeight:"Максимальная высота, м",followLift:"Подписка: подъём, м",
    shareLift:"Репост: подъём, м",joinLift:"Вход в команду: подъём, м","gifts.smallLiftPerCoin":"Мелкий подарок: подъём за монету, м","gifts.shieldSeconds":"Щит, сек",
    "gifts.freezeSeconds":"Заморозка лавы, сек",cols:"Колонок на карте",rows:"Рядов на карте",likesPerArmy:"Лайков на 1 армию",fortifyAmount:"Укрепление: сила",
    decayFlat:"Трон слабеет в секунду",likesPerCoin:"Лайков = 1 монета",likesPerStep:"Лайков на 1 шаг",anchorMax:"Якорь: максимум, сек",likesPerDamage:"Лайков на 1 урон",
    pauseSeconds:"Пауза между раундами, сек",hearts:"Сердца на старте",speed:"Скорость",energyPerCoin:"Энергия за монету",waveEvery:"Новая волна каждые, сек",houseHP:"HP домика",
    winsNeeded:"Побед до победы в матче",track:"Длина каната, шагов",coinPull:"Шагов за монету",drift:"Канат к центру, шаг/сек",anchorSeconds:"Якорь, сек"};
  let CFG=null;
  window.SS_APPLY=function(C){ CFG=C; let src=""; try{ src=document.currentScript?document.currentScript.textContent:""; }catch(e){}
    const def=JSON.parse(JSON.stringify(C,(k,v)=>typeof v==="function"?undefined:v));
    for(const k in SET) setPath(C,k,SET[k]);
    const sc=schema(def,src); window.SS_SCHEMA=sc;
    const send=()=>{ try{ if(parent&&parent!==window) parent.postMessage({type:"ss-schema",game:GAME,title:document.title.split(" — ")[0],schema:sc,current:flat(JSON.parse(JSON.stringify(C)))},"*"); }catch(e){} };
    send(); addEventListener("load",send); };
  addEventListener("message",e=>{ const d=e.data; if(!d||typeof d!=="object") return;
    if(d.type==="ss-set"&&CFG&&d.values&&typeof d.values==="object"){ for(const k in d.values) setPath(CFG,k,d.values[k]); }
    if(d.type==="ss-gifts"&&Array.isArray(d.list)){ const put=()=>{ const G=window.SSGifts; if(!G) return setTimeout(put,300); d.list.slice(0,300).forEach(x=>{ try{ G.put(x.name,x.coins,x.img||x.image||x.giftPictureUrl); }catch(_){} }); }; put(); } });
  // ---------- сила подарков (power= или diff=easy|normal|hard), подарки по имени в map=, likerate=
  const DIFF={easy:1.5,normal:1,hard:.7}[(Q.get("diff")||"").toLowerCase()]||1;
  const POWER=Math.max(.25,Math.min(10,num(Q.get("power"),1)*DIFF)), LR=Math.max(1,Math.min(500,num(Q.get("likerate"),0)))||0;
  window.SS_POWER=POWER;
  addEventListener("DOMContentLoaded",()=>{
    if(typeof window.onGift==="function"){ const og=window.onGift;   // map по имени подарка (повтор безопасен)
      window.onGift=function(u,unit,count,name,giftId,...r){
        try{ if(typeof GIFT_MAP!=="undefined"&&name){ const nk=String(name).toLowerCase(); if(!(giftId!=null&&GIFT_MAP.has(String(giftId)))&&GIFT_MAP.has(nk)) giftId=nk; } }catch(e){}
        return og.call(this,u,unit,count,name,giftId,...r); }; }
    // сила подарков — один раз, на входе события (перенос подарков между раундами не умножается повторно); дробный остаток копится у зрителя
    if(POWER!==1&&typeof window.handleRaw==="function"){ const oh=window.handleRaw, rem=new Map(), stk=new Map();
      window.handleRaw=function(msg){ try{
        const L=msg&&msg.type==="gift"&&msg.gift, ev=!L&&msg&&String(msg.event||msg.type||"").toLowerCase()==="gift", d=L?msg.gift:ev?(msg.data||msg):null;
        if(d){ const uid=String((msg.user&&msg.user.id)||d.uniqueId||d.userId||(d.user&&d.user.uniqueId)||"anon"), unit=Math.max(1,+(L?d.coins:d.diamondCount)||1);
          let n=Math.max(1,+(L?d.count:d.repeatCount)||1);
          if(!L&&+d.giftType===1){ const k=uid+"|"+(d.giftId||d.giftName), prev=stk.get(k)||0; n=(prev>0&&n>=prev)?n-prev:n; if(d.repeatEnd) stk.delete(k); else stk.set(k,+d.repeatCount||1); if(n<=0) return; }
          // монеты комбо целиком × сила + остаток зрителя; цена штуки ≈ цена×сила, чтобы ярус подарка не прыгал
          const T=unit*n*POWER+(rem.get(uid)||0), nu=Math.max(1,Math.floor(unit*POWER+1e-9)), nc=Math.floor(T/nu+1e-9);
          rem.set(uid,T-nc*nu); if(nc<=0) return;
          msg=JSON.parse(JSON.stringify(msg));
          if(L){ msg.gift.coins=nu; msg.gift.count=nc; } else { const dd=msg.data||msg; dd.diamondCount=nu; dd.repeatCount=nc; dd.giftType=0; delete dd.repeatEnd; } }
      }catch(e){} return oh.call(this,msg); }; }
    if(Q.has("likerate")&&typeof window.likePoints==="function"){ const lp=window.likePoints; window.likePoints=function(u,n,per){ return lp.call(this,u,n,num(Q.get("likerate"),per)||per); }; }
  });
  // ---------- премиальный HUD для игр на общем ядре: стеклянная шапка, баннер и лента
  addEventListener("DOMContentLoaded",()=>{ if(Q.get("style")==="classic") return; try{
    if(typeof drawHeader!=="function"||typeof rr!=="function"||typeof ctx==="undefined") return;
    const mk=(w,h)=>{ const c=document.createElement("canvas"); c.width=Math.ceil(w); c.height=Math.ceil(h); return c; };
    const rk=(k,x,y,w,h,r)=>{ k.beginPath(); k.moveTo(x+r,y); k.arcTo(x+w,y,x+w,y+h,r); k.arcTo(x+w,y+h,x,y+h,r); k.arcTo(x,y+h,x,y,r); k.arcTo(x,y,x+w,y,r); k.closePath(); };
    const glass=(k,x,y,w,h,r,a)=>{ const gr=k.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,`rgba(30,46,82,${a})`); gr.addColorStop(1,`rgba(10,20,40,${a+.08})`); k.fillStyle=gr; rk(k,x,y,w,h,r); k.fill(); k.lineWidth=2; k.strokeStyle="rgba(255,255,255,.16)"; k.stroke(); };
    const tx=(k,t,x,y,size,c,w,maxW)=>{ k.font=`${w} ${size}px ${FAM}`; while(maxW&&size>14&&k.measureText(t).width>maxW){ size--; k.font=`${w} ${size}px ${FAM}`; }
      k.textAlign="center"; k.textBaseline="middle"; k.lineJoin="round"; k.lineWidth=Math.max(3,size/9*.62*1.6); k.strokeStyle="rgba(6,12,28,.62)"; k.strokeText(t,x,y+1); k.fillStyle=c; k.fillText(t,x,y); };
    let hk="", hc=null, hw=0;
    window.drawHeader=function(title,color,sub){
      if(STREAMER) txt("@"+STREAMER,40,TOP-30,24,"rgba(255,255,255,.6)","left",700,false);
      if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",PW-60,TOP-30,22,"#f88","center",700);
      const key=title+"|"+color+"|"+(sub||"");
      if(key!==hk||!hc){ hk=key; const k0=mk(4,4).getContext("2d"); k0.font=`900 60px ${FAM}`; const tw=Math.min(PW-60,k0.measureText(TITLE&&window.SS_TITLE_SRC===title?TITLE:title).width), w=Math.min(PW-30,Math.max(tw+120,sub?620:0)), h=sub?136:84;
        hw=w; hc=mk(PW,h+8); const k=hc.getContext("2d"); const ox=CX-w/2; glass(k,ox,2,w,h,34,.5); k.fillStyle=color; k.globalAlpha=.9; rk(k,CX-60,h-5,120,4,2); k.fill(); k.globalAlpha=1;
        tx(k,title,CX,42,60,color,900,PW-80); if(sub) tx(k,sub,CX,102,30,"#E2E8F0",700,w-40); }
      ctx.drawImage(hc,0,TOP-6); };
    const bc=new WeakMap();
    window.drawBanner=function(y){ if(!banner) return; let c=bc.get(banner);
      if(!c){ c=mk(960,250); const k=c.getContext("2d"); k.translate(480,115); k.shadowColor="rgba(0,0,0,.5)"; k.shadowBlur=30; k.shadowOffsetY=10; glass(k,-440,-84,880,168,38,.86); k.shadowBlur=0; k.shadowOffsetY=0;
        k.fillStyle=banner.c; rk(k,-90,-84,180,5,3); k.fill(); tx(k,banner.title,0,-24,58,banner.c,900,820); tx(k,banner.sub,0,38,30,"#F8FAFC",700,820); bc.set(banner,c); }
      const a=Math.min(1,banner.life*2), kk=Math.min(1,Math.max(0,(2.8-banner.life)/.25)), s=.92+.08*(1-Math.pow(1-kk,3));
      ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,y); ctx.scale(s,s); ctx.drawImage(c,-480,-115); ctx.restore(); };
    const fc2=new WeakMap();
    window.drawFeed=function(y,gap=36){ feed.forEach((f,i)=>{ let c=fc2.get(f);
        if(!c){ c=mk(PW,gap); const k=c.getContext("2d"); k.font=`700 24px ${FAM}`; const w=Math.min(PW-80,k.measureText(f.text).width+44); k.fillStyle="rgba(14,26,52,.66)"; rk(k,CX-w/2,3,w,gap-6,(gap-6)/2); k.fill(); tx(k,f.text,CX,gap/2,24,f.c,800,PW-120); fc2.set(f,c); }
        ctx.globalAlpha=Math.min(1,f.life); ctx.drawImage(c,0,y+i*gap-gap/2); }); ctx.globalAlpha=1; };
  }catch(e){} });
  // ---------- премиальный текст: шрифт, мягкая обводка, стекло вместо чёрного
  const FAM='"Inter","SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif';
  try{ const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap"; document.head.appendChild(l); }catch(e){}
  const TITLE=(Q.get("title")||"").slice(0,40), ACC=/^#[0-9a-f]{3,8}$/i.test(Q.get("accent")||"")?Q.get("accent"):null;
  const P=CanvasRenderingContext2D.prototype, fd=Object.getOwnPropertyDescriptor(P,"font"), sd=Object.getOwnPropertyDescriptor(P,"strokeStyle"), fsd=Object.getOwnPropertyDescriptor(P,"fillStyle");
  const fc=new Map();
  if(fd&&fd.set) Object.defineProperty(P,"font",{get:fd.get,set(v){ let r=fc.get(v); if(r===undefined){ r=String(v).replace(/"Segoe UI",\s*"Arial Black",\s*system-ui,\s*sans-serif|"Arial Black",\s*"Segoe UI"[^;]*?sans-serif|Arial Black|Impact/g,FAM); if(fc.size>800) fc.clear(); fc.set(v,r); } fd.set.call(this,r); },configurable:true});
  // чёрные подложки и затемнения → глубокий navy (стекло StreamStorm)
  const navy=new Map();
  const tint=v=>{ if(typeof v!=="string") return v; let r=navy.get(v); if(r===undefined){ const m=v.match(/^rgba\(\s*0\s*,\s*0\s*,\s*0\s*,\s*([\d.]+)\s*\)$/); r=m?`rgba(8,16,34,${Math.min(.92,+m[1]+.04)})`:v; if(ACC&&/^#(F5C542|FFD23F|FFD978|F5C542)$/i.test(v)) r=ACC; if(navy.size>400) navy.clear(); navy.set(v,r); } return r; };
  if(fsd&&fsd.set) Object.defineProperty(P,"fillStyle",{get:fsd.get,set(v){ fsd.set.call(this,tint(v)); },configurable:true});
  // обводка текста: чёрная толстая → мягкая полупрозрачная тонкая
  const st=P.strokeText;
  P.strokeText=function(t,x,y,...a){ const ss=sd.get.call(this); if(typeof ss==="string"&&/^rgba\(0,\s*0,\s*0,\s*\.?[5-9]|^#000/.test(ss)&&this.lineWidth>=4){ const lw=this.lineWidth; sd.set.call(this,"rgba(6,12,28,.62)"); this.lineWidth=Math.max(3,lw*.62); st.call(this,TITLE&&window.SS_TITLE_SRC===t?TITLE:t,x,y+1,...a); this.lineWidth=lw; sd.set.call(this,ss); return; } return st.call(this,TITLE&&window.SS_TITLE_SRC===t?TITLE:t,x,y,...a); };
  if(TITLE){ const ft=P.fillText, mt=P.measureText; window.SS_TITLE_SRC=null;
    const isT=t=>{ if(typeof t!=="string") return false; if(window.SS_TITLE_SRC) return t===window.SS_TITLE_SRC; const base=document.title.split(" — ")[0].replace(/[^\p{L}\p{N} ]/gu,"").trim().toUpperCase(); const tt=t.replace(/[^\p{L}\p{N} ]/gu,"").trim().toUpperCase(); if(base&&tt===base){ window.SS_TITLE_SRC=t; return true; } return false; };
    P.fillText=function(t,...a){ return ft.call(this,isT(t)?TITLE:t,...a); }; P.measureText=function(t){ return mt.call(this,isT(t)?TITLE:t); }; }
})();
</script>
<script id="modes" data-game="tug-of-war">
/* ===================== РЕЖИМЫ StreamStorm: выбор категории до эфира (?mode=) =====================
   Лаунчер добавляет &mode=<id>. Режим только подставляет состав команд (параметры teams / a,b),
   поэтому правила игры не меняются. Явные teams=, a=, b= в ссылке важнее режима. */
(function(){
  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const MODES={
    "lava-rising":  {countries:{teams:"KZ,UZ,PL,DE,TR,BR"}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "country-race": {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "tower":        {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "paint-map":    {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "chat-football":{duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-fans":    {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-space":   {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-summit":  {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-trade":   {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-snow":    {duel:{}, colors:{a:"RED",b:"BLU"}},
    "horse-race":   {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "duel-energy":  {duel:{}, colors:{a:"RED",b:"BLU"}},
    "balloon-race": {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
  };

<body>
<canvas id="game" width="1080" height="1920"></canvas>
<div id="panel">
  <h3>🪢 Пульт ведущего <small style="display:inline">(H — скрыть)</small></h3>
  <div id="status" class="wait">⏳</div>
  <div class="row"><button data-a="L1">◀ 🌹 1</button><button data-a="R1">🌹 1 ▶</button></div>
  <div class="row"><button data-a="L30">◀ 💎 30</button><button data-a="R30">💎 30 ▶</button></div>
  <div class="row"><button data-a="L199">◀ 🚀 199</button><button data-a="R199">🚀 199 ▶</button></div>
  <div class="row"><button data-a="Llike">◀ ❤️</button><button data-a="Rlike">❤️ ▶</button></div>
  <button data-a="bots" id="botsBtn">🤖 Демо-боты</button>
  <button data-a="restart">🔄 Новый матч</button>
  <small>Клавиши: Q/W/E подарки левым · I/O/P правым · B боты · R рестарт · H пульт</small>
</div>
<script>
"use strict";
/* ===================== НАСТРОЙКИ (или параметры ссылки, см. README) ===================== */
const CONFIG = {
  wsUrl: "ws://localhost:21213/",
  roundSeconds: 90,      // один раунд
  winsNeeded: 2,         // матч до 2 побед
  endSeconds: 6, matchEndSeconds: 10,
  teams: [ {name:"КРАСНЫЕ", color:"#ff4d5e", words:["красные","красный","red","left"]},
           {name:"СИНИЕ",   color:"#3fa4ff", words:["синие","синий","blue","right"]} ],
  track: 300,            // до края пропасти N шагов
  coinPull: 1.0,         // 1 монета = 1 шаг
  maxPerEvent: 0.3,      // один подарок двигает канат не больше чем на 30% пути
  likesPerStep: 15,
  anchorSeconds: 5,      // подарок 100+: якорь — рывки соперника вдвое слабее N сек
  anchorMax: 8,
  drift: 2,              // канат сам тянется к центру, шаг/сек
  safe: {top: 150, right: 110},
};
if(window.SS_APPLY) SS_APPLY(CONFIG);
const Q=new URLSearchParams(location.search);
if(Q.get("ws")) CONFIG.wsUrl=Q.get("ws");
if(Q.get("round")) CONFIG.roundSeconds=Math.max(20,+Q.get("round")||90);
if(Q.get("left")) CONFIG.teams[0].name=Q.get("left").toUpperCase().slice(0,14);
if(Q.get("right")) CONFIG.teams[1].name=Q.get("right").toUpperCase().slice(0,14);
const SRC=(Q.get("src")||"demo").toLowerCase();
const STREAMER=(Q.get("user")||"").replace(/^@/,"").slice(0,30);
const LIKES_ON=Q.get("likes")!=="0";
const JOIN_CMD=(Q.get("join")||"!join").trim().toLowerCase();
// map=giftId:action:power — pull (тянуть N) · anchor (якорь N сек) · none
const GIFT_MAP=new Map();
(Q.get("map")||"").split(",").forEach(x=>{const [id,a,p]=x.split(":"); if(id&&a) GIFT_MAP.set(String(id).trim(),{action:a.trim().toLowerCase(),power:+p||0});});
const OBS=Q.get("obs")==="1";
if(OBS||!!window.obsstudio||(Q.has("src")&&Q.get("panel")!=="1")) document.getElementById("panel").style.display="none";

const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, PW=W-CONFIG.safe.right, CX=PW/2+20;
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';
const RY=1000; // высота каната

/* ===================== Состояние ===================== */
let pos=0, vpos=0;            // -100 (победа левых) … +100 (победа правых)
let score=[0,0], phase="play", phaseT=CONFIG.roundSeconds, roundN=1, time=0, shake=0;
let anchor=[0,0], queue=[0,0];            // сек якоря у команды i (противник не тянет)
let members=new Map();       // id -> 0/1
let contrib=[new Map(),new Map()]; // id -> {name,avatar,pts}
let parts=[], floaters=[], feed=[], banner=null, faller=null, lastWin=-1, jerk=0;
const streaks=new Map(), likeBank=new Map(), avatars=new Map();
let botsOn=SRC==="demo"||Q.get("demo")==="1";

function teamOf(u){ if(members.has(u.id)) return members.get(u.id);
  const c0=[...members.values()].filter(v=>v===0).length, c1=members.size-c0; const t=c0<=c1?0:1; members.set(u.id,t);
  addFeed(`${u.name} → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color); return t; }
function credit(t,u,pts){ let c=contrib[t].get(u.id); if(!c){c={name:u.name,avatar:u.avatar,pts:0};contrib[t].set(u.id,c);} c.name=u.name; if(u.avatar)c.avatar=u.avatar; c.pts+=pts; }

function newRound(){ pos=0; anchor=[0,0]; queue=[0,0]; phase="play"; phaseT=CONFIG.roundSeconds; faller=null; showBanner(`РАУНД ${roundN}`,"Дарите подарки — тяните канат!","#ffd23f"); }
function newMatch(){ score=[0,0]; roundN=1; contrib=[new Map(),new Map()]; newRound(); }
function winRound(t){
  score[t]++; lastWin=t; phase="roundEnd"; shake=1;
  const loser=1-t; const top=[...contrib[loser].values()].sort((a,b)=>b.pts-a.pts)[0];
  faller={name:top?top.name:CONFIG.teams[loser].name, x:t===0?PW-170:190, y:RY, vy:0, side:loser};
  burst(t===0?190:PW-170,RY-120,CONFIG.teams[t].color,80);
  if(score[t]>=CONFIG.winsNeeded){ phase="matchEnd"; phaseT=CONFIG.matchEndSeconds; }
  else { phaseT=CONFIG.endSeconds; showBanner(`${CONFIG.teams[t].name} +1`,`${faller.name} летит в пропасть!`,CONFIG.teams[t].color); }
}

/* ===================== Действия ===================== */
function pull(t,u,steps,label){
  if(phase!=="play"||steps<=0) return;
  if(anchor[1-t]>0) steps*=0.5; // якорь соперника — рывок вдвое слабее
  queue[t]+=steps; credit(t,u,steps); // рывки идут через очередь: не больше 30% пути за ~2.5 с
  if(steps>=5&&floaters.length<25) floaters.push({x:t===0?320:PW-320,y:RY-180,text:`${t===0?"◀":""} ${Math.round(steps)} ${t===1?"▶":""}`,c:CONFIG.teams[t].color,life:1.3});
}
function onGift(u,unit,count,name,giftId){
  if(phase!=="play") return; const t=teamOf(u); const coins=unit*count;
  const mp=giftId!=null&&GIFT_MAP.get(String(giftId));
  if(mp){ if(mp.action==="none") return; if(mp.action==="anchor") return setAnchor(t,u,mp.power*count,name); credit(t,u,0); return pull(t,u,mp.power*count,name); }
  if(unit>=100){ setAnchor(t,u,CONFIG.anchorSeconds*count,name); }
  pull(t,u,coins*CONFIG.coinPull,name);
  if(coins>=10) addFeed(`🎁 ${u.name}: ${name}×${count} → ${CONFIG.teams[t].name} +${coins} 💰`,CONFIG.teams[t].color);
}
function setAnchor(t,u,sec,name){ anchor[t]=Math.min(CONFIG.anchorMax,anchor[t]+sec); showBanner(`⚓ ${u.name}`,`${name}: ${CONFIG.teams[1-t].name} тянут вдвое слабее ${Math.round(anchor[t])} с`,CONFIG.teams[t].color); }
function onLike(u,n){ if(phase!=="play"||!LIKES_ON) return; const t=teamOf(u); const b=(likeBank.get(u.id)||0)+n; const s=Math.floor(b/CONFIG.likesPerStep); likeBank.set(u.id,b%CONFIG.likesPerStep); if(s) pull(t,u,s,"лайки");
  if(Math.random()<.3) parts.push({x:t===0?120+Math.random()*250:PW-120-Math.random()*250,y:1500,vx:0,vy:-220,life:1.3,emo:"❤️",size:32}); }
function onComment(u,text){ const s=" "+String(text).toLowerCase().replace(/[!?.,]/g," ")+" ";
  const ex=String(text).trim(); if(ex==="1"||ex==="2"){ const t=+ex-1; if(members.get(u.id)!==t){ members.set(u.id,t); addFeed(`${u.name} → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color);} return; }
  for(let t=0;t<2;t++) for(const w of [CONFIG.teams[t].name.toLowerCase(),...CONFIG.teams[t].words]) if(s.includes(" "+w+" ")){ if(members.get(u.id)!==t){ members.set(u.id,t); addFeed(`${u.name} → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color);} return; }
  if(s.trim().startsWith(JOIN_CMD.replace(/[!?.,]/g,"").trim())) teamOf(u); }
function onFollow(u){ const t=teamOf(u); pull(t,u,5,"подписка"); addFeed(`➕ ${u.name} подписался: +5 → ${CONFIG.teams[t].name}`,CONFIG.teams[t].color); }

/* ===================== Подключение ===================== */
let ws=null, wsState="wait";
function setStatus(s,t){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=t; }
function connect(){ try{ws=new WebSocket(CONFIG.wsUrl);}catch(e){setStatus("bad","❌ Неверный адрес");return;}
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl); ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{try{handleRaw(JSON.parse(e.data));}catch(_){}}; ws.onclose=()=>{setStatus("bad","🔴 Нет связи — переподключаюсь…");setTimeout(connect,3000);}; ws.onerror=()=>{try{ws.close();}catch(_){}}; }
function handleRaw(msg){
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user, base={uniqueId:u.id,nickname:u.name};
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};
    else msg={event:msg.type,data:base}; }
  const ev=String(msg.event||msg.type||"").toLowerCase(), d=msg.data||msg, uu=d.user||{};
  const u={id:String(d.uniqueId||d.userId||uu.uniqueId||"anon"), name:String(d.nickname||uu.nickname||d.uniqueId||"Зритель").slice(0,22), avatar:d.profilePictureUrl||uu.profilePictureUrl||null};
  switch(ev){
    case "chat": case "comment": onComment(u,d.comment||""); break;
    case "like": onLike(u,Math.min(200,+d.likeCount||1)); break;
    case "follow": onFollow(u); break;
    case "gift": { const unit=+(d.diamondCount||1), name=String(d.giftName||"подарок").slice(0,20), rc=+(d.repeatCount||1);
      if(+d.giftType===1){ const key=u.id+"|"+(d.giftId||name), prev=streaks.get(key)||0, delta=(prev>0&&rc>=prev)?rc-prev:rc;
        if(d.repeatEnd) streaks.delete(key); else streaks.set(key,rc); if(delta>0) onGift(u,unit,delta,name,d.giftId); }
      else onGift(u,unit,rc,name,d.giftId); }
  }
}

/* ===================== Обновление ===================== */
function update(dt){
  phaseT-=dt;
  if(phase==="play"){
    for(let i=0;i<2;i++){ anchor[i]=Math.max(0,anchor[i]-dt); const rel=Math.min(queue[i],CONFIG.track*CONFIG.maxPerEvent/2.5*dt); queue[i]-=rel; pos+=(i===0?-1:1)*rel; jerk=Math.min(1,jerk+rel/4); }
    if(Math.abs(pos)>0.1) pos-=Math.sign(pos)*Math.min(Math.abs(pos),CONFIG.drift*dt);
    if(pos<=-CONFIG.track) winRound(0); else if(pos>=CONFIG.track) winRound(1);
    else if(phaseT<=0){ if(Math.abs(pos)<1){ showBanner("НИЧЬЯ","Ещё раунд!","#fff"); newRound(); } else winRound(pos<0?0:1); }
  } else if(phase==="roundEnd"&&phaseT<=0){ roundN++; newRound(); }
  else if(phase==="matchEnd"&&phaseT<=0) newMatch();
  pos=Math.max(-CONFIG.track,Math.min(CONFIG.track,pos)); vpos+=(pos-vpos)*Math.min(1,dt*6); jerk=Math.max(0,jerk-dt*2); shake=Math.max(0,shake-dt*2);
  if(faller){ faller.vy+=1400*dt; faller.y+=faller.vy*dt; }
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;} parts=parts.filter(p=>p.life>0); if(parts.length>500) parts.splice(0,parts.length-500);
  floaters.forEach(f=>{f.life-=dt;f.y-=60*dt;}); floaters=floaters.filter(f=>f.life>0);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);
  if(banner){banner.life-=dt; if(banner.life<=0) banner=null;}
  if(botsOn) runBots(dt);
}

/* ===================== Отрисовка ===================== */
function txt(s,x,y,size,c,align="center",w=900,stroke=true){ ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";
  if(stroke){ctx.lineWidth=Math.max(4,size/6);ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineJoin="round";ctx.strokeText(s,x,y);} ctx.fillStyle=c; ctx.fillText(s,x,y); }
function fit(s,x,y,size,maxW,c){ ctx.font=`900 ${size}px ${FONT}`; while(size>14&&ctx.measureText(s).width>maxW){size--;ctx.font=`900 ${size}px ${FONT}`;} txt(s,x,y,size,c); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function avatar(name,url,x,y,r,ring){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); const im=avatarImg(url);
  if(im&&im.complete&&im.naturalWidth){ctx.clip();ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();}

  const br=Math.sin(time*7+x*.05)*2.5;
  ctx.save(); ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(x,y+74,44,9,0,0,Math.PI*2); ctx.fill();
  // ноги: передняя упирается, задняя согнута
  ctx.strokeStyle="#4a5677"; ctx.lineWidth=16;
  ctx.beginPath(); ctx.moveTo(x,y+12); ctx.lineTo(x-lean*22,y+42); ctx.lineTo(x-lean*34,y+70); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y+12); ctx.lineTo(x+lean*14,y+44); ctx.lineTo(x+lean*6,y+70); ctx.stroke();
  ctx.fillStyle="#0b0f1a"; for(const fx of [x-lean*34,x+lean*6]){ ctx.beginPath(); ctx.ellipse(fx-lean*6,y+72,15,7,0,0,Math.PI*2); ctx.fill(); }

  ctx.strokeStyle="#2b3350"; ctx.lineWidth=30; ctx.beginPath(); ctx.moveTo(x,y+14); ctx.lineTo(x+lean*6,y+2); ctx.stroke();
  ctx.strokeStyle=c; ctx.lineWidth=30; ctx.beginPath(); ctx.moveTo(x+lean*4,y); ctx.lineTo(x+lean*26,y-48+br); ctx.stroke();
  ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x-lean*6,y-4); ctx.lineTo(x+lean*16,y-48+br); ctx.stroke();
  ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x+lean*14,y+2); ctx.lineTo(x+lean*36,y-42+br); ctx.stroke();
  // руки тянут канат
  ctx.strokeStyle=c; ctx.lineWidth=13; ctx.beginPath(); ctx.moveTo(x+lean*24,y-42+br); ctx.lineTo(x-lean*4,y-22); ctx.lineTo(x-lean*32,y-10); ctx.stroke();
  ctx.fillStyle="#f2c9a0"; ctx.beginPath(); ctx.arc(x-lean*34,y-10,9,0,Math.PI*2); ctx.fill();
  // голова-аватар с повязкой
  avatar(name,url,x+lean*34,y-80+br,27,c);
  ctx.strokeStyle=c; ctx.lineWidth=7; ctx.beginPath(); ctx.arc(x+lean*34,y-80+br,28,-2.7,-.45); ctx.stroke();
  if(name&&name.trim()){ ctx.font=`800 20px ${FONT}`; const tw=Math.min(110,ctx.measureText(name).width+20); ctx.fillStyle="rgba(0,0,0,.55)"; rr(x+lean*30-tw/2,y-150,tw,30,15); ctx.fill(); fit(name,x+lean*30,y-135,20,96,"#fff"); }

}

function draw(){
  ctx.save(); if(shake>0) ctx.translate((Math.random()-.5)*26*shake,(Math.random()-.5)*26*shake);
  ctx.drawImage(TEX.cached("tug_sky",W+80,H+80,(k)=>{ const sky=k.createLinearGradient(0,40,0,H+40); sky.addColorStop(0,"#0d1630"); sky.addColorStop(.5,"#2b2350"); sky.addColorStop(1,"#05030a"); k.fillStyle=sky; k.fillRect(0,0,W+80,H+80); }),-40,-40);   // запечено

  const mg=ctx.createRadialGradient(780,740,10,780,740,140); mg.addColorStop(0,"rgba(255,250,230,.95)"); mg.addColorStop(.35,"rgba(255,240,200,.25)"); mg.addColorStop(1,"rgba(255,240,200,0)"); ctx.fillStyle=mg; ctx.fillRect(640,600,280,280);
  ctx.fillStyle="#fffbe9"; ctx.beginPath(); ctx.arc(780,740,44,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(200,195,180,.5)"; ctx.beginPath(); ctx.arc(765,730,9,0,Math.PI*2); ctx.arc(795,755,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle="#241a3d"; ctx.beginPath(); ctx.moveTo(0,RY+60); for(let i=0;i<=12;i++) ctx.lineTo(i*W/12,RY-150-((i*53)%5)*34-(i%2)*60); ctx.lineTo(W,RY+60); ctx.fill();
  ctx.fillStyle="#1a1330"; ctx.beginPath(); ctx.moveTo(0,RY+60); for(let i=0;i<=9;i++) ctx.lineTo(i*W/9,RY-60-((i*37)%4)*30); ctx.lineTo(W,RY+60); ctx.fill();
  // пропасть с туманом
  ctx.drawImage(TEX.cached("tug_abyss|"+RY,W,H-RY-60,(k)=>{ const ab=k.createLinearGradient(0,0,0,H-RY-60); ab.addColorStop(0,"#1a1230"); ab.addColorStop(1,"#000"); k.fillStyle=ab; k.fillRect(0,0,W,H); }),0,RY+60);   // запечено
  for(let i=0;i<8;i++){ ctx.fillStyle=`rgba(160,140,220,${.06})`; ctx.beginPath(); ctx.ellipse((i*190+time*25)%(W+300)-150,RY+260+i*60,260,50,0,0,Math.PI*2); ctx.fill(); }
  // утёсы
  const cliff=(x0,x1,dir)=>{ ctx.fillStyle="#3a2d48"; ctx.beginPath(); ctx.moveTo(x0,RY+60); ctx.lineTo(x1,RY+60); ctx.lineTo(x1-dir*40,RY+300); ctx.lineTo(x1-dir*10,RY+520); ctx.lineTo(x1-dir*70,H); ctx.lineTo(x0,H); ctx.fill(); if(window.TEX){ TEX.path(ctx,"rock",1); const sh=ctx.createLinearGradient(x0,0,x1,0); sh.addColorStop(0,"rgba(0,0,0,.35)"); sh.addColorStop(1,"rgba(255,255,255,.04)"); ctx.fillStyle=sh; ctx.fill(); }
    ctx.strokeStyle="rgba(0,0,0,.22)"; ctx.lineWidth=4; for(let k=1;k<6;k++){ const yy=RY+60+k*70; ctx.beginPath(); ctx.moveTo(x0,yy); ctx.lineTo(x1-dir*(20+k*8),yy+((k%2)?10:-6)); ctx.stroke(); }
    ctx.fillStyle="rgba(255,255,255,.05)"; ctx.beginPath(); ctx.moveTo(x1,RY+60); ctx.lineTo(x1-dir*40,RY+300); ctx.lineTo(x1-dir*70,RY+300); ctx.lineTo(x1-dir*30,RY+60); ctx.fill();

    ctx.fillStyle="#6cb34f"; for(let gx=Math.min(x0,x1)+8;gx<Math.max(x0,x1)-8;gx+=22){ ctx.beginPath(); ctx.moveTo(gx,RY+54); ctx.lineTo(gx+5,RY+38+Math.sin(time*2+gx)*3); ctx.lineTo(gx+10,RY+54); ctx.fill(); } };

  const flashCv=document.createElement("canvas"); flashCv.width=270; flashCv.height=480;
  { const fg=flashCv.getContext("2d"), gr=fg.createRadialGradient(135,190,12,135,190,225); gr.addColorStop(0,"rgba(255,220,120,.45)"); gr.addColorStop(1,"rgba(255,140,0,0)"); fg.fillStyle=gr; fg.fillRect(0,0,270,480); }
  // «+X» рисуем один раз в маленький холст, дальше только drawImage
  function popCv(p){ const tmp=g, c=document.createElement("canvas"); const im=img(p.pic), hasP=ready(im); g=c.getContext("2d"); g.font=`900 ${p.size}px ${F}`;
    const tw=Math.ceil(g.measureText(p.text).width), ps=hasP?Math.round(p.size*1.35):0, w=tw+p.size+ps+(hasP?8:0); c.width=w; c.height=Math.ceil(p.size*1.9); g=c.getContext("2d");
    if(hasP){ g.shadowColor="rgba(255,214,120,.8)"; g.shadowBlur=p.size*.4; g.drawImage(im,p.size/2,(c.height-ps)/2,ps,ps); g.shadowBlur=0; }
    g.textAlign="left"; text(p.text,p.size/2+ps+(hasP?8:0),c.height/2,p.size,p.c,"left"); g=tmp; p.cv=c; p.picOk=hasP||!p.pic; }
  let idle=false, lastW="";
  function drawCard(c){
    if(!c.cv||c.dirty||(!c.imgsOk&&ready(img(c.u.avatar)))||(!c.picOk&&ready(img(c.pic)))) renderCard(c);
    const sc=c.s*(1+c.bump*.12)*c.T.scale; if(sc<=0) return;
    g.save(); g.translate(c.x,c.y); g.scale(sc,sc); g.drawImage(c.cv,-(CW/2+PAD),-(CH/2+PAD)); g.restore();
  }
  function step(now){
    if(waitQ.length&&!bannerOn()) for(let n=0;n<3&&waitQ.length;n++) add(...waitQ.shift());
    if(bigQ.length&&!bannerOn()&&bigsOn()<BIGMAX()) add(...bigQ.shift());
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(base.style.width!==lastW){ lastW=base.style.width; fx.style.width=base.style.width; fx.style.height=base.style.height; }
    for(const c of cards){ c.bump=Math.max(0,c.bump-dt*4); c.t+=dt;
      if(c.st===0){ c.s=Math.min(1,c.t/.18)*(1+Math.sin(Math.min(1,c.t/.3)*Math.PI)*.18); if(c.t>=c.T.hold+.2){ c.st=1; c.t=0; const tg=target(c.u.id); c.tx=tg.x; c.ty=tg.y; c.tc=tg.color||c.T.c1; c.sx=c.x; c.sy=c.y; } }
      else if(c.st===1){ const k=Math.min(1,c.t/.55), e=k*k*(3-2*k); c.x=c.sx+(c.tx-c.sx)*e; c.y=c.sy+(c.ty-c.sy)*e-Math.sin(k*Math.PI)*120; c.s=1-.75*e;
        if(sparks.length<120) for(let i=0;i<(c.tier==="big"?4:2);i++) sparks.push({x:c.x+(Math.random()-.5)*30,y:c.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.5,c:c.T.c1,r:3+Math.random()*4});
        if(k>=1){ c.st=2; const n=c.T.parts; for(let i=0;i<n&&sparks.length<160;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*(c.tier==="big"?700:380); sparks.push({x:c.tx,y:c.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7+Math.random()*.5,c:Math.random()<.5?c.tc:c.T.c1,r:3+Math.random()*(c.tier==="big"?9:5),gr:500}); }
          rings.push({x:c.tx,y:c.ty,r:10,max:c.tier==="big"?420:c.tier==="mid"?220:110,c:c.tc,life:1});
          pops.push({x:c.tx,y:c.ty-40,text:`+${c.coins}`,c:"#fff",size:c.tier==="big"?72:c.tier==="mid"?56:44,life:1.3,pic:picFor(c.pic,c.coins/c.count)}); } } }
    cards=cards.filter(c=>c.st<2);
    for(const p of sparks){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.gr) p.vy+=p.gr*dt; } sparks=sparks.filter(p=>p.life>0);
    for(const r of rings){ r.life-=dt*1.6; r.r+=(r.max-r.r)*Math.min(1,dt*7); } rings=rings.filter(r=>r.life>0);
    for(const p of pops){ p.life-=dt; p.y-=70*dt; } pops=pops.filter(p=>p.life>0); if(pops.length>20) pops.splice(0,pops.length-20);
    flash=Math.max(0,flash-dt*2);
    const active=flash>0||cards.length||sparks.length||rings.length||pops.length;
    if(!active){ if(!MERGED){ if(!idle){ g.clearRect(0,0,1080,1920); idle=true; } requestAnimationFrame(step); } return; } idle=false;
    if(MERGED) g.save(); else { g.setTransform(.75,0,0,.75,0,0); g.clearRect(0,0,1080,1920); }
    if(flash>0){ g.globalAlpha=flash; g.drawImage(flashCv,0,0,1080,1920); g.globalAlpha=1; }
    for(const r of rings){ g.globalAlpha=Math.max(0,r.life); g.strokeStyle=r.c; g.lineWidth=10*r.life+2; g.beginPath(); g.arc(r.x,r.y,r.r,0,Math.PI*2); g.stroke(); } g.globalAlpha=1;
    for(const p of sparks){ g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); g.fillStyle=p.c; g.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } g.globalAlpha=1;
    for(const c of cards) if(c.tier!=="big") drawCard(c);
    for(const c of cards) if(c.tier==="big") drawCard(c); // большие всегда поверх
    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv||(!p.picOk&&ready(img(p.pic)))) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    if(MERGED) g.restore(); else requestAnimationFrame(step);
  }
  if(MERGED) window.__fxStep=step; else requestAnimationFrame(step);
})();
</script>
