<!doctype html>

<head>

<title>Лава поднимается — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07040a;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  body.obs{background:transparent}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}

  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}

<script id="sspro" data-game="lava-rising">
/* ===================== StreamStorm PRO: гибкие настройки + премиальный стиль текста =====================
   1) Настройки. Любой ключ CONFIG можно поменять:
      ?c.roundSeconds=60&c.gifts.smallMax=4   (точка = вложенный ключ)
      ?cfg=<base64url JSON {"roundSeconds":60}>
      ?power=2      сила подарков (монеты ×2; 0.25–10)
      ?title=Текст  своё название игры в шапке;  ?accent=%23F5C542  цвет акцента
      Лаунчер: игра шлёт parent.postMessage({type:"ss-schema",game,title,schema}); живые правки
      {type:"ss-set",values:{"roundSeconds":60}}, каталог подарков {type:"ss-gifts",list:[{name,coins,img}]}.
   2) Стиль: шрифт Inter / SF / Segoe Variable, мягкая обводка, тёмно-синие стеклянные подложки вместо чёрных. */
(function(){
  "use strict";
  const Q=new URLSearchParams(location.search);
  // пока игра не получила свой масштаб — не показываем её (иначе первые кадры видно огромный заголовок)
  try{ const st=document.createElement("style"); st.textContent='#game:not([style*="width"]),#stage:not([style*="transform"]),#stagebg:not([style*="transform"]){visibility:hidden} html,body{background:#0A1428}'; document.head.appendChild(st); }catch(e){}

  // непрозрачные холсты (игра и рамка сцены): браузеру не нужно смешивать их с фоном страницы — дешевле на 120/144 Гц
  try{ const gc=HTMLCanvasElement.prototype.getContext; HTMLCanvasElement.prototype.getContext=function(t,o){ if(t==="2d"&&(this.id==="game"||this.id==="stagebg")) o=Object.assign({alpha:false},o||{}); return gc.call(this,t,o); }; }catch(e){}

  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const SKIP={wsUrl:1,safe:1};
  const num=(v,d)=>{ const n=parseFloat(v); return isFinite(n)?n:d; };
  // ---------- значения из ссылки
  const SET={};
  try{ const c=Q.get("cfg"); if(c){ const j=JSON.parse(decodeURIComponent(escape(atob(c.replace(/-/g,"+").replace(/_/g,"/"))))); if(j&&typeof j==="object") Object.assign(SET,flat(j)); } }catch(e){}
  for(const [k,v] of Q) if(k.startsWith("c.")&&k.length>2) SET[k.slice(2)]=v;
  function flat(o,p="",r={}){ for(const k in o){ const v=o[k], kk=p?p+"."+k:k; if(v&&typeof v==="object"&&!Array.isArray(v)) flat(v,kk,r); else r[kk]=v; } return r; }
  function coerce(old,v){ if(typeof old==="number") return num(v,old); if(typeof old==="boolean") return v===true||v==="1"||v==="true";
    if(Array.isArray(old)){ if(Array.isArray(v)) return v; const a=String(v).split(",").map(s=>s.trim()).filter(Boolean); return old.length&&typeof old[0]==="number"?a.map(x=>num(x,0)):a; }
    if(typeof old==="string") return String(v).slice(0,200); return v; }
  function setPath(C,path,v){ const ks=path.split("."); let o=C; for(let i=0;i<ks.length-1;i++){ if(!o||typeof o[ks[i]]!=="object") return false; o=o[ks[i]]; }
    const last=ks[ks.length-1]; if(!o||!(last in o)||SKIP[ks[0]]) return false; const old=o[last]; if(old&&typeof old==="object"&&!Array.isArray(old)) return false; o[last]=coerce(old,v); return true; }
  // ---------- схема для лаунчера: ключи CONFIG + подписи из комментариев исходника
  function schema(C,src){ const lab={}; if(src){ const m=src.match(/const CONFIG\s*=\s*\{[\s\S]*?\n\};/); if(m) for(const line of m[0].split("\n")){ const r=line.match(/^\s*(\w+)\s*:[^\/]*\/\/\s*(.+)$/); if(r) lab[r[1]]=r[2].trim().slice(0,120); } }
    const out=[]; (function walk(o,p){ for(const k in o){ if(!p&&SKIP[k]) continue; const v=o[k], kk=p?p+"."+k:k;
      if(v&&typeof v==="object"&&!Array.isArray(v)){ walk(v,kk); continue; }
      const t=Array.isArray(v)?(v.every(x=>typeof x!=="object")?"list":null):typeof v; if(!t||t==="function") continue;
      out.push({k:kk,type:t,v,label:lab[k]||LBL[kk]||LBL[k]||""}); } })(C,"");
    return out; }
  // подписи по умолчанию (если у ключа в CONFIG нет комментария)
  const LBL={endSeconds:"Экран победителя, сек",matchEndSeconds:"Экран победителя матча, сек",roundSeconds:"Длина раунда, сек",lobbySeconds:"Сбор перед раундом, сек",
    a:"Команда слева (код страны или цвета)",b:"Команда справа (код страны или цвета)",teams:"Команды (коды через запятую)",
    "vsTheme.from":"Фон дуэли: верхний цвет","vsTheme.to":"Фон дуэли: нижний цвет","vsTheme.edge":"Фон дуэли: цвет кромки","vsTheme.icon":"Значок дуэли (эмодзи)",
    burnerMult:"Горелка: множитель подъёма",stormLoss:"Шторм: потеря высоты",maxPerEvent:"Максимум за один подарок",maxPerSecond:"Максимум в секунду",
    maxPlayers:"Максимум бойцов",baseHP:"HP на старте",maxHP:"Максимум HP",hpGrowth:"Рост HP босса за раунд",stunSeconds:"Оглушение, сек",healShare:"Доля лечения",
    friction:"Трение мяча",distance:"Длина трассы",turboSeconds:"Турбо, сек",chargeMult:"Заряд: множитель",debateLen:"Длина дебатов, сек",debateBonus:"Бонус дебатов",
    blizzardMult:"Метель: множитель",contractIncome:"Доход контракта",tariffFactor:"Сила пошлины",housePerWave:"Домик: +HP за волну",fuelDrain:"Расход бензина в секунду",
    nitroMult:"Нитро: множитель",rocketMult:"Турбо-реактор: множитель",rageMult:"Ярость: множитель",spurMult:"Шпоры: множитель",shoeMult:"Золотая подкова: множитель",
    windGain:"Второе дыхание: прибавка",lives:"Жизни",likesPerPower:"Лайков на 1 очко силы",maxHeight:"Максимальная высота, м",followLift:"Подписка: подъём, м",
    shareLift:"Репост: подъём, м",joinLift:"Вход в команду: подъём, м","gifts.smallLiftPerCoin":"Мелкий подарок: подъём за монету, м","gifts.shieldSeconds":"Щит, сек",
    "gifts.freezeSeconds":"Заморозка лавы, сек",cols:"Колонок на карте",rows:"Рядов на карте",likesPerArmy:"Лайков на 1 армию",fortifyAmount:"Укрепление: сила",
    decayFlat:"Трон слабеет в секунду",likesPerCoin:"Лайков = 1 монета",likesPerStep:"Лайков на 1 шаг",anchorMax:"Якорь: максимум, сек",likesPerDamage:"Лайков на 1 урон",
    pauseSeconds:"Пауза между раундами, сек",hearts:"Сердца на старте",speed:"Скорость",energyPerCoin:"Энергия за монету",waveEvery:"Новая волна каждые, сек",houseHP:"HP домика",
    winsNeeded:"Побед до победы в матче",track:"Длина каната, шагов",coinPull:"Шагов за монету",drift:"Канат к центру, шаг/сек",anchorSeconds:"Якорь, сек"};
  let CFG=null;
  window.SS_APPLY=function(C){ CFG=C; let src=""; try{ src=document.currentScript?document.currentScript.textContent:""; }catch(e){}
    const def=JSON.parse(JSON.stringify(C,(k,v)=>typeof v==="function"?undefined:v));
    for(const k in SET) setPath(C,k,SET[k]);
    const sc=schema(def,src); window.SS_SCHEMA=sc;
    const send=()=>{ try{ if(parent&&parent!==window) parent.postMessage({type:"ss-schema",game:GAME,title:document.title.split(" — ")[0],schema:sc,current:flat(JSON.parse(JSON.stringify(C)))},"*"); }catch(e){} };
    send(); addEventListener("load",send); };
  addEventListener("message",e=>{ const d=e.data; if(!d||typeof d!=="object") return;
    if(d.type==="ss-set"&&CFG&&d.values&&typeof d.values==="object"){ for(const k in d.values) setPath(CFG,k,d.values[k]); }
    if(d.type==="ss-gifts"&&Array.isArray(d.list)){ const put=()=>{ const G=window.SSGifts; if(!G) return setTimeout(put,300); d.list.slice(0,300).forEach(x=>{ try{ G.put(x.name,x.coins,x.img||x.image||x.giftPictureUrl); }catch(_){} }); }; put(); } });
  // ---------- сила подарков (power= или diff=easy|normal|hard), подарки по имени в map=, likerate=
  const DIFF={easy:1.5,normal:1,hard:.7}[(Q.get("diff")||"").toLowerCase()]||1;
  const POWER=Math.max(.25,Math.min(10,num(Q.get("power"),1)*DIFF)), LR=Math.max(1,Math.min(500,num(Q.get("likerate"),0)))||0;
  window.SS_POWER=POWER;
  addEventListener("DOMContentLoaded",()=>{
    if(typeof window.onGift==="function"){ const og=window.onGift;   // map по имени подарка (повтор безопасен)
      window.onGift=function(u,unit,count,name,giftId,...r){
        try{ if(typeof GIFT_MAP!=="undefined"&&name){ const nk=String(name).toLowerCase(); if(!(giftId!=null&&GIFT_MAP.has(String(giftId)))&&GIFT_MAP.has(nk)) giftId=nk; } }catch(e){}
        return og.call(this,u,unit,count,name,giftId,...r); }; }
    // сила подарков — один раз, на входе события (перенос подарков между раундами не умножается повторно); дробный остаток копится у зрителя
    if(POWER!==1&&typeof window.handleRaw==="function"){ const oh=window.handleRaw, rem=new Map(), stk=new Map();
      window.handleRaw=function(msg){ try{
        const L=msg&&msg.type==="gift"&&msg.gift, ev=!L&&msg&&String(msg.event||msg.type||"").toLowerCase()==="gift", d=L?msg.gift:ev?(msg.data||msg):null;
        if(d){ const uid=String((msg.user&&msg.user.id)||d.uniqueId||d.userId||(d.user&&d.user.uniqueId)||"anon"), unit=Math.max(1,+(L?d.coins:d.diamondCount)||1);
          let n=Math.max(1,+(L?d.count:d.repeatCount)||1);
          if(!L&&+d.giftType===1){ const k=uid+"|"+(d.giftId||d.giftName), prev=stk.get(k)||0; n=(prev>0&&n>=prev)?n-prev:n; if(d.repeatEnd) stk.delete(k); else stk.set(k,+d.repeatCount||1); if(n<=0) return; }
          // монеты комбо целиком × сила + остаток зрителя; цена штуки ≈ цена×сила, чтобы ярус подарка не прыгал
          const T=unit*n*POWER+(rem.get(uid)||0), nu=Math.max(1,Math.floor(unit*POWER+1e-9)), nc=Math.floor(T/nu+1e-9);
          rem.set(uid,T-nc*nu); if(nc<=0) return;
          msg=JSON.parse(JSON.stringify(msg));
          if(L){ msg.gift.coins=nu; msg.gift.count=nc; } else { const dd=msg.data||msg; dd.diamondCount=nu; dd.repeatCount=nc; dd.giftType=0; delete dd.repeatEnd; } }
      }catch(e){} return oh.call(this,msg); }; }
    if(Q.has("likerate")&&typeof window.likePoints==="function"){ const lp=window.likePoints; window.likePoints=function(u,n,per){ return lp.call(this,u,n,num(Q.get("likerate"),per)||per); }; }
  });
  // ---------- премиальный HUD для игр на общем ядре: стеклянная шапка, баннер и лента
  addEventListener("DOMContentLoaded",()=>{ if(Q.get("style")==="classic") return; try{
    if(typeof drawHeader!=="function"||typeof rr!=="function"||typeof ctx==="undefined") return;
    const mk=(w,h)=>{ const c=document.createElement("canvas"); c.width=Math.ceil(w); c.height=Math.ceil(h); return c; };
    const rk=(k,x,y,w,h,r)=>{ k.beginPath(); k.moveTo(x+r,y); k.arcTo(x+w,y,x+w,y+h,r); k.arcTo(x+w,y+h,x,y+h,r); k.arcTo(x,y+h,x,y,r); k.arcTo(x,y,x+w,y,r); k.closePath(); };
    const glass=(k,x,y,w,h,r,a)=>{ const gr=k.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,`rgba(30,46,82,${a})`); gr.addColorStop(1,`rgba(10,20,40,${a+.08})`); k.fillStyle=gr; rk(k,x,y,w,h,r); k.fill(); k.lineWidth=2; k.strokeStyle="rgba(255,255,255,.16)"; k.stroke(); };
    const tx=(k,t,x,y,size,c,w,maxW)=>{ k.font=`${w} ${size}px ${FAM}`; while(maxW&&size>14&&k.measureText(t).width>maxW){ size--; k.font=`${w} ${size}px ${FAM}`; }
      k.textAlign="center"; k.textBaseline="middle"; k.lineJoin="round"; k.lineWidth=Math.max(3,size/9*.62*1.6); k.strokeStyle="rgba(6,12,28,.62)"; k.strokeText(t,x,y+1); k.fillStyle=c; k.fillText(t,x,y); };
    let hk="", hc=null, hw=0;
    window.drawHeader=function(title,color,sub){
      if(STREAMER) txt("@"+STREAMER,40,TOP-30,24,"rgba(255,255,255,.6)","left",700,false);
      if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",PW-60,TOP-30,22,"#f88","center",700);
      const key=title+"|"+color+"|"+(sub||"");
      if(key!==hk||!hc){ hk=key; const k0=mk(4,4).getContext("2d"); k0.font=`900 60px ${FAM}`; const tw=Math.min(PW-60,k0.measureText(TITLE&&window.SS_TITLE_SRC===title?TITLE:title).width), w=Math.min(PW-30,Math.max(tw+120,sub?620:0)), h=sub?136:84;
        hw=w; hc=mk(PW,h+8); const k=hc.getContext("2d"); const ox=CX-w/2; glass(k,ox,2,w,h,34,.5); k.fillStyle=color; k.globalAlpha=.9; rk(k,CX-60,h-5,120,4,2); k.fill(); k.globalAlpha=1;
        tx(k,title,CX,42,60,color,900,PW-80); if(sub) tx(k,sub,CX,102,30,"#E2E8F0",700,w-40); }
      ctx.drawImage(hc,0,TOP-6); };
    const bc=new WeakMap();
    window.drawBanner=function(y){ if(!banner) return; let c=bc.get(banner);
      if(!c){ c=mk(960,250); const k=c.getContext("2d"); k.translate(480,115); k.shadowColor="rgba(0,0,0,.5)"; k.shadowBlur=30; k.shadowOffsetY=10; glass(k,-440,-84,880,168,38,.86); k.shadowBlur=0; k.shadowOffsetY=0;
        k.fillStyle=banner.c; rk(k,-90,-84,180,5,3); k.fill(); tx(k,banner.title,0,-24,58,banner.c,900,820); tx(k,banner.sub,0,38,30,"#F8FAFC",700,820); bc.set(banner,c); }
      const a=Math.min(1,banner.life*2), kk=Math.min(1,Math.max(0,(2.8-banner.life)/.25)), s=.92+.08*(1-Math.pow(1-kk,3));
      ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,y); ctx.scale(s,s); ctx.drawImage(c,-480,-115); ctx.restore(); };
    const fc2=new WeakMap();
    window.drawFeed=function(y,gap=36){ feed.forEach((f,i)=>{ let c=fc2.get(f);
        if(!c){ c=mk(PW,gap); const k=c.getContext("2d"); k.font=`700 24px ${FAM}`; const w=Math.min(PW-80,k.measureText(f.text).width+44); k.fillStyle="rgba(14,26,52,.66)"; rk(k,CX-w/2,3,w,gap-6,(gap-6)/2); k.fill(); tx(k,f.text,CX,gap/2,24,f.c,800,PW-120); fc2.set(f,c); }
        ctx.globalAlpha=Math.min(1,f.life); ctx.drawImage(c,0,y+i*gap-gap/2); }); ctx.globalAlpha=1; };
  }catch(e){} });
  // ---------- премиальный текст: шрифт, мягкая обводка, стекло вместо чёрного
  const FAM='"Inter","SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif';
  try{ const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap"; document.head.appendChild(l); }catch(e){}
  const TITLE=(Q.get("title")||"").slice(0,40), ACC=/^#[0-9a-f]{3,8}$/i.test(Q.get("accent")||"")?Q.get("accent"):null;
  const P=CanvasRenderingContext2D.prototype, fd=Object.getOwnPropertyDescriptor(P,"font"), sd=Object.getOwnPropertyDescriptor(P,"strokeStyle"), fsd=Object.getOwnPropertyDescriptor(P,"fillStyle");
  const fc=new Map();
  if(fd&&fd.set) Object.defineProperty(P,"font",{get:fd.get,set(v){ let r=fc.get(v); if(r===undefined){ r=String(v).replace(/"Segoe UI",\s*"Arial Black",\s*system-ui,\s*sans-serif|"Arial Black",\s*"Segoe UI"[^;]*?sans-serif|Arial Black|Impact/g,FAM); if(fc.size>800) fc.clear(); fc.set(v,r); } fd.set.call(this,r); },configurable:true});
  // чёрные подложки и затемнения → глубокий navy (стекло StreamStorm)
  const navy=new Map();
  const tint=v=>{ if(typeof v!=="string") return v; let r=navy.get(v); if(r===undefined){ const m=v.match(/^rgba\(\s*0\s*,\s*0\s*,\s*0\s*,\s*([\d.]+)\s*\)$/); r=m?`rgba(8,16,34,${Math.min(.92,+m[1]+.04)})`:v; if(ACC&&/^#(F5C542|FFD23F|FFD978|F5C542)$/i.test(v)) r=ACC; if(navy.size>400) navy.clear(); navy.set(v,r); } return r; };
  if(fsd&&fsd.set) Object.defineProperty(P,"fillStyle",{get:fsd.get,set(v){ fsd.set.call(this,tint(v)); },configurable:true});
  // обводка текста: чёрная толстая → мягкая полупрозрачная тонкая
  const st=P.strokeText;
  P.strokeText=function(t,x,y,...a){ const ss=sd.get.call(this); if(typeof ss==="string"&&/^rgba\(0,\s*0,\s*0,\s*\.?[5-9]|^#000/.test(ss)&&this.lineWidth>=4){ const lw=this.lineWidth; sd.set.call(this,"rgba(6,12,28,.62)"); this.lineWidth=Math.max(3,lw*.62); st.call(this,TITLE&&window.SS_TITLE_SRC===t?TITLE:t,x,y+1,...a); this.lineWidth=lw; sd.set.call(this,ss); return; } return st.call(this,TITLE&&window.SS_TITLE_SRC===t?TITLE:t,x,y,...a); };
  if(TITLE){ const ft=P.fillText, mt=P.measureText; window.SS_TITLE_SRC=null;
    const isT=t=>{ if(typeof t!=="string") return false; if(window.SS_TITLE_SRC) return t===window.SS_TITLE_SRC; const base=document.title.split(" — ")[0].replace(/[^\p{L}\p{N} ]/gu,"").trim().toUpperCase(); const tt=t.replace(/[^\p{L}\p{N} ]/gu,"").trim().toUpperCase(); if(base&&tt===base){ window.SS_TITLE_SRC=t; return true; } return false; };
    P.fillText=function(t,...a){ return ft.call(this,isT(t)?TITLE:t,...a); }; P.measureText=function(t){ return mt.call(this,isT(t)?TITLE:t); }; }
})();
</script>
<script id="modes" data-game="lava-rising">
/* ===================== РЕЖИМЫ StreamStorm: выбор категории до эфира (?mode=) =====================
   Лаунчер добавляет &mode=<id>. Режим только подставляет состав команд (параметры teams / a,b),
   поэтому правила игры не меняются. Явные teams=, a=, b= в ссылке важнее режима. */
(function(){
  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const MODES={
    "lava-rising":  {countries:{teams:"KZ,UZ,PL,DE,TR,BR"}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "country-race": {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "tower":        {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "paint-map":    {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "chat-football":{duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-fans":    {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-space":   {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-summit":  {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-trade":   {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-snow":    {duel:{}, colors:{a:"RED",b:"BLU"}},
    "horse-race":   {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "duel-energy":  {duel:{}, colors:{a:"RED",b:"BLU"}},

<script>

if(window.SS_APPLY) SS_APPLY(CONFIG);
const Q = new URLSearchParams(location.search);

// map=giftId:action:power — cool (заморозить лаву, сек) · shield (щит, сек) · meteor (сбить лидера, м) · platform (поднять свою, м) · none

  IN:{n:"Индия",    c:"#ff9933", a:["индия","india","in"], f:["in"]},

function flagEmoji(code){return String.fromCodePoint(...[...code].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));}

function drawFlag(g,code,x,y,w,h,gray){
  const f=COUNTRIES[code].f; g.save(); g.beginPath(); roundRect(g,x,y,w,h,8); g.clip();
  const S=(c)=>gray?"#555":c;
  const stripes=(dir,cols)=>cols.forEach((c,i)=>{g.fillStyle=S(c); dir==="h"? g.fillRect(x,y+h*i/cols.length,w,h/cols.length+1): g.fillRect(x+w*i/cols.length,y,w/cols.length+1,h);});
  switch(f[0]){
    case "team": { g.fillStyle=S(f[1]);g.fillRect(x,y,w,h);g.fillStyle="rgba(255,255,255,.22)";g.beginPath();g.moveTo(x,y+h);g.lineTo(x+w*.45,y);g.lineTo(x+w*.7,y);g.lineTo(x+w*.25,y+h);g.fill();
      const cx=x+w/2,cy=y+h/2,R=h*.32;g.fillStyle=S("#fff");g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?R*.45:R;g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}g.closePath();g.fill(); break; }
    case "h": case "v": stripes(f[0],f.slice(1)); break;

    case "kz2": g.fillStyle=S("#E8112D");g.fillRect(x,y,w,h);g.fillStyle=S("#FFEF00");circle(g,x+w*.5,y+h*.5,h*.26);g.fill();g.fillStyle=S("#E8112D");circle(g,x+w*.5,y+h*.5,h*.13);g.fill();break;
    case "by": g.fillStyle=S("#C8313E");g.fillRect(x,y,w,h);g.fillStyle=S("#4AA657");g.fillRect(x,y+h*.66,w,h*.34);g.fillStyle=S("#fff");g.fillRect(x,y,w*.1,h);g.fillStyle=S("#C8313E");for(let i=0;i<6;i++)g.fillRect(x+w*.03,y+h*(i/6)+h*.04,w*.04,h*.08);break;
    case "uz": stripes("h",["#0099B5","#fff","#1EB53A"]);g.fillStyle=S("#CE1126");g.fillRect(x,y+h*.32,w,h*.03);g.fillRect(x,y+h*.65,w,h*.03);g.fillStyle=S("#fff");circle(g,x+w*.16,y+h*.16,h*.11);g.fill();g.fillStyle=S("#0099B5");circle(g,x+w*.2,y+h*.16,h*.1);g.fill();break;
    case "tr": g.fillStyle=S("#E30A17");g.fillRect(x,y,w,h);g.fillStyle=S("#fff");circle(g,x+w*.4,y+h*.5,h*.27);g.fill();g.fillStyle=S("#E30A17");circle(g,x+w*.45,y+h*.5,h*.22);g.fill();g.fillStyle=S("#fff");star(g,x+w*.62,y+h*.5,h*.12);break;
    case "us": for(let i=0;i<13;i++){g.fillStyle=S(i%2?"#fff":"#B22234");g.fillRect(x,y+h*i/13,w,h/13+1);} g.fillStyle=S("#3C3B6E");g.fillRect(x,y,w*.42,h*.54);g.fillStyle=S("#fff");for(let r=0;r<4;r++)for(let c=0;c<5;c++){circle(g,x+w*.05+c*w*.08,y+h*.07+r*h*.12,1.8);g.fill();}break;
    case "br": g.fillStyle=S("#009C3B");g.fillRect(x,y,w,h);g.fillStyle=S("#FFDF00");g.beginPath();g.moveTo(x+w*.5,y+h*.1);g.lineTo(x+w*.92,y+h*.5);g.lineTo(x+w*.5,y+h*.9);g.lineTo(x+w*.08,y+h*.5);g.fill();g.fillStyle=S("#002776");circle(g,x+w*.5,y+h*.5,h*.22);g.fill();break;
    case "es": g.fillStyle=S("#AA151B");g.fillRect(x,y,w,h);g.fillStyle=S("#F1BF00");g.fillRect(x,y+h*.25,w,h*.5);break;
    case "ge": g.fillStyle=S("#fff");g.fillRect(x,y,w,h);g.fillStyle=S("#E8112D");g.fillRect(x+w*.44,y,w*.12,h);g.fillRect(x,y+h*.42,w,h*.16);break;

function circle(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);}
function star(g,x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fill();}
function roundRect(g,x,y,w,h,r){g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- Состояние ---------- */
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, Y0=1060, Y1=440, MAXM=120;   // 0 м внизу (Y0), 120 м наверху (Y1)
const ym=m=>Y0-(m/MAXM)*(Y0-Y1);
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';
let teams=[], lava={L:0,freeze:0,shake:0}, phase="lobby", phaseT=0, playT=0, round=0;
const members=new Map();     // userId -> team code (переживает раунды)
let stats=new Map();          // userId -> {name,code,likes,coins}
let feed=[], banners=[], floaters=[], parts=[], meteors=[], meteorCD=0;
let winnerInfo=null, botsOn=SRC==="demo"||Q.get("demo")==="1";
const streaks=new Map();
let wins={}; try{wins=JSON.parse(localStorage.getItem("lava_wins")||"{}");}catch(e){}

function buildTeams(){
  const codes=CONFIG.teams.filter(c=>COUNTRIES[c]).slice(0,8);
  const left=24, right=W-CONFIG.safe.right, cw=(right-left)/codes.length;
  teams=codes.map((code,i)=>({code,name:COUNTRIES[code].n,color:COUNTRIES[code].c,x:left+cw*(i+.5),cw,
    h:CONFIG.startHeight,vh:CONFIG.startHeight,alive:true,shield:0,deathT:0,deathH:0,pulse:0,hit:0,likes:0}));
}
const teamBy=code=>teams.find(t=>t.code===code);

function startLobby(){
  round++; phase="lobby"; phaseT=CONFIG.lobbySeconds; playT=0; lava={L:0,freeze:0,shake:0};
  teams.forEach(t=>{t.h=t.vh=CONFIG.startHeight+Math.min(14,(t.bank||0)*0.5);t.bank=0;t.alive=true;t.revived=false;t.immune=0;t.shield=0;t.deathT=0;t.likes=0;t.hit=0;});
  stats=new Map(); meteors=[]; winnerInfo=null; streaks.clear();
  banner("ВЫБИРАЙ СТРАНУ!","Напиши её название в чат 💬","#ffb02e");
}
function startPlay(){ phase="play"; phaseT=CONFIG.roundSeconds; banner("ЛАВА ПОШЛА! 🔥","Лайкай, чтобы поднять свою страну","#ff5a1f"); }
function endRound(){
  phase="end"; phaseT=CONFIG.endSeconds;
  const alive=teams.filter(t=>t.alive);
  let win=null;
  if(alive.length) win=alive.reduce((a,b)=>b.h>a.h?b:a);
  else if(teams.length) win=teams.reduce((a,b)=>(b.deathT>a.deathT||(b.deathT===a.deathT&&b.deathH>a.deathH))?b:a);
  let mvp=null; stats.forEach(s=>{ if(win&&s.code!==win.code) return; const sc=s.coins*20+s.likes; if(!mvp||sc>mvp.sc) mvp={...s,sc}; });
  if(win){ wins[win.code]=(wins[win.code]||0)+1; try{localStorage.setItem("lava_wins",JSON.stringify(wins));}catch(e){} burst(win.x,ym(win.vh),"#ffd23f",80); }
  winnerInfo={team:win,mvp};
}

/* ---------- Игроки и события ---------- */
function stat(user,code){ let s=stats.get(user.id); if(!s){s={name:user.name,code,likes:0,coins:0};stats.set(user.id,s);} s.code=code; s.name=user.name; return s; }
function findCountry(text){
  const t=" "+String(text).toLowerCase().replace(/[!?.,;:()"'«»]/g," ")+" ";
  for(const code of teams.map(t=>t.code)){ if(String(text).includes(flagEmoji(code))) return code; }
  const num=t.trim().match(/^(\d)$/); if(num){const i=+num[1]-1; if(teams[i]) return teams[i].code;}
  for(const tm of teams){ for(const al of COUNTRIES[tm.code].a){ if(t.includes(" "+al+" ")) return tm.code; } }
  return null;
}
function teamOf(user,autoJoin=true){
  let code=members.get(user.id); let t=code&&teamBy(code);
  if(t) return t;
  if(!autoJoin) return null;
  const pool=teams.filter(x=>x.alive); if(!pool.length) return null;
  const cnt=c=>[...members.values()].filter(v=>v===c).length;
  t=pool.reduce((a,b)=>cnt(b.code)<cnt(a.code)?b:a);
  members.set(user.id,t.code); addFeed(`${user.name} → ${t.name}`, t.color);
  return t;
}
function onComment(user,text){
  let code=findCountry(text);
  if(!code && String(text).trim().toLowerCase().startsWith(JOIN_CMD)){ if(members.get(user.id)) return; teamOf(user); return; }
  if(!code) return;
  const prev=members.get(user.id); const t=teamBy(code);
  if(prev===code) return;
  if(!t.alive && phase==="play"){ addFeed(`${user.name}: ${t.name} уже в лаве ☠️`,"#999"); return; }
  members.set(user.id,code); stat(user,code);
  addFeed(`${user.name} ${prev?"сменил команду →":"→"} ${t.name}`, t.color);
  if(phase!=="end"){ lift(t,CONFIG.joinLift,null); }
}
function onLike(user,n){
  if(phase==="end"||!LIKES_ON) return; const t=teamOf(user); if(!t||!t.alive) return;
  n=Math.max(1,Math.min(n|0,100)); stat(user,t.code).likes+=n; t.likes+=n;
  lift(t,n*CONFIG.likeLift,null); if(Math.random()<.5) spawn(t.x+(Math.random()-.5)*60,ym(t.vh)-30,"❤️");
}
function onFollow(user){ const t=teamOf(user); if(!t||!t.alive||phase==="end")return; lift(t,CONFIG.followLift,"+"+CONFIG.followLift+"м ➕"); addFeed(`➕ ${user.name} подписался → ${t.name}`,t.color); }
function onShare(user){ const t=teamOf(user); if(!t||!t.alive||phase==="end")return; lift(t,CONFIG.shareLift,"+"+CONFIG.shareLift+"м 🔁"); addFeed(`🔁 ${user.name} репостнул → ${t.name}`,t.color); }
function onGift(user,unit,count,giftName,giftId){
  const t=teamOf(user); if(!t) return;
  const G=CONFIG.gifts; const coins=unit*count;
  if(phase==="end"){ t.bank=(t.bank||0)+coins; addFeed(`🎁 ${user.name}: ${giftName} → бонус «${t.name}» в следующем раунде`,t.color); return; }
  stat(user,t.code).coins+=coins;
  if(!t.alive){
    if(phase==="play" && unit>=G.reviveMin && !t.revived){ // одно воскрешение за раунд
      t.alive=true; t.revived=true; t.h=t.vh=lava.L+10; t.shield=4; burst(t.x,ym(lava.L),"#7dffb0",60);
      banner(`🔥 ${user.name}`,`${giftName}: «${t.name}» восстала из лавы!`,"#7dffb0");
    } else addFeed(`${user.name}: «${t.name}» в лаве${t.revived?"":` — нужен подарок от ${G.reviveMin}💰`}`,"#999");
    return; }
  const mp=giftId!=null&&GIFT_MAP.get(String(giftId));
  if(mp){ // подарок настроен в лаунчере
    const pw=mp.power*count;
    if(mp.action==="none") return;
    if(mp.action==="platform"){ lift(t,pw,`+${pw}м 🎁`); burst(t.x,ym(t.vh),t.color,14); addFeed(`🎁 ${user.name}: ${giftName}×${count} → ${t.name} +${pw}м`,t.color); return; }
    if(mp.action==="shield"){ t.shield=Math.min(30,Math.max(t.shield,0)+pw); banner(`🛡 ${user.name}`,`${giftName}: щит для «${t.name}» на ${pw}с`,"#58d8ff"); return; }
    if(mp.action==="cool"){ if(phase==="play") lava.freeze=Math.min(15,Math.max(lava.freeze,0)+pw); banner(`❄️ ${user.name}`,`${giftName}: лава замёрзла на ${pw}с`,"#58d8ff"); return; }
    if(mp.action==="meteor"){ for(let i=0;i<Math.min(count,5);i++) launchMeteor(user,t,0,mp.power); return; }
  }
  if(unit<=G.smallMax){
    const m=+(coins*G.smallLiftPerCoin).toFixed(1); lift(t,m,`+${m}м 🎁`); burst(t.x,ym(t.vh),t.color,10+count*2);
    addFeed(`🎁 ${user.name}: ${giftName}×${count} → ${t.name} +${m}м`,t.color);
  } else if(unit<=G.midMax){
    t.shield=Math.min(20,Math.max(t.shield,0)+G.shieldSeconds*count); if(phase==="play") lava.freeze=Math.min(8,Math.max(lava.freeze,0)+G.freezeSeconds*count); lift(t,2,"🛡 ЩИТ");
    banner(`🛡 ${user.name}`,`${giftName}: щит для «${t.name}» + лава замёрзла ❄️`,"#58d8ff");
  } else {
    for(let i=0;i<Math.min(count,5);i++) launchMeteor(user,t,0);
  }
}
function launchMeteor(user,own,delay,power){
  if(meteors.length>=12) return; // очередь не бесконечная
  meteors.push({user,own,t:0,target:null,power:power||CONFIG.gifts.bigKnockdown});
}
function lift(t,m,label){
  if(!t.alive) return;
  const cap = phase==="lobby" ? CONFIG.startHeight+14 : CONFIG.maxHeight;
  const k=phase==="play"?Math.max(.2,1-t.h/140):1; // чем выше, тем тяжелее подниматься
  t.h=Math.min(cap,t.h+m*k); t.pulse=1;
  if(label) floaters.push({x:t.x,y:ym(t.vh)-215,text:label,c:"#fff",life:1.6});
  if(floaters.length>25) floaters.splice(0,floaters.length-25);
}

/* ---------- Подключение: TikFinity WebSocket / bridge.js ---------- */
let ws=null, wsState="wait", wsTimer=null;
function setStatus(s,txt){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=txt; }
function connect(){
  try{ ws=new WebSocket(CONFIG.wsUrl); }catch(e){ setStatus("bad","❌ Неверный адрес WebSocket"); return; }
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl);
  ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{ try{ handleRaw(JSON.parse(e.data)); }catch(err){} };
  ws.onclose=()=>{ setStatus("bad","🔴 Нет связи — переподключаюсь…"); clearTimeout(wsTimer); wsTimer=setTimeout(connect,3000); };
  ws.onerror=()=>{ try{ws.close();}catch(e){} };
}
function handleRaw(msg){
  // формат лаунчера {type,user,gift,likes,text} — переводим в формат TikFinity
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user; const base={uniqueId:u.id,nickname:u.name};
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};
    else msg={event:msg.type,data:base}; }
  const ev=String(msg.event||msg.type||"").toLowerCase(); const d=msg.data||msg;
  const u=d.user||{};
  const user={ id:String(d.uniqueId||d.userId||u.uniqueId||u.userId||"anon"), name:String(d.nickname||u.nickname||d.uniqueId||u.uniqueId||"Зритель").slice(0,24) };
  switch(ev){
    case "chat": case "comment": onComment(user,d.comment||d.text||""); break;
    case "like": onLike(user,d.likeCount||d.count||1); break;
    case "follow": onFollow(user); break;
    case "share": onShare(user); break;
    case "social": if(String(d.displayType||"").includes("follow")) onFollow(user); else if(String(d.displayType||"").includes("share")) onShare(user); break;
    case "gift": {
      const unit=+(d.diamondCount||d.giftDetails?.diamondCount||1); const name=String(d.giftName||d.giftDetails?.giftName||"подарок").slice(0,24);
      const rc=+(d.repeatCount||1);
      if(+d.giftType===1){ // комбо-подарки приходят пачкой: считаем только прирост
        const key=user.id+"|"+(d.giftId||name); const prev=streaks.get(key)||0;
        const delta=(prev>0&&rc>=prev)?rc-prev:rc; if(d.repeatEnd) streaks.delete(key); else streaks.set(key,rc);
        if(delta>0) onGift(user,unit,delta,name,d.giftId);
      } else onGift(user,unit,rc,name,d.giftId);
      break;
    }
  }
}

/* ---------- Эффекты ---------- */
function banner(title,sub,c){ banners.push({title,sub,c,life:2.8}); if(banners.length>3) banners.shift(); }
function addFeed(text,c){ feed.unshift({text,c,life:7}); if(feed.length>3) feed.pop(); }
function spawn(x,y,emo){ parts.push({x,y,vx:(Math.random()-.5)*40,vy:-120-Math.random()*80,life:1.2,emo,size:34}); }
function burst(x,y,c,n){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=150+Math.random()*450; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,life:.8+Math.random()*.6,c,size:4+Math.random()*7,g:900});} }

/* ---------- Логика ---------- */
function update(dt){
  phaseT-=dt;
  if(phase==="lobby" && phaseT<=0) startPlay();
  else if(phase==="play"){
    playT+=dt;
    const alv=teams.filter(t=>t.alive); const minH=alv.length?Math.min(...alv.map(t=>t.h)):lava.L;
    if(lava.freeze>0) lava.freeze-=dt; else lava.L+=(CONFIG.lavaBaseSpeed+CONFIG.lavaAccel*playT+Math.max(0,minH-lava.L-22)*CONFIG.lavaCatchUp)*dt;
    for(const t of teams){
      if(!t.alive) continue;
      if(t.shield<=0) t.h-=CONFIG.sinkSpeed*dt;
      if(t.shield>0) t.shield-=dt;
      if(t.h<lava.L){
        if(t.shield>0){ t.h=lava.L+.3; }
        else { t.alive=false; t.deathT=playT; t.deathH=t.h; burst(t.x,ym(lava.L),"#ff7a1a",60); lava.shake=.5;
          banner(`☠️ ${t.name.toUpperCase()} УТОНУЛА`,"Её зрители могут выбрать другую страну","#ff4040"); }
      }
    }
    const alive=teams.filter(t=>t.alive).length;
    if(phaseT<=0 || (teams.length>1 && alive<=1)) endRound();
  } else if(phase==="end" && phaseT<=0) startLobby();

  for(const t of teams){ t.vh+=(t.h-t.vh)*Math.min(1,dt*7); t.pulse=Math.max(0,t.pulse-dt*3); t.hit=Math.max(0,t.hit-dt*1.5); }
  lava.shake=Math.max(0,lava.shake-dt);

  if(meteorCD>0) meteorCD-=dt;
  for(const t of teams) t.immune=Math.max(0,(t.immune||0)-dt);
  for(const m of meteors.slice(0,1)){   // по одному метеориту за раз
    if(meteorCD>0 || phase!=="play") break;
    if(!m.target){
      const rivals=teams.filter(t=>t.alive&&t!==m.own);
      if(!rivals.length){ m.done=true; continue; }
      const free=rivals.filter(t=>!(t.immune>0)); if(!free.length) break;
      m.target=free.reduce((a,b)=>b.h>a.h?b:a);
      banner(`🚀 ${m.user.name}`,`метеорит по «${m.target.name}»!`,"#ff9d2e");
    }
    m.t+=dt/0.9;
    if(m.t>=1 && !m.done){
      m.done=true; meteorCD=CONFIG.gifts.meteorGap; const t=m.target; t.immune=CONFIG.gifts.hitImmunity; lava.shake=.7; t.hit=1; burst(t.x,ym(t.vh),"#ffb347",70);
      if(t.alive){ if(t.shield>0){ t.shield=0; t.h-=m.power*.3; floaters.push({x:t.x,y:ym(t.vh)-215,text:"🛡 щит сломан",c:"#9ef",life:1.8}); }
        else { t.h=Math.max(t.h-m.power,Math.min(t.h,lava.L+2)); floaters.push({x:t.x,y:ym(t.vh)-215,text:`-${m.power}м 💥`,c:"#ff6",life:1.8}); } }
      addFeed(`💥 ${m.user.name} сбил «${t.name}»`,"#ffb347");
    }
  }
  meteors=meteors.filter(m=>!m.done);
  for(const p of parts){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.g) p.vy+=p.g*dt; }
  parts=parts.filter(p=>p.life>0);
  if(parts.length>600) parts.splice(0,parts.length-600);
  floaters.forEach(f=>{f.life-=dt;f.y-=50*dt;}); floaters=floaters.filter(f=>f.life>0);
  banners.forEach(b=>b.life-=dt); banners=banners.filter(b=>b.life>0);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);
  if(botsOn) runBots(dt);
}

/* ---------- Отрисовка ---------- */
let time=0;
function text(s,x,y,size,c,align="center",weight=900,stroke=true){
  ctx.font=`${weight} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";
  if(stroke){ ctx.lineWidth=Math.max(4,size/6); ctx.strokeStyle="rgba(0,0,0,.85)"; ctx.lineJoin="round"; ctx.strokeText(s,x,y); }
  ctx.fillStyle=c; ctx.fillText(s,x,y);
}
function fitText(s,x,y,size,maxW,c){ ctx.font=`900 ${size}px ${FONT}`; while(size>12 && ctx.measureText(s).width>maxW){ size-=1; ctx.font=`900 ${size}px ${FONT}`; } text(s,x,y,size,c); }

function draw(){
  ctx.save();
  if(lava.shake>0) ctx.translate((Math.random()-.5)*24*lava.shake,(Math.random()-.5)*24*lava.shake);
  // фон
  {
    ctx.drawImage(TEX.cached("lava_bg",W+60,H+60,(k)=>{ const bg=k.createLinearGradient(0,30,0,H+30); bg.addColorStop(0,"#120816"); bg.addColorStop(.55,"#2a0c10"); bg.addColorStop(1,"#4a1206"); k.fillStyle=bg; k.fillRect(0,0,W+60,H+60); }),-30,-30);   // запечено
    ctx.fillStyle="#1b0a0e"; ctx.beginPath(); ctx.moveTo(0,1100);
    for(let x=0;x<=W;x+=60) ctx.lineTo(x,1000-Math.abs(Math.sin(x*.004+1))*260-(x>380&&x<700?180-Math.abs(x-540)*1.1:0));
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
    // кратер вулкана светится и дымит
    { const px=540, py=1000-Math.abs(Math.sin(540*.004+1))*260-180; const cg=ctx.createRadialGradient(px,py,10,px,py,260); cg.addColorStop(0,`rgba(255,120,30,${.55+.15*Math.sin(time*3)})`); cg.addColorStop(1,"rgba(255,60,0,0)"); ctx.fillStyle=cg; ctx.fillRect(px-260,py-260,520,520);
      ctx.strokeStyle="rgba(255,110,30,.3)"; ctx.lineWidth=12; for(const d of[-1,1]){ ctx.beginPath(); ctx.moveTo(px+d*20,py+10); ctx.quadraticCurveTo(px+d*70,py+120,px+d*60+Math.sin(time+d)*6,py+260); ctx.stroke(); }
      for(let i=0;i<9;i++){ const ph=(time*.12+i/9)%1, sx=px+Math.sin(i*2.3+time*.3)*40*ph+ph*60, sy=py-ph*520, r=30+ph*90; ctx.fillStyle=`rgba(60,40,45,${.35*(1-ph)})`; circle(ctx,sx,sy,r); ctx.fill(); } }
    // дымок/искры
    for(let i=0;i<40;i++){ const x=(i*137+time*20*(1+i%3))%W, y=H-((i*331+time*60*(1+i%4))%(H-300)); ctx.fillStyle=`rgba(255,${120+i%5*20},40,${.25+.2*Math.sin(time*3+i)})`; ctx.fillRect(x,y,3,3); }
  }
  // шкала высоты
  for(let m=0;m<=MAXM;m+=20){ const y=ym(m); ctx.strokeStyle="rgba(255,255,255,.07)"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(10,y); ctx.lineTo(W-CONFIG.safe.right,y); ctx.stroke(); text(m+"м",W-CONFIG.safe.right+8,y,20,"rgba(255,255,255,.35)","left",700,false); }

  const leader=teams.filter(t=>t.alive).sort((a,b)=>b.h-a.h)[0];
  // мёртвые сначала (лава перекроет), потом живые
  const order=[...teams].sort((a,b)=>(a.alive?1:0)-(b.alive?1:0));
  for(const t of order) drawTeam(t,t===leader&&phase==="play");
  // жар от лавы поднимается вверх
  { const ly=ym(lava.L), hg=ctx.createLinearGradient(0,ly-320,0,ly); hg.addColorStop(0,"rgba(255,80,0,0)"); hg.addColorStop(1,lava.freeze>0?"rgba(120,210,255,.22)":"rgba(255,90,10,.30)"); ctx.fillStyle=hg; ctx.fillRect(0,ly-320,W,320); }
  drawLava();
  for(const t of teams) if(!t.alive){ text("☠️",t.x,ym(lava.L)+40+Math.sin(time*2+t.x)*6,44,"#fff"); }
  // метеоры
  for(const m of meteors){ if(!m.target||m.done) continue; const tx=m.target.x, ty=ym(m.target.vh)-20; const sx=W*.5, sy=-100; const k=Math.min(1,m.t);
    const x=sx+(tx-sx)*k, y=sy+(ty-sy)*k*k; for(let i=0;i<6;i++){ ctx.fillStyle=`rgba(255,${150-i*20},30,${.6-i*.09})`; circle(ctx,x-(tx-sx)*.04*i,y-(ty-sy)*.04*i,34-i*4); ctx.fill(); }
    text("☄️",x,y,70,"#fff"); }
  // частицы
  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); if(p.emo) text(p.emo,p.x,p.y,p.size,"#fff","center",400,false); else { ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.size,p.size); } }
  ctx.globalAlpha=1;
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life); text(f.text,f.x,f.y,34,f.c); } ctx.globalAlpha=1;
  ctx.restore();
  drawHud();
}

function drawTeam(t,isLeader){
  const y=ym(t.vh), pw=Math.min(150,t.cw-12), x=t.x-pw/2;
  // колонна
  // колонна из каменных блоков (базальт), с объёмом по бокам
  if(window.TEX) TEX.pillar(ctx,x+12,y+24,pw-24,Math.max(0,1560-y),t.alive?"#5b4a4c":"#2c2c2c");
  else { ctx.fillStyle=t.alive?"#5a4246":"#2c2c2c"; ctx.fillRect(x+12,y+24,pw-24,H-y); }
  // раскалённый низ колонны у лавы
  if(t.alive){ const ly=ym(lava.L), hg=ctx.createLinearGradient(0,ly-220,0,ly); hg.addColorStop(0,"rgba(255,90,20,0)"); hg.addColorStop(1,lava.freeze>0?"rgba(140,220,255,.35)":"rgba(255,110,30,.55)"); ctx.fillStyle=hg; ctx.fillRect(x+12,Math.max(y+24,ly-220),pw-24,Math.max(0,ly-Math.max(y+24,ly-220))); }
  // плита
  const danger=t.alive && phase==="play" && t.h-lava.L<6 && t.shield<=0;
  // плита-платформа: каменная плита с фаской и тенью на колонну, кромка цвета команды
  ctx.fillStyle="rgba(0,0,0,.4)"; ctx.beginPath(); ctx.moveTo(x+12,y+30); ctx.lineTo(x+pw-12,y+30); ctx.lineTo(x+pw-12,y+48); ctx.lineTo(x+12,y+48); ctx.fill();
  if(window.TEX) TEX.slab(ctx,x,y,pw,32,t.alive?"#8d7f80":"#454545",{mat:"stone"});
  else { ctx.fillStyle=t.alive?"#8a7075":"#444"; ctx.beginPath(); roundRect(ctx,x,y,pw,30,10); ctx.fill(); }
  ctx.fillStyle=t.alive?t.color:"#555"; ctx.beginPath(); roundRect(ctx,x+8,y+2,pw-16,7,3); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.35)"; ctx.fillRect(x+12,y+3,pw-24,2);
  if(danger && Math.sin(time*16)>0){ ctx.strokeStyle="#ff2a2a"; ctx.lineWidth=5; ctx.beginPath(); roundRect(ctx,x-3,y-3,pw+6,36,12); ctx.stroke(); }
  text(Math.max(0,t.h).toFixed(0)+"м",t.x,y+16,30,"#fff");
  // флаг
  const fw=Math.min(128,pw-8), fh=fw*.64, sc=1+t.pulse*.12;
  ctx.save(); ctx.translate(t.x,y-fh/2-10); ctx.scale(sc,sc); drawFlag(ctx,t.code,-fw/2,-fh/2,fw,fh,!t.alive); ctx.restore();
  fitText(t.name.toUpperCase(),t.x,y-fh-36,32,t.cw-26,t.alive?"#fff":"#888");
  if(isLeader) text("👑",t.x,y-fh-82,52,"#fff");
  if(danger) text("⚠️",t.x,y-fh-82,46,"#fff");
  // щит
  if(t.shield>0 && t.alive){ ctx.strokeStyle=`rgba(120,220,255,${.6+.3*Math.sin(time*8)})`; ctx.lineWidth=6; ctx.beginPath(); ctx.ellipse(t.x,y-fh/2,pw*.62,fh+28,0,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle="rgba(120,220,255,.12)"; ctx.fill(); text("🛡"+Math.ceil(t.shield),t.x,y+52,24,"#9ef"); }
  // участники и победы
  const cnt=[...members.values()].filter(v=>v===t.code).length;
  text("👥"+cnt,t.x,y+(t.shield>0?88:56),28,"#ffe6b0");
  if(wins[t.code]) text("🏆"+wins[t.code],t.x,y+(t.shield>0?122:90),28,"#ffd23f");
  if(t.hit>0){ ctx.globalAlpha=t.hit; ctx.fillStyle="#fff"; ctx.fillRect(x,y-fh-20,pw,fh+50); ctx.globalAlpha=1; }
}

function drawLava(){
  const y=ym(lava.L), frozen=lava.freeze>0;
  const g=ctx.createLinearGradient(0,y,0,H);
  if(frozen){ g.addColorStop(0,"#9fe8ff"); g.addColorStop(.08,"#3d7ea6"); g.addColorStop(1,"#14304a"); }
  else { g.addColorStop(0,"#ffe14d"); g.addColorStop(.05,"#ff7a1a"); g.addColorStop(.35,"#d4280f"); g.addColorStop(1,"#5a0a04"); }
  ctx.shadowColor=frozen?"#7fdcff":"#ff6a00"; ctx.shadowBlur=24;
  ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-30,H+30);
  for(let x=-30;x<=W+30;x+=20){ const a=frozen?2:10; ctx.lineTo(x,y+Math.sin(x*.02+time*2.2)*a+Math.sin(x*.047-time*3.1)*a*.6); }
  ctx.lineTo(W+30,H+30); ctx.closePath(); ctx.fill(); ctx.shadowBlur=0;
  // корка: тёмные остывшие плиты плывут по лаве / трещины льда
  if(window.TEX){ ctx.save(); ctx.clip(); const vis=Math.max(0,(phase==="end"?1560:1110)-y); /* ниже кадр не виден: сцена обрезает на 1085 в игре и 1540 на экране победы */ if(frozen) TEX.over(ctx,"rock",0,y,W,vis,.35); else { const off=(time*18)%256; TEX.over(ctx,"crust",-off,y+14,W+256,vis,.85); } ctx.restore(); }
  if(!frozen){ for(let i=0;i<14;i++){ const bx=(i*83+time*30)%W, ph=(time*.8+i*.37)%1; ctx.fillStyle=`rgba(255,220,80,${.7*(1-ph)})`; circle(ctx,bx,y+30+ph*-30+i%3*20,6+ph*10); ctx.fill(); } }
  else text("❄️ ЛАВА ЗАМОРОЖЕНА "+Math.ceil(lava.freeze)+"с",W/2-CONFIG.safe.right/2,Math.min(1045,y+60),40,"#dff8ff");
}

function drawHud(){

    for(const p of sparks){ g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); g.fillStyle=p.c; g.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } g.globalAlpha=1;
    for(const c of cards) if(c.tier!=="big") drawCard(c);
    for(const c of cards) if(c.tier==="big") drawCard(c); // большие всегда поверх
    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv||(!p.picOk&&ready(img(p.pic)))) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    if(MERGED) g.restore(); else requestAnimationFrame(step);
  }
  if(MERGED) window.__fxStep=step; else requestAnimationFrame(step);
})();
</script>
<script id="license" data-game="lava-rising">

     SSLicense.check(key, gameId) -> Promise<{ok, scope, expires_at, reason, offline}>
     SSLicense.saved()            -> last key the user entered ("" if none)
   gameId = game folder id (e.g. "lava-rising"); a key with scope "all" fits every game.
   reason: not_found | revoked | wrong_game | expired | rate_limited | no_key | not_configured | offline_no_cache
   If the network is down, a cached OK result is trusted until its expires_at (offline:true). */
(function(){
var CFG={ url:"https://bxkdvddbjusbcjnzktry.supabase.co", anon:"sb_publishable_loLJqmab1TolWXLIdIrgHA_AlyghDQF" };          /* fill: "https://XXXX.supabase.co", "eyJ..." (anon public key) */
var LS="ss_license_v1";
function norm(k){return String(k||"").toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/^SS/,"").replace(/(.{4})(?=.)/g,"$1-").replace(/^/,"SS-")}
function load(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}}
function save(o){try{localStorage.setItem(LS,JSON.stringify(o))}catch(e){}}

  config:function(url,anon){CFG.url=String(url||"").replace(/\/+$/,"");CFG.anon=anon||""},
  normalize:norm,

  check:function(key,game){

  message:function(res){if(res.ok)return "Ключ активен ещё "+SSLicense.daysLeft(res)+" дн."+(res.offline?" (офлайн)":"");

};

/* StreamStorm: проверка ключа в игре. Только при src=tikfinity; демо не трогаем.

(function(){

    else if(!on&&mark){ mark.remove(); mark=null; }

      var net=r.reason==="offline_no_cache"||r.reason==="rate_limited";
      if(!net) show(!r.ok&&r.reason!=="not_configured");
      tm=setTimeout(run,net?60*1000:30*60*1000); })
    .catch(function(){ tm=setTimeout(run,60*1000); }); }
  run();
})();
