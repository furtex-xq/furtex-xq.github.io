<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чат-футбол стран — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<div id="panel">
  <h3>⚽ Пульт ведущего <small style="display:inline">(H — скрыть)</small></h3>
  <div id="status" class="wait">⏳</div>
<div class="row"><button data-a="A1">◀ 🌹 1</button><button data-a="B1">🌹 1 ▶</button></div>
  <div class="row"><button data-a="A30">◀ 💎 30</button><button data-a="B30">💎 30 ▶</button></div>
  <div class="row"><button data-a="A199">◀ 🚀 199</button><button data-a="B199">🚀 199 ▶</button></div>
  <div class="row"><button data-a="Alike">◀ ❤️</button><button data-a="Blike">❤️ ▶</button></div>
  <button data-a="restart">🔄 Новый раунд</button>
  <button data-a="bots" id="botsBtn">🤖 Демо-боты</button>
  <small>Q/W/E подарки нижней · I/O/P верхней · R рестарт · B боты · H пульт</small>
</div>
<script>
"use strict";

const CONFIG = {
  wsUrl: "ws://localhost:21213/",
  a: "UA", b: "KZ",          // a играет снизу вверх, b — сверху вниз
  roundSeconds: 180,
  endSeconds: 10,
  kickPerCoin: 0.012,        // 1 монета = толчок мяча (поле = 2.0 от ворот до ворот)
  maxKick: 0.5,              // один подарок — не больше четверти поля
  passMult: 1.5,             // 💎 10–99: точный пас ×1.5
  friction: 1.6,
  safe: {top: 150, right: 110},
};
const COUNTRIES = {
  UA:{n:"Украина",  c:"#ffd400", a:["украина","україна","ukraine","укр","ua"], f:["h","#0057B7","#FFD700"]},
  RU:{n:"Россия",   c:"#3b7bff", a:["россия","russia","рф","ru","рос"], f:["h","#fff","#0039A6","#D52B1E"]},
  KZ:{n:"Казахстан",c:"#00c8e0", a:["казахстан","kazakhstan","kz","каз","қазақстан"], f:["kz"]},
  BY:{n:"Беларусь", c:"#e8434f", a:["беларусь","belarus","by","бел","білорусь","беларусі"], f:["by"]},
  UZ:{n:"Узбекистан",c:"#25c25a",a:["узбекистан","uzbekistan","uz","узб","o'zbekiston","ozbekiston"], f:["uz"]},
  PL:{n:"Польша",   c:"#ff4b6b", a:["польша","polska","poland","pl","польща"], f:["h","#fff","#DC143C"]},
  DE:{n:"Германия", c:"#ffcc00", a:["германия","germany","deutschland","de","німеччина"], f:["h","#111","#DD0000","#FFCE00"]},
  TR:{n:"Турция",   c:"#ff3b3b", a:["турция","turkey","türkiye","turkiye","tr"], f:["tr"]},
  US:{n:"США",      c:"#6aa0ff", a:["сша","usa","америка","america","us"], f:["us"]},
  BR:{n:"Бразилия", c:"#2fd16b", a:["бразилия","brasil","brazil","br"], f:["br"]},
  FR:{n:"Франция",  c:"#4a7dff", a:["франция","france","fr"], f:["v","#0055A4","#fff","#EF4135"]},
  IT:{n:"Италия",   c:"#2fbf5b", a:["италия","italia","italy","it"], f:["v","#009246","#fff","#CE2B37"]},
  ES:{n:"Испания",  c:"#ffb400", a:["испания","españa","espana","spain","es"], f:["es"]},
  GE:{n:"Грузия",   c:"#ff5050", a:["грузия","georgia","საქართველო","ge"], f:["ge"]},
  AM:{n:"Армения",  c:"#ff8a1f", a:["армения","armenia","hayastan","am"], f:["h","#D90012","#0033A0","#F2A800"]},
  AZ:{n:"Азербайджан",c:"#29b6f6",a:["азербайджан","azerbaijan","azərbaycan","az"], f:["h","#0092BC","#E4002B","#00AF66"]},
  MD:{n:"Молдова",  c:"#ffd23f", a:["молдова","moldova","md"], f:["v","#0046AE","#FFD200","#CC092F"]},
  KG:{n:"Кыргызстан",c:"#ff4040",a:["кыргызстан","киргизия","kyrgyzstan","kg"], f:["kz2"]},
  TJ:{n:"Таджикистан",c:"#ff6b6b",a:["таджикистан","tajikistan","tj"], f:["h","#CC0000","#fff","#006600"]},
  IN:{n:"Индия",    c:"#ff9933", a:["индия","india","in"], f:["in"]},
};
function flagEmoji(code){return String.fromCodePoint(...[...code].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));}

function drawFlag(g,code,x,y,w,h,gray){
  const f=COUNTRIES[code].f; g.save(); g.beginPath(); roundRect(g,x,y,w,h,8); g.clip();
  const S=(c)=>gray?"#555":c;
  const stripes=(dir,cols)=>cols.forEach((c,i)=>{g.fillStyle=S(c); dir==="h"? g.fillRect(x,y+h*i/cols.length,w,h/cols.length+1): g.fillRect(x+w*i/cols.length,y,w/cols.length+1,h);});
  switch(f[0]){
    case "h": case "v": stripes(f[0],f.slice(1)); break;
    case "kz": g.fillStyle=S("#00AFCA");g.fillRect(x,y,w,h);g.fillStyle=S("#FEC50C");circle(g,x+w*.5,y+h*.45,h*.2);g.fill();g.fillRect(x+w*.3,y+h*.72,w*.4,h*.06);break;
    case "kz2": g.fillStyle=S("#E8112D");g.fillRect(x,y,w,h);g.fillStyle=S("#FFEF00");circle(g,x+w*.5,y+h*.5,h*.26);g.fill();g.fillStyle=S("#E8112D");circle(g,x+w*.5,y+h*.5,h*.13);g.fill();break;
    case "by": g.fillStyle=S("#C8313E");g.fillRect(x,y,w,h);g.fillStyle=S("#4AA657");g.fillRect(x,y+h*.66,w,h*.34);g.fillStyle=S("#fff");g.fillRect(x,y,w*.1,h);g.fillStyle=S("#C8313E");for(let i=0;i<6;i++)g.fillRect(x+w*.03,y+h*(i/6)+h*.04,w*.04,h*.08);break;
    case "uz": stripes("h",["#0099B5","#fff","#1EB53A"]);g.fillStyle=S("#CE1126");g.fillRect(x,y+h*.32,w,h*.03);g.fillRect(x,y+h*.65,w,h*.03);g.fillStyle=S("#fff");circle(g,x+w*.16,y+h*.16,h*.11);g.fill();g.fillStyle=S("#0099B5");circle(g,x+w*.2,y+h*.16,h*.1);g.fill();break;
    case "tr": g.fillStyle=S("#E30A17");g.fillRect(x,y,w,h);g.fillStyle=S("#fff");circle(g,x+w*.4,y+h*.5,h*.27);g.fill();g.fillStyle=S("#E30A17");circle(g,x+w*.45,y+h*.5,h*.22);g.fill();g.fillStyle=S("#fff");star(g,x+w*.62,y+h*.5,h*.12);break;
    case "us": for(let i=0;i<13;i++){g.fillStyle=S(i%2?"#fff":"#B22234");g.fillRect(x,y+h*i/13,w,h/13+1);} g.fillStyle=S("#3C3B6E");g.fillRect(x,y,w*.42,h*.54);g.fillStyle=S("#fff");for(let r=0;r<4;r++)for(let c=0;c<5;c++){circle(g,x+w*.05+c*w*.08,y+h*.07+r*h*.12,1.8);g.fill();}break;
    case "br": g.fillStyle=S("#009C3B");g.fillRect(x,y,w,h);g.fillStyle=S("#FFDF00");g.beginPath();g.moveTo(x+w*.5,y+h*.1);g.lineTo(x+w*.92,y+h*.5);g.lineTo(x+w*.5,y+h*.9);g.lineTo(x+w*.08,y+h*.5);g.fill();g.fillStyle=S("#002776");circle(g,x+w*.5,y+h*.5,h*.22);g.fill();break;
    case "es": g.fillStyle=S("#AA151B");g.fillRect(x,y,w,h);g.fillStyle=S("#F1BF00");g.fillRect(x,y+h*.25,w,h*.5);break;
    case "ge": g.fillStyle=S("#fff");g.fillRect(x,y,w,h);g.fillStyle=S("#E8112D");g.fillRect(x+w*.44,y,w*.12,h);g.fillRect(x,y+h*.42,w,h*.16);break;
    case "in": stripes("h",["#FF9933","#fff","#138808"]);g.strokeStyle=S("#000080");g.lineWidth=2;circle(g,x+w*.5,y+h*.5,h*.12);g.stroke();break;
  }
  g.restore();
  g.lineWidth=3; g.strokeStyle="rgba(0,0,0,.55)"; g.beginPath(); roundRect(g,x,y,w,h,8); g.stroke();
}
function circle(g,x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);}
function star(g,x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();g.fill();}
function roundRect(g,x,y,w,h,r){g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}


/* ===================== ОБЩЕЕ ЯДРО (подключение, события, эффекты) ===================== */
const Q=new URLSearchParams(location.search);
if(Q.get("ws")) CONFIG.wsUrl=Q.get("ws");
if(Q.get("round")&&CONFIG.roundSeconds) CONFIG.roundSeconds=Math.max(20,+Q.get("round")||CONFIG.roundSeconds);
const SRC=(Q.get("src")||"demo").toLowerCase();
const STREAMER=(Q.get("user")||"").replace(/^@/,"").slice(0,30);
const LIKES_ON=Q.get("likes")!=="0";
const JOIN_CMD=(Q.get("join")||"!join").trim().toLowerCase();
const GIFT_MAP=new Map();   // map=giftId:action:power
(Q.get("map")||"").split(",").forEach(x=>{const [id,a,p]=x.split(":"); if(id&&a) GIFT_MAP.set(String(id).trim(),{action:a.trim().toLowerCase(),power:+p||0});});
const OBS=Q.get("obs")==="1";
if(OBS||!!window.obsstudio||(Q.has("src")&&Q.get("panel")!=="1")) document.getElementById("panel").style.display="none";
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, PW=W-CONFIG.safe.right, CX=PW/2+20, TOP=CONFIG.safe.top, CHAT_Y=1150; // ниже CHAT_Y у зрителей чат TikTok
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';
let time=0, shake=0, flash=0, parts=[], floaters=[], feed=[], banner=null;
let botsOn=SRC==="demo"||Q.get("demo")==="1";
const streaks=new Map(), likeBanks=new Map(), avatars=new Map();

let ws=null, wsState="wait";
function setStatus(s,t){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=t; }
function connect(){ try{ws=new WebSocket(CONFIG.wsUrl);}catch(e){setStatus("bad","❌ Неверный адрес");return;}
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl); ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{try{handleRaw(JSON.parse(e.data));}catch(_){}}; ws.onclose=()=>{setStatus("bad","🔴 Нет связи — переподключаюсь…");setTimeout(connect,3000);}; ws.onerror=()=>{try{ws.close();}catch(_){}}; }
function handleRaw(msg){
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user, base={uniqueId:u.id,nickname:u.name};   // формат лаунчера
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};
    else msg={event:msg.type,data:base}; }
  const ev=String(msg.event||msg.type||"").toLowerCase(), d=msg.data||msg, uu=d.user||{};
  const u={id:String(d.uniqueId||d.userId||uu.uniqueId||"anon"), name:String(d.nickname||uu.nickname||d.uniqueId||"Зритель").slice(0,22), avatar:d.profilePictureUrl||uu.profilePictureUrl||null};
  switch(ev){
    case "chat": case "comment": onComment(u,String(d.comment||"")); break;
    case "like": if(LIKES_ON) onLike(u,Math.max(1,Math.min(200,+d.likeCount||1))); break;
    case "follow": onFollow(u); break;
    case "gift": { const unit=+(d.diamondCount||1), name=String(d.giftName||"подарок").slice(0,20), rc=+(d.repeatCount||1);
      if(+d.giftType===1){ const key=u.id+"|"+(d.giftId||name), prev=streaks.get(key)||0, delta=(prev>0&&rc>=prev)?rc-prev:rc;
        if(d.repeatEnd) streaks.delete(key); else streaks.set(key,rc); if(delta>0) onGift(u,unit,delta,name,d.giftId); }
      else onGift(u,unit,rc,name,d.giftId); }
  }
}
/* лайки копятся у каждого зрителя: каждые N лайков = 1 очко */
function likePoints(u,n,per){ const b=(likeBanks.get(u.id)||0)+n, p=Math.floor(b/per); likeBanks.set(u.id,b%per); return p; }
function mapped(giftId){ return giftId!=null?GIFT_MAP.get(String(giftId)):null; }

function txt(s,x,y,size,c,align="center",w=900,stroke=true){ ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";
  if(stroke){ctx.lineWidth=Math.max(4,size/6);ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineJoin="round";ctx.strokeText(s,x,y);} ctx.fillStyle=c; ctx.fillText(s,x,y); }
function fit(s,x,y,size,maxW,c,align="center"){ ctx.font=`900 ${size}px ${FONT}`; while(size>12&&ctx.measureText(s).width>maxW){size--;ctx.font=`900 ${size}px ${FONT}`;} txt(s,x,y,size,c,align); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function avatarImg(url){ if(!url) return null; if(avatars.has(url)) return avatars.get(url); const im=new Image(); im.src=url; avatars.set(url,im); return im; }
function avatar(name,url,x,y,r,ring){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); const im=avatarImg(url);
  if(im&&im.complete&&im.naturalWidth){ctx.clip();ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();}
  else { let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))|0; ctx.fillStyle=`hsl(${Math.abs(h)%360},60%,45%)`; ctx.fill(); ctx.restore(); txt(([...name][0]||"?").toUpperCase(),x,y+2,r*1.1,"#fff","center",900,false); }
  if(ring){ ctx.lineWidth=Math.max(3,r*.14); ctx.strokeStyle=ring; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); } }
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function showBanner(title,sub,c){ banner={title,sub,c,life:2.8}; }
function addFeed(text,c){ feed.unshift({text,c,life:6}); if(feed.length>3) feed.pop(); }
function burst(x,y,c,n){ for(let i=0;i<n&&parts.length<600;i++){const a=Math.random()*Math.PI*2,s=150+Math.random()*500; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,life:.8+Math.random()*.6,c,size:5+Math.random()*8,g:900});} }
function emo(x,y,e,size=32){ if(parts.length<600) parts.push({x,y,vx:(Math.random()-.5)*40,vy:-200,life:1.2,emo:e,size}); }
function floater(x,y,text,c="#fff",size=48){ floaters.push({x,y,text,c,size,life:1.4}); if(floaters.length>25) floaters.shift(); }
function updateFx(dt){
  shake=Math.max(0,shake-dt*2); flash=Math.max(0,flash-dt*2.5);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;} parts=parts.filter(p=>p.life>0);
  floaters.forEach(f=>{f.life-=dt;f.y-=60*dt;}); floaters=floaters.filter(f=>f.life>0);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);
  if(banner){banner.life-=dt; if(banner.life<=0) banner=null;}
}
function drawFx(){
  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); if(p.emo) txt(p.emo,p.x,p.y,p.size,"#fff","center",400,false); else {ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size);} }
  ctx.globalAlpha=1; for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life); txt(f.text,f.x,f.y,f.size,f.c); } ctx.globalAlpha=1;
  if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash*.35})`; ctx.fillRect(-40,-40,W+80,H+80); }
}
function drawHeader(title,color,sub){
  if(STREAMER) txt("@"+STREAMER,40,TOP-30,24,"rgba(255,255,255,.6)","left",700,false);
  if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",PW-60,TOP-30,22,"#f88","center",700);
  fit(title,CX,TOP+40,64,PW-60,color); if(sub) txt(sub,CX,TOP+100,34,"#fff");
}
function drawRules(y,l1,l2){ ctx.fillStyle="rgba(0,0,0,.5)"; rr(40,y,PW-40,100,18); ctx.fill(); fit(l1,CX,y+28,26,PW-80,"#fff"); fit(l2,CX,y+72,25,PW-80,"#ffd98a"); }
function drawFeed(y,gap=36){ feed.forEach((f,i)=>{ ctx.globalAlpha=Math.min(1,f.life); fit(f.text,CX,y+i*gap,26,PW-120,f.c); }); ctx.globalAlpha=1; }
function drawBanner(y){ if(!banner) return; const a=Math.min(1,banner.life*2), s=1+Math.max(0,banner.life-2.4)*1.2; ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,y); ctx.scale(s,s);
  ctx.fillStyle="rgba(0,0,0,.78)"; rr(-440,-80,880,160,30); ctx.fill(); fit(banner.title,0,-26,60,840,banner.c); fit(banner.sub,0,40,32,840,"#fff"); ctx.restore(); }
function dim(){ ctx.fillStyle="rgba(0,0,0,.8)"; ctx.fillRect(0,0,W,H); }
function topList(map,n){ return [...map.values()].sort((a,b)=>b.pts-a.pts).slice(0,n); }
function credit(map,u,pts,extra){ let c=map.get(u.id); if(!c){c={name:u.name,avatar:u.avatar,pts:0,...(extra||{})};map.set(u.id,c);} c.name=u.name; if(u.avatar)c.avatar=u.avatar; c.pts+=pts; return c; }
const BOTN=["Саня_228","katya.love","Мурат","DimonPro","Олежка","айгерим","Vlad_TT","Настя","Бека","Lena_K","Тимур","Ярик","ZhanaR","Макс","Polina","Арман","Dasha","Kostya","Аня","Mira"];
const bots=BOTN.map((n,i)=>({id:"bot"+i,name:n,act:Math.random()*3}));
function eachBot(dt,fn){ for(const b of bots){ b.act-=dt; if(b.act>0) continue; b.act=.8+Math.random()*2.8; fn({id:b.id,name:b.name},Math.random(),b); } }
function wirePanel(act,keys){
  const btn=document.getElementById("botsBtn"); const upd=()=>btn&&(btn.textContent="🤖 Демо-боты: "+(botsOn?"вкл":"выкл"));
  const run=a=>{ if(a==="bots") botsOn=!botsOn; else act(a); upd(); };
  document.getElementById("panel").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) run(b.dataset.a);});
  addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); if(keys[k]) run(keys[k]); else if(k==="b"||k==="и") run("bots");
    else if(k==="h"||k==="р"){ const p=document.getElementById("panel"); p.style.display=p.style.display==="none"?"":"none"; } });
  upd();
}
function start(){
  const resize=()=>{ const s=Math.min(innerWidth/W,innerHeight/H); cv.style.width=W*s+"px"; cv.style.height=H*s+"px"; };
  addEventListener("resize",resize); resize();
  if(SRC==="demo") setStatus("wait","🤖 Демо-режим (без эфира)"); else connect();
  let last=performance.now();
  const loop=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; gameUpdate(dt); if(botsOn) runBots(dt); updateFx(dt);

    if(c.count>1) text("×"+c.count,CW/2-6,-CH/2+6,40,"#ffe600");
    g.restore(); g=G;
    c.dirty=false; c.imgsOk=ready(av)||!c.u.avatar; c.picOk=ready(pic)||!c.pic;
  }
  const flashCv=document.createElement("canvas"); flashCv.width=270; flashCv.height=480;
  { const fg=flashCv.getContext("2d"), gr=fg.createRadialGradient(135,190,12,135,190,225); gr.addColorStop(0,"rgba(255,220,120,.45)"); gr.addColorStop(1,"rgba(255,140,0,0)"); fg.fillStyle=gr; fg.fillRect(0,0,270,480); }
  // «+X» рисуем один раз в маленький холст, дальше только drawImage
  function popCv(p){ const tmp=g, c=document.createElement("canvas"); g=c.getContext("2d"); g.font=`900 ${p.size}px ${F}`; const w=Math.ceil(g.measureText(p.text).width)+p.size; c.width=w; c.height=Math.ceil(p.size*1.6); g=c.getContext("2d"); text(p.text,w/2,c.height/2,p.size,p.c); g=tmp; p.cv=c; }
  let idle=false, lastW="";
  function drawCard(c){
    if(!c.cv||c.dirty||(!c.imgsOk&&ready(img(c.u.avatar)))||(!c.picOk&&ready(img(c.pic)))) renderCard(c);
    const sc=c.s*(1+c.bump*.12)*c.T.scale; if(sc<=0) return;
    g.save(); g.translate(c.x,c.y); g.scale(sc,sc); g.drawImage(c.cv,-(CW/2+PAD),-(CH/2+PAD)); g.restore();
  }
  function step(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(base.style.width!==lastW){ lastW=base.style.width; fx.style.width=base.style.width; fx.style.height=base.style.height; }
    for(const c of cards){ c.bump=Math.max(0,c.bump-dt*4); c.t+=dt;
      if(c.st===0){ c.s=Math.min(1,c.t/.18)*(1+Math.sin(Math.min(1,c.t/.3)*Math.PI)*.18); if(c.t>=c.T.hold+.2){ c.st=1; c.t=0; const tg=target(c.u.id); c.tx=tg.x; c.ty=tg.y; c.tc=tg.color||c.T.c1; c.sx=c.x; c.sy=c.y; } }
      else if(c.st===1){ const k=Math.min(1,c.t/.55), e=k*k*(3-2*k); c.x=c.sx+(c.tx-c.sx)*e; c.y=c.sy+(c.ty-c.sy)*e-Math.sin(k*Math.PI)*120; c.s=1-.75*e;
        if(sparks.length<120) for(let i=0;i<(c.tier==="big"?4:2);i++) sparks.push({x:c.x+(Math.random()-.5)*30,y:c.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.5,c:c.T.c1,r:3+Math.random()*4});
        if(k>=1){ c.st=2; const n=c.T.parts; for(let i=0;i<n&&sparks.length<160;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*(c.tier==="big"?700:380); sparks.push({x:c.tx,y:c.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7+Math.random()*.5,c:Math.random()<.5?c.tc:c.T.c1,r:3+Math.random()*(c.tier==="big"?9:5),gr:500}); }
          rings.push({x:c.tx,y:c.ty,r:10,max:c.tier==="big"?420:c.tier==="mid"?220:110,c:c.tc,life:1});
          pops.push({x:c.tx,y:c.ty-40,text:`+${c.coins} 💰`,c:"#fff",size:c.tier==="big"?72:c.tier==="mid"?56:42,life:1.3}); } } }
    cards=cards.filter(c=>c.st<2);
    for(const p of sparks){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.gr) p.vy+=p.gr*dt; } sparks=sparks.filter(p=>p.life>0);
    for(const r of rings){ r.life-=dt*1.6; r.r+=(r.max-r.r)*Math.min(1,dt*7); } rings=rings.filter(r=>r.life>0);
    for(const p of pops){ p.life-=dt; p.y-=70*dt; } pops=pops.filter(p=>p.life>0); if(pops.length>20) pops.splice(0,pops.length-20);
    flash=Math.max(0,flash-dt*2);
    const active=flash>0||cards.length||sparks.length||rings.length||pops.length;
    if(!active){ if(!idle){ g.clearRect(0,0,1080,1920); idle=true; } requestAnimationFrame(step); return; } idle=false;
    g.setTransform(.75,0,0,.75,0,0); g.clearRect(0,0,1080,1920);
    if(flash>0){ g.globalAlpha=flash; g.drawImage(flashCv,0,0,1080,1920); g.globalAlpha=1; }
    for(const r of rings){ g.globalAlpha=Math.max(0,r.life); g.strokeStyle=r.c; g.lineWidth=10*r.life+2; g.beginPath(); g.arc(r.x,r.y,r.r,0,Math.PI*2); g.stroke(); } g.globalAlpha=1;
    for(const p of sparks){ g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); g.fillStyle=p.c; g.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } g.globalAlpha=1;
    for(const c of cards) if(c.tier!=="big") drawCard(c);
    for(const c of cards) if(c.tier==="big") drawCard(c); // большие всегда поверх
    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
