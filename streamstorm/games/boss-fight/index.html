<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Битва с боссом — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<div id="panel">
  <h3>👹 Пульт ведущего <small style="display:inline">(H — скрыть)</small></h3>
  <div id="status" class="wait">⏳</div>
<div class="row"><button data-a="g1">🌹 1</button><button data-a="g30">💎 30</button><button data-a="g199">🚀 199</button></div>
  <div class="row"><button data-a="like">❤️ 200 лайков</button><button data-a="restart">🔄 Новый босс</button></div>
  <button data-a="bots" id="botsBtn">🤖 Демо-боты</button>
  <small>G 1 монета · S 30 · M 199 · L лайки · R рестарт · B боты · H пульт</small>
</div>
<script>
"use strict";

const CONFIG = {
  wsUrl: "ws://localhost:21213/",
  roundSeconds: 150,         // время на одного босса
  endSeconds: 8,
  baseHp: 1500, hpGrowth: 1.4,   // здоровье босса растёт с уровнем
  coinDamage: 1,             // 1 монета = 1 урон
  critMult: 1.5,             // 💎 10–99: критический удар ×1.5
  ultMult: 2, stunSeconds: 6,    // 🚀 100+: ульта ×2 и оглушение босса
  attackEvery: 20,           // босс атакует каждые N сек…
  shieldPerLevel: 150,       // …и нужен щит N×уровень, иначе босс лечится
  healShare: 0.1,
  likesPerShield: 10,        // 10 лайков = 1 щит; подписка = 10 щита
  safe: {top: 150, right: 110},
};
/* ===================== ОБЩЕЕ ЯДРО (подключение, события, эффекты) ===================== */
const Q=new URLSearchParams(location.search);
if(Q.get("ws")) CONFIG.wsUrl=Q.get("ws");
if(Q.get("round")&&CONFIG.roundSeconds) CONFIG.roundSeconds=Math.max(20,+Q.get("round")||CONFIG.roundSeconds);
const SRC=(Q.get("src")||"demo").toLowerCase();
const STREAMER=(Q.get("user")||"").replace(/^@/,"").slice(0,30);
const LIKES_ON=Q.get("likes")!=="0";
const JOIN_CMD=(Q.get("join")||"!join").trim().toLowerCase();
const GIFT_MAP=new Map();   // map=giftId:action:power
(Q.get("map")||"").split(",").forEach(x=>{const [id,a,p]=x.split(":"); if(id&&a) GIFT_MAP.set(String(id).trim(),{action:a.trim().toLowerCase(),power:+p||0});});
const OBS=Q.get("obs")==="1";
if(OBS||!!window.obsstudio||(Q.has("src")&&Q.get("panel")!=="1")) document.getElementById("panel").style.display="none";
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, PW=W-CONFIG.safe.right, CX=PW/2+20, TOP=CONFIG.safe.top, CHAT_Y=1150; // ниже CHAT_Y у зрителей чат TikTok
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';
let time=0, shake=0, flash=0, parts=[], floaters=[], feed=[], banner=null;
let botsOn=SRC==="demo"||Q.get("demo")==="1";
const streaks=new Map(), likeBanks=new Map(), avatars=new Map();

let ws=null, wsState="wait";
function setStatus(s,t){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=t; }
function connect(){ try{ws=new WebSocket(CONFIG.wsUrl);}catch(e){setStatus("bad","❌ Неверный адрес");return;}
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl); ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{try{handleRaw(JSON.parse(e.data));}catch(_){}}; ws.onclose=()=>{setStatus("bad","🔴 Нет связи — переподключаюсь…");setTimeout(connect,3000);}; ws.onerror=()=>{try{ws.close();}catch(_){}}; }
function handleRaw(msg){
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user, base={uniqueId:u.id,nickname:u.name};   // формат лаунчера
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};
    else msg={event:msg.type,data:base}; }
  const ev=String(msg.event||msg.type||"").toLowerCase(), d=msg.data||msg, uu=d.user||{};
  const u={id:String(d.uniqueId||d.userId||uu.uniqueId||"anon"), name:String(d.nickname||uu.nickname||d.uniqueId||"Зритель").slice(0,22), avatar:d.profilePictureUrl||uu.profilePictureUrl||null};
  switch(ev){
    case "chat": case "comment": onComment(u,String(d.comment||"")); break;
    case "like": if(LIKES_ON) onLike(u,Math.max(1,Math.min(200,+d.likeCount||1))); break;
    case "follow": onFollow(u); break;
    case "gift": { const unit=+(d.diamondCount||1), name=String(d.giftName||"подарок").slice(0,20), rc=+(d.repeatCount||1);
      if(+d.giftType===1){ const key=u.id+"|"+(d.giftId||name), prev=streaks.get(key)||0, delta=(prev>0&&rc>=prev)?rc-prev:rc;
        if(d.repeatEnd) streaks.delete(key); else streaks.set(key,rc); if(delta>0) onGift(u,unit,delta,name,d.giftId); }
      else onGift(u,unit,rc,name,d.giftId); }
  }
}
/* лайки копятся у каждого зрителя: каждые N лайков = 1 очко */
function likePoints(u,n,per){ const b=(likeBanks.get(u.id)||0)+n, p=Math.floor(b/per); likeBanks.set(u.id,b%per); return p; }
function mapped(giftId){ return giftId!=null?GIFT_MAP.get(String(giftId)):null; }

function txt(s,x,y,size,c,align="center",w=900,stroke=true){ ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";
  if(stroke){ctx.lineWidth=Math.max(4,size/6);ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineJoin="round";ctx.strokeText(s,x,y);} ctx.fillStyle=c; ctx.fillText(s,x,y); }
function fit(s,x,y,size,maxW,c,align="center"){ ctx.font=`900 ${size}px ${FONT}`; while(size>12&&ctx.measureText(s).width>maxW){size--;ctx.font=`900 ${size}px ${FONT}`;} txt(s,x,y,size,c,align); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function avatarImg(url){ if(!url) return null; if(avatars.has(url)) return avatars.get(url); const im=new Image(); im.src=url; avatars.set(url,im); return im; }
function avatar(name,url,x,y,r,ring){ ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); const im=avatarImg(url);
  if(im&&im.complete&&im.naturalWidth){ctx.clip();ctx.drawImage(im,x-r,y-r,r*2,r*2);ctx.restore();}
  else { let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))|0; ctx.fillStyle=`hsl(${Math.abs(h)%360},60%,45%)`; ctx.fill(); ctx.restore(); txt(([...name][0]||"?").toUpperCase(),x,y+2,r*1.1,"#fff","center",900,false); }
  if(ring){ ctx.lineWidth=Math.max(3,r*.14); ctx.strokeStyle=ring; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); } }
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function showBanner(title,sub,c){ banner={title,sub,c,life:2.8}; }
function addFeed(text,c){ feed.unshift({text,c,life:6}); if(feed.length>3) feed.pop(); }
function burst(x,y,c,n){ for(let i=0;i<n&&parts.length<600;i++){const a=Math.random()*Math.PI*2,s=150+Math.random()*500; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,life:.8+Math.random()*.6,c,size:5+Math.random()*8,g:900});} }
function emo(x,y,e,size=32){ if(parts.length<600) parts.push({x,y,vx:(Math.random()-.5)*40,vy:-200,life:1.2,emo:e,size}); }
function floater(x,y,text,c="#fff",size=48){ floaters.push({x,y,text,c,size,life:1.4}); if(floaters.length>25) floaters.shift(); }
function updateFx(dt){
  shake=Math.max(0,shake-dt*2); flash=Math.max(0,flash-dt*2.5);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;} parts=parts.filter(p=>p.life>0);
  floaters.forEach(f=>{f.life-=dt;f.y-=60*dt;}); floaters=floaters.filter(f=>f.life>0);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);
  if(banner){banner.life-=dt; if(banner.life<=0) banner=null;}
}
function drawFx(){
  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); if(p.emo) txt(p.emo,p.x,p.y,p.size,"#fff","center",400,false); else {ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size);} }
  ctx.globalAlpha=1; for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life); txt(f.text,f.x,f.y,f.size,f.c); } ctx.globalAlpha=1;
  if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash*.35})`; ctx.fillRect(-40,-40,W+80,H+80); }
}
function drawHeader(title,color,sub){
  if(STREAMER) txt("@"+STREAMER,40,TOP-30,24,"rgba(255,255,255,.6)","left",700,false);
  if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",PW-60,TOP-30,22,"#f88","center",700);
  fit(title,CX,TOP+40,64,PW-60,color); if(sub) txt(sub,CX,TOP+100,34,"#fff");
}
function drawRules(y,l1,l2){ ctx.fillStyle="rgba(0,0,0,.5)"; rr(40,y,PW-40,100,18); ctx.fill(); fit(l1,CX,y+28,26,PW-80,"#fff"); fit(l2,CX,y+72,25,PW-80,"#ffd98a"); }
function drawFeed(y,gap=36){ feed.forEach((f,i)=>{ ctx.globalAlpha=Math.min(1,f.life); fit(f.text,CX,y+i*gap,26,PW-120,f.c); }); ctx.globalAlpha=1; }
function drawBanner(y){ if(!banner) return; const a=Math.min(1,banner.life*2), s=1+Math.max(0,banner.life-2.4)*1.2; ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,y); ctx.scale(s,s);
  ctx.fillStyle="rgba(0,0,0,.78)"; rr(-440,-80,880,160,30); ctx.fill(); fit(banner.title,0,-26,60,840,banner.c); fit(banner.sub,0,40,32,840,"#fff"); ctx.restore(); }
function dim(){ ctx.fillStyle="rgba(0,0,0,.8)"; ctx.fillRect(0,0,W,H); }
function topList(map,n){ return [...map.values()].sort((a,b)=>b.pts-a.pts).slice(0,n); }
function credit(map,u,pts,extra){ let c=map.get(u.id); if(!c){c={name:u.name,avatar:u.avatar,pts:0,...(extra||{})};map.set(u.id,c);} c.name=u.name; if(u.avatar)c.avatar=u.avatar; c.pts+=pts; return c; }
const BOTN=["Саня_228","katya.love","Мурат","DimonPro","Олежка","айгерим","Vlad_TT","Настя","Бека","Lena_K","Тимур","Ярик","ZhanaR","Макс","Polina","Арман","Dasha","Kostya","Аня","Mira"];
const bots=BOTN.map((n,i)=>({id:"bot"+i,name:n,act:Math.random()*3}));
function eachBot(dt,fn){ for(const b of bots){ b.act-=dt; if(b.act>0) continue; b.act=.8+Math.random()*2.8; fn({id:b.id,name:b.name},Math.random(),b); } }
function wirePanel(act,keys){
  const btn=document.getElementById("botsBtn"); const upd=()=>btn&&(btn.textContent="🤖 Демо-боты: "+(botsOn?"вкл":"выкл"));
  const run=a=>{ if(a==="bots") botsOn=!botsOn; else act(a); upd(); };
  document.getElementById("panel").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) run(b.dataset.a);});
  addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); if(keys[k]) run(keys[k]); else if(k==="b"||k==="и") run("bots");
    else if(k==="h"||k==="р"){ const p=document.getElementById("panel"); p.style.display=p.style.display==="none"?"":"none"; } });
  upd();
}
function start(){
  const resize=()=>{ const s=Math.min(innerWidth/W,innerHeight/H); cv.style.width=W*s+"px"; cv.style.height=H*s+"px"; };
  addEventListener("resize",resize); resize();
  if(SRC==="demo") setStatus("wait","🤖 Демо-режим (без эфира)"); else connect();
  let last=performance.now();
  const loop=now=>{ const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; gameUpdate(dt); if(botsOn) runBots(dt); updateFx(dt);
    ctx.save(); if(shake>0) ctx.translate((Math.random()-.5)*28*shake,(Math.random()-.5)*28*shake); gameDraw(); drawFx(); ctx.restore(); gameHud(); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.addEventListener("message",e=>{ if(e.data&&e.data.source==="magma-launcher"&&e.data.event){ try{ handleRaw(e.data.event); }catch(_){} } }); // GAME-CONTRACT §6

/* ===================== ИГРА ===================== */
let level=1, hp=0, maxHp=0, vhp=0, phase="play", phaseT=0, atkT=0, stun=0, shield=0, fans=new Map(), won=false, hitFx=0, pendingG=[], wins=0;
try{ level=Math.min(3,+localStorage.getItem("boss_level")||1); }catch(e){} // при запуске не выше 3 уровня
function newBoss(){ maxHp=Math.round(CONFIG.baseHp*Math.pow(CONFIG.hpGrowth,level-1)); hp=vhp=maxHp; phase="play"; phaseT=CONFIG.roundSeconds; atkT=CONFIG.attackEvery; stun=0; shield=0; fans=new Map(); won=false;
  showBanner(`👹 БОСС УРОВНЯ ${level}`,`${maxHp} здоровья · бейте подарками все вместе!`,"#ff5a5a");
  const q=pendingG; pendingG=[]; window.__giftReplay=true; try{ q.forEach(a=>onGift(...a)); }finally{ window.__giftReplay=false; }; }
const needShield=()=>CONFIG.shieldPerLevel*level;
function damage(u,d,label){ hp-=d; hitFx=1; credit(fans,u,d); shake=Math.min(1,shake+d/300); burst(CX+(Math.random()-.5)*200,760,"#ffb347",Math.min(40,5+d/5));
  floater(CX+(Math.random()-.5)*300,620,`-${Math.round(d)}`,d>=100?"#ffd23f":"#ff8080",d>=100?64:44); if(d>=30) addFeed(`⚔️ ${u.name}: ${label} → ${Math.round(d)} урона`,"#ffb3a0"); }
function onGift(u,unit,count,name,giftId){
  if(phase!=="play"){ if(pendingG.length<200) pendingG.push([u,unit,count,name,giftId]); return; }
  const mp=mapped(giftId); const kind=mp?mp.action:(unit>=100?"big":unit>=10?"mid":"small"); if(kind==="none") return;
  const coins=(mp?mp.power:unit)*count*CONFIG.coinDamage;
  if(kind==="shield"){ shield+=coins; return; }
  if(kind==="big"){ stun=Math.max(stun,CONFIG.stunSeconds); damage(u,coins*CONFIG.ultMult,name); showBanner(`💥 УЛЬТА: ${u.name}`,`${name}: ×${CONFIG.ultMult} урона и босс оглушён ${CONFIG.stunSeconds} с`,"#ffd23f"); }
  else if(kind==="mid") damage(u,coins*CONFIG.critMult,`${name} (крит ×${CONFIG.critMult})`);
  else damage(u,coins,`${name}×${count}`);
}
function onLike(u,n){ if(phase!=="play") return; const p=likePoints(u,n,CONFIG.likesPerShield); if(p) shield+=p; if(Math.random()<.3) emo(CX+(Math.random()-.5)*600,CHAT_Y-40,"🛡",28); }
function onComment(u,text){ if(/^(!?атака|!?attack|⚔️|🗡)/i.test(text.trim())) emo(CX+(Math.random()-.5)*600,CHAT_Y-40,"⚔️",30); }
function onFollow(u){ shield+=10; addFeed(`➕ ${u.name} подписался: +10 щита`,"#9fe0ff"); }
function gameUpdate(dt){ phaseT-=dt; vhp+=(hp-vhp)*Math.min(1,dt*6); hitFx=Math.max(0,hitFx-dt*4);
  if(phase==="play"){
    if(stun>0) stun-=dt; else { atkT-=dt; if(atkT<=0){ atkT=CONFIG.attackEvery;
      if(shield>=needShield()){ showBanner("🛡 АТАКА ОТБИТА!",`Щит ${Math.floor(shield)} из ${needShield()} — босс не вылечился`,"#7fe0ff"); }
      else { const h=Math.round(maxHp*CONFIG.healShare); hp=Math.min(maxHp,hp+h); shake=1; showBanner("👹 БОСС АТАКУЕТ!",`Щита не хватило: босс вылечил ${h}. Лайкайте, чтобы держать щит!`,"#ff4040"); }
      shield=0; } }
    if(hp<=0){ hp=0; won=true; phase="end"; phaseT=CONFIG.endSeconds; wins++; level++; burst(CX,760,"#ffd23f",150); try{localStorage.setItem("boss_level",level);}catch(e){} }
    else if(phaseT<=0){ won=false; phase="end"; phaseT=CONFIG.endSeconds; level=Math.max(1,level-1); try{localStorage.setItem("boss_level",level);}catch(e){} } // проиграли — босс слабее
  } else if(phaseT<=0) newBoss();
}
function drawBoss(x,y,s){
  const angry=hp<maxHp*.5, k=stun>0?0:1, hue=(level*47)%360, br=Math.sin(time*2.2)*k, dmg=1-Math.max(0,hp)/maxHp;
  ctx.save(); ctx.translate(x,y+br*10); ctx.scale(s,s);
  if(hitFx>0) ctx.translate((Math.random()-.5)*22*hitFx,(Math.random()-.5)*8*hitFx);
  // тень
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.beginPath(); ctx.ellipse(0,250-br*10,250-br*8,38,0,0,Math.PI*2); ctx.fill();
  // лапы с когтями
  for(const d of[-1,1]){ ctx.save(); ctx.translate(d*205,70); ctx.rotate(d*(.35+Math.sin(time*2.6+d)*.18*k+(angry?.15:0)));
    ctx.fillStyle=`hsl(${hue},50%,24%)`; ctx.beginPath(); ctx.ellipse(d*40,60,52,110,d*-.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#efe3c8"; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(d*40+i*26-9,160); ctx.lineTo(d*40+i*30,205); ctx.lineTo(d*40+i*26+9,160); ctx.fill(); }
    ctx.restore(); }
  // рога
  for(const d of[-1,1]){ const hg=ctx.createLinearGradient(d*90,-120,d*230,-300); hg.addColorStop(0,"#d9c9a3"); hg.addColorStop(1,"#5b4a33");
    ctx.fillStyle=hg; ctx.beginPath(); ctx.moveTo(d*95,-120); ctx.quadraticCurveTo(d*250,-170,d*215,-310); ctx.quadraticCurveTo(d*190,-200,d*40,-150); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=5; for(let i=1;i<4;i++){ ctx.beginPath(); ctx.arc(d*(110+i*28),-150-i*35,26-i*4,0,Math.PI*2); ctx.stroke(); } }
  // тело с объёмом
  const bg=ctx.createRadialGradient(-70,-60,30,0,40,260); bg.addColorStop(0,`hsl(${hue},60%,${angry?44:52}%)`); bg.addColorStop(.6,`hsl(${hue},55%,${angry?28:34}%)`); bg.addColorStop(1,`hsl(${hue},55%,14%)`);
  ctx.fillStyle=bg; ctx.beginPath(); ctx.ellipse(0,40,235+br*6,205-br*4,0,0,Math.PI*2); ctx.fill();
  // брюхо и пятна
  ctx.fillStyle=`hsla(${hue},40%,70%,.22)`; ctx.beginPath(); ctx.ellipse(0,120,140,95,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=`hsla(${hue},55%,12%,.35)`; for(const [sx,sy,r] of [[-170,-20,22],[-150,60,14],[165,-30,18],[180,50,26],[120,-120,12],[-120,-130,15]]){ ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill(); }
  // трещины от урона
  if(dmg>.25){ ctx.strokeStyle=`rgba(255,${angry?80:200},60,${Math.min(.9,dmg)})`; ctx.lineWidth=5; ctx.shadowColor="#ff6a00"; ctx.shadowBlur=14;
    const cr=[[-150,-80,-110,-30,-130,20],[140,-100,105,-45,130,10],[-40,150,0,110,40,160]]; const n=Math.min(3,Math.floor(dmg*4));
    for(let i=0;i<n;i++){ const c=cr[i]; ctx.beginPath(); ctx.moveTo(c[0],c[1]); ctx.lineTo(c[2],c[3]); ctx.lineTo(c[4],c[5]); ctx.stroke(); } ctx.shadowBlur=0; }
  // глаза светятся, моргают, следят
  const blink=(time%4.2)<.12, look=Math.sin(time*.9)*12;

      if(DX>0.5){ gb.drawImage(base,0,SRC0,2,CUT-SRC0,0,F0,DX+1,Y0-F0); gb.drawImage(base,W-2,SRC0,2,CUT-SRC0,W-DX-1,F0,DX+1,Y0-F0); } }
    // низ (арена, призыв, строка, лента) — 30 кадров/с, пиксели холста сохраняются между кадрами
    if(fr%2===1){ g.setTransform(1,0,0,1,0,-Y0);
      drawArena(T,acc); acc=0; g.drawImage(arena,0,Y0,W,AH);
      const fade=g.createLinearGradient(0,Y0,0,Y0+30); fade.addColorStop(0,"rgba(5,11,24,.9)"); fade.addColorStop(1,"rgba(5,11,24,0)"); g.fillStyle=fade; g.fillRect(0,Y0,W,30);
      const pul=1+Math.sin(T*4)*.025; g.save(); g.translate(CX,CTA_Y); g.scale(pul,pul); g.drawImage(ctaC,-(BW/2+30),-(BH/2+30)); g.restore();
      const ty=Y0+190; g.fillStyle="rgba(5,11,24,.72)"; g.fillRect(0,ty-30,W,60); g.fillStyle="rgba(245,197,66,.6)"; g.fillRect(0,ty-30,W,2); g.fillRect(0,ty+28,W,2);
      if(tick){ const off=(T*110)%tick.w; for(let x=-off;x<W;x+=tick.w) g.drawImage(tick.c,x,ty-28); }
      for(const f of feed) f.life-=dt*2; while(feed.length&&feed[feed.length-1].life<=0) feed.pop();
      feed.forEach((f,i)=>{ const k=Math.min(1,(now-f.born)/250), sc=1-i*.08; g.globalAlpha=Math.min(1,f.life)*k; const w=900*sc, h=60*sc; g.drawImage(f.cv,CX-w/2+(1-k)*-60,Y0+262+i*52-h/2,w,h); });
      g.globalAlpha=1;
    }
    requestAnimationFrame(step);
  }
  place(); requestAnimationFrame(step);
})();
</script>
<script id="giftfx">
"use strict";
window.GIFT_FX_TARGET=id=>({x:CX,y:760,color:"#ff5a5a"});
/* ===================== ЭФФЕКТ ПОДАРКА: видно, кто подарил, что и куда это пошло ===================== */
(function(){
  const base=document.getElementById("game"); if(!base) return;
  let g;
  const fx=document.createElement("canvas"); fx.width=810; fx.height=1440; fx.id="giftfx"; // 0.75 разрешения: в 4/3 дешевле, на стриме 720p разницы не видно
  fx.style.cssText="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:3";
  // если есть сцена StreamStorm — рисуем прямо в её холст (на один слой меньше)
  const MERGED=null; if(!MERGED) document.body.appendChild(fx); g=(MERGED||fx).getContext("2d"); // сцена под игрой, эффект подарка — свой слой сверху
  const F='"Segoe UI","Arial Black",system-ui,sans-serif';
  const TIERS={ small:{c1:"#ff7eb3",c2:"#ff4f8b",hold:.55,scale:1,emo:"🌹",parts:14},
                mid:{c1:"#7fd8ff",c2:"#3b7bff",hold:.95,scale:1.1,emo:"💎",parts:40},
                big:{c1:"#ffe27a",c2:"#ff8a00",hold:.8,scale:1.3,emo:"🚀",parts:110} };
  const tierOf=u=>u>=100?"big":u>=10?"mid":"small";
  let cards=[], sparks=[], rings=[], pops=[], flash=0, last=performance.now();
  const imgs=new Map(), rate=[];
  function img(url){ if(!url) return null; if(imgs.has(url)) return imgs.get(url); const im=new Image(); im.src=url; imgs.set(url,im); return im; }
  function target(uid){ let t=null; try{ t=window.GIFT_FX_TARGET&&window.GIFT_FX_TARGET(uid); }catch(e){} if(!t) t={x:540,y:330,color:"#ffd23f"};
    if(window.STAGE_MAP){ const m=window.STAGE_MAP(t.x,t.y); return {x:m.x,y:Math.min(window.STAGE_Y0-30,m.y),color:t.color}; } return t; }
  const waitQ=[]; // подарки, пришедшие во время баннера игры: эффект покажем сразу после него
  // пока на экране баннер игры («МАТЧ НАЧАЛСЯ», «ПЕРЕВОРОТ!»…), карточки его не закрывают
  function bannerOn(){ try{ return typeof banner!=="undefined"&&!!banner; }catch(e){ return false; } }
  function add(u,unit,count,name,pic){
    if(bannerOn()){ if(waitQ.length<40) waitQ.push([u,unit,count,name,pic]); return; }
    const tier=tierOf(unit), coins=unit*count, key=u.id+"|"+name, now=performance.now();
    // комбо: тот же зритель и тот же подарок подряд — одна карточка, счётчик ×N растёт
    const ex=cards.find(c=>c.key===key&&c.st<2&&now-c.born<2500);
    if(ex){ ex.count+=count; ex.coins+=coins; ex.bump=1; ex.dirty=true; ex.t=Math.min(ex.t,.3); return; }
    const T=TIERS[tier]; const lane=cards.filter(c=>c.st<2&&c.tier!=="big").length;
    rate.push(now); while(rate.length&&now-rate[0]>1000) rate.shift();
    if(tier!=="big"&&(lane>=(tier==="small"?3:4)||rate.length>10)){ // поток: без карточек, только вспышка и +X // поток мелких подарков: без карточки, сразу вспышка и «+X» у своей команды
      const tg=target(u.id); rings.push({x:tg.x,y:tg.y,r:10,max:tier==="mid"?160:90,c:tg.color||T.c1,life:1}); pops.push({x:tg.x+(Math.random()-.5)*60,y:tg.y-40,text:`+${coins} 💰`,c:"#fff",size:38,life:1.1}); return; }
    const big=tier==="big";
    if(big&&cards.filter(c=>c.tier==="big"&&c.st<2).length>=2){ const tg=target(u.id); rings.push({x:tg.x,y:tg.y,r:10,max:300,c:tg.color||T.c1,life:1}); pops.push({x:tg.x,y:tg.y-40,text:`+${coins} 💰`,c:"#ffe27a",size:64,life:1.3}); flash=Math.max(flash,.6); return; }
    // свободный слот (2×2 сетка), чтобы карточки не лезли друг на друга; большая — отдельно сверху
    const used=new Set(cards.filter(c=>c.st===0&&c.slot!=null).map(c=>c.slot)); let slot=0; while(used.has(slot)&&slot<3) slot++;
    const bigUsed=cards.some(c=>c.st===0&&c.tier==="big");
    cards.push({key,u,name,pic,tier,T,count,coins,born:now,st:0,t:0,bump:0,slot:big?null:slot,
      x:big?505:265+((slot%2)*470), y:big?(((window.STAGE&&window.STAGE.bigY)||[400,545])[bigUsed?1:0]):680+Math.floor(slot/2)*130, s:0}); // большая — под шапкой и сразу летит к цели
    if(cards.length>10) cards.splice(0,cards.length-10);
    if(big) flash=1;
  }
  // перехватываем события, не меняя логику игры: картинки/аватары — из сырых событий, сам подарок — из onGift игры
  const pics=new Map(), avs=new Map();
  if(typeof window.handleRaw==="function"){ const oh=window.handleRaw; window.handleRaw=function(msg){
    try{ const d=(msg&&msg.data)||{}, uu=d.user||{}; const id=String(d.uniqueId||d.userId||uu.uniqueId||"");
      if(id){ const av=d.profilePictureUrl||uu.profilePictureUrl; if(av) avs.set(id,av); const pic=d.giftPictureUrl||(d.giftDetails&&d.giftDetails.giftImage&&d.giftDetails.giftImage.giftPictureUrl); if(pic) pics.set(id+"|"+String(d.giftName||"").slice(0,16),pic); } }catch(e){}
    return oh.apply(this,arguments); }; }
  if(typeof window.onGift!=="function") return;
  const og=window.onGift; window.onGift=function(u,unit,count,name){
    const r=og.apply(this,arguments);
    if(window.__giftReplay) return r; // повтор подарков с экрана победы — карточка уже была
    try{ const nm=String(name||"подарок").slice(0,16), id=String(u&&u.id||"anon"), n=Math.max(1,+count||1);
      add({id,name:String(u&&u.name||"Зритель").slice(0,20),avatar:(u&&u.avatar)||avs.get(id)||null},Math.max(1,+unit||1),n,nm,pics.get(id+"|"+nm)||null); }catch(e){}
    return r; };
  function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  function text(s,x,y,size,c,al="center",w=900){ g.font=`${w} ${size}px ${F}`; g.textAlign=al; g.textBaseline="middle"; g.lineWidth=Math.max(4,size/6); g.strokeStyle="rgba(0,0,0,.85)"; g.lineJoin="round"; g.strokeText(s,x,y); g.fillStyle=c; g.fillText(s,x,y); }
  function fitW(s,size,maxW){ g.font=`900 ${size}px ${F}`; while(size>12&&g.measureText(s).width>maxW){ size--; g.font=`900 ${size}px ${F}`; } return size; }
  // карточка рисуется один раз в отдельный холст (и заново только при комбо или когда загрузилась картинка)
  const CW=420, CH=110, PAD=40;
  function ready(im){ return !!(im&&im.complete&&im.naturalWidth); }
  function renderCard(c){
    const T=c.T, cv=c.cv||(c.cv=document.createElement("canvas")); cv.width=CW+PAD*2; cv.height=CH+PAD*2; const q=cv.getContext("2d");
    const G=g; g=q; g.save(); g.translate(PAD+CW/2,PAD+CH/2);
    if(c.tier!=="small"){ g.shadowColor=T.c1; g.shadowBlur=c.tier==="big"?36:22; }
    const gr=g.createLinearGradient(-CW/2,0,CW/2,0); gr.addColorStop(0,T.c2); gr.addColorStop(1,T.c1);
    g.fillStyle=gr; rr(-CW/2,-CH/2,CW,CH,CH/2); g.fill(); g.shadowBlur=0;
    g.lineWidth=5; g.strokeStyle="rgba(255,255,255,.9)"; rr(-CW/2,-CH/2,CW,CH,CH/2); g.stroke();
    const ax=-CW/2+CH/2, R=42, av=img(c.u.avatar); g.save(); g.beginPath(); g.arc(ax,0,R,0,Math.PI*2); g.clip();
    if(ready(av)) g.drawImage(av,ax-R,-R,R*2,R*2); else { let hh=0; for(const ch of c.u.name) hh=(hh*31+ch.charCodeAt(0))|0; g.fillStyle=`hsl(${Math.abs(hh)%360},60%,42%)`; g.fillRect(ax-R,-R,R*2,R*2); text(([...c.u.name][0]||"?").toUpperCase(),ax,3,44,"#fff"); }
    g.restore(); g.lineWidth=5; g.strokeStyle="#fff"; g.beginPath(); g.arc(ax,0,R,0,Math.PI*2); g.stroke();
    const nx=ax+R+12, tw=CW-CH-100;
    text(c.u.name,nx,-21,fitW(c.u.name,34,tw),"#fff","left");
    const gl=c.name+(c.count>1?` ×${c.count}`:""); text(gl,nx,22,fitW(gl,28,tw),"#fff","left",800);
    const gx=CW/2-54, pic=img(c.pic);
    if(ready(pic)) g.drawImage(pic,gx-42,-42,84,84); else { g.font=`400 64px ${F}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(T.emo,gx,3); }
    if(c.count>1) text("×"+c.count,CW/2-6,-CH/2+6,40,"#ffe600");
    g.restore(); g=G;
    c.dirty=false; c.imgsOk=ready(av)||!c.u.avatar; c.picOk=ready(pic)||!c.pic;
  }
  const flashCv=document.createElement("canvas"); flashCv.width=270; flashCv.height=480;
  { const fg=flashCv.getContext("2d"), gr=fg.createRadialGradient(135,190,12,135,190,225); gr.addColorStop(0,"rgba(255,220,120,.45)"); gr.addColorStop(1,"rgba(255,140,0,0)"); fg.fillStyle=gr; fg.fillRect(0,0,270,480); }
  // «+X» рисуем один раз в маленький холст, дальше только drawImage
  function popCv(p){ const tmp=g, c=document.createElement("canvas"); g=c.getContext("2d"); g.font=`900 ${p.size}px ${F}`; const w=Math.ceil(g.measureText(p.text).width)+p.size; c.width=w; c.height=Math.ceil(p.size*1.6); g=c.getContext("2d"); text(p.text,w/2,c.height/2,p.size,p.c); g=tmp; p.cv=c; }
  let idle=false, lastW="";
  function drawCard(c){
    if(!c.cv||c.dirty||(!c.imgsOk&&ready(img(c.u.avatar)))||(!c.picOk&&ready(img(c.pic)))) renderCard(c);
    const sc=c.s*(1+c.bump*.12)*c.T.scale; if(sc<=0) return;
    g.save(); g.translate(c.x,c.y); g.scale(sc,sc); g.drawImage(c.cv,-(CW/2+PAD),-(CH/2+PAD)); g.restore();
  }
  function step(now){
    if(waitQ.length&&!bannerOn()) for(let n=0;n<3&&waitQ.length;n++) add(...waitQ.shift());
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(base.style.width!==lastW){ lastW=base.style.width; fx.style.width=base.style.width; fx.style.height=base.style.height; }
    for(const c of cards){ c.bump=Math.max(0,c.bump-dt*4); c.t+=dt;
      if(c.st===0){ c.s=Math.min(1,c.t/.18)*(1+Math.sin(Math.min(1,c.t/.3)*Math.PI)*.18); if(c.t>=c.T.hold+.2){ c.st=1; c.t=0; const tg=target(c.u.id); c.tx=tg.x; c.ty=tg.y; c.tc=tg.color||c.T.c1; c.sx=c.x; c.sy=c.y; } }
      else if(c.st===1){ const k=Math.min(1,c.t/.55), e=k*k*(3-2*k); c.x=c.sx+(c.tx-c.sx)*e; c.y=c.sy+(c.ty-c.sy)*e-Math.sin(k*Math.PI)*120; c.s=1-.75*e;
        if(sparks.length<120) for(let i=0;i<(c.tier==="big"?4:2);i++) sparks.push({x:c.x+(Math.random()-.5)*30,y:c.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.5,c:c.T.c1,r:3+Math.random()*4});
        if(k>=1){ c.st=2; const n=c.T.parts; for(let i=0;i<n&&sparks.length<160;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*(c.tier==="big"?700:380); sparks.push({x:c.tx,y:c.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7+Math.random()*.5,c:Math.random()<.5?c.tc:c.T.c1,r:3+Math.random()*(c.tier==="big"?9:5),gr:500}); }
          rings.push({x:c.tx,y:c.ty,r:10,max:c.tier==="big"?420:c.tier==="mid"?220:110,c:c.tc,life:1});
          pops.push({x:c.tx,y:c.ty-40,text:`+${c.coins} 💰`,c:"#fff",size:c.tier==="big"?72:c.tier==="mid"?56:42,life:1.3}); } } }
    cards=cards.filter(c=>c.st<2);
    for(const p of sparks){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.gr) p.vy+=p.gr*dt; } sparks=sparks.filter(p=>p.life>0);
    for(const r of rings){ r.life-=dt*1.6; r.r+=(r.max-r.r)*Math.min(1,dt*7); } rings=rings.filter(r=>r.life>0);
    for(const p of pops){ p.life-=dt; p.y-=70*dt; } pops=pops.filter(p=>p.life>0); if(pops.length>20) pops.splice(0,pops.length-20);
    flash=Math.max(0,flash-dt*2);
    const active=flash>0||cards.length||sparks.length||rings.length||pops.length;
    if(!active){ if(!MERGED){ if(!idle){ g.clearRect(0,0,1080,1920); idle=true; } requestAnimationFrame(step); } return; } idle=false;
    if(MERGED) g.save(); else { g.setTransform(.75,0,0,.75,0,0); g.clearRect(0,0,1080,1920); }
    if(flash>0){ g.globalAlpha=flash; g.drawImage(flashCv,0,0,1080,1920); g.globalAlpha=1; }
    for(const r of rings){ g.globalAlpha=Math.max(0,r.life); g.strokeStyle=r.c; g.lineWidth=10*r.life+2; g.beginPath(); g.arc(r.x,r.y,r.r,0,Math.PI*2); g.stroke(); } g.globalAlpha=1;
    for(const p of sparks){ g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); g.fillStyle=p.c; g.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } g.globalAlpha=1;
    for(const c of cards) if(c.tier!=="big") drawCard(c);
    for(const c of cards) if(c.tier==="big") drawCard(c); // большие всегда поверх
    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    if(MERGED) g.restore(); else requestAnimationFrame(step);
  }
  if(MERGED) window.__fxStep=step; else requestAnimationFrame(step);
})();
</script>
