<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Битва с боссом — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
<script id="modes" data-game="boss-fight">
/* ===================== РЕЖИМЫ StreamStorm: выбор категории до эфира (?mode=) =====================
   Лаунчер добавляет &mode=<id>. Режим только подставляет состав команд (параметры teams / a,b),
   поэтому правила игры не меняются. Явные teams=, a=, b= в ссылке важнее режима. */
(function(){
  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const MODES={
    "lava-rising":  {countries:{teams:"KZ,UZ,PL,DE,TR,BR"}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "country-race": {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "tower":        {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "paint-map":    {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "chat-football":{duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-fans":    {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-space":   {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-summit":  {duel:{}, colors:{a:"RED",b:"BLU"}},
    "duel-trade":   {duel:{}, colors:{a:"RED",b:"BLU"}},
  };
  const q=new URLSearchParams(location.search), id=(q.get("mode")||"").toLowerCase(), m=MODES[GAME]&&MODES[GAME][id];
  window.SS_MODE=m?id:null;
  if(!m) return;
  let ch=false; for(const k in m){ if(!q.has(k)){ q.set(k,m[k]); ch=true; } }
  if(ch) try{ history.replaceState(null,"",location.pathname+"?"+q.toString()+location.hash); }catch(e){}
  // режим «Цвета»: подсказки «напиши страну» → «напиши цвет» во всех надписях холста (с кэшем, без затрат на кадр)
  if(id==="colors"){ const R=[[/(свою|другую|твою) страну/g,"$1 команду"],[/твоя страна/g,"твоя команда"],[/страну/g,"цвет"],[/Страну/g,"Цвет"],[/СТРАНУ/g,"ЦВЕТ"],[/название, флаг или номер/g,"цвет или номер"],[/ГОНКА СТРАН/g,"ГОНКА КОМАНД"]];
    const cache=new Map(); const fx=t=>{ if(typeof t!=="string"||!/тран|ТРАН|флаг/.test(t)) return t; let r=cache.get(t); if(r===undefined){ r=t; for(const [a,b] of R) r=r.replace(a,b); if(cache.size>500) cache.clear(); cache.set(t,r); } return r; };
    const P=CanvasRenderingContext2D.prototype; for(const fn of ["fillText","strokeText","measureText"]){ const o=P[fn]; P[fn]=function(t,...a){ return o.call(this,fx(t),...a); }; } }
})();
</script>
<script id="tex">
"use strict";
/* ===================== ТЕКСТУРЫ StreamStorm: процедурные материалы и «настоящие» предметы =====================
   Всё рисуется кодом один раз в маленькие бесшовные плитки 256×256 (без файлов картинок), дальше — заливка узором.
   TEX.over(ctx,"stone",x,y,w,h,a)  — наложить материал на прямоугольник (a — сила)
   TEX.path(ctx,"stone",a)          — наложить материал на текущий путь (после beginPath/rr/arc)
   TEX.ball(ctx,x,y,r,rot)          — футбольный мяч (панели, швы, объём, блик)
   TEX.sphere(ctx,x,y,r,c1,c2)      — объёмный шар
   TEX.pillar(ctx,x,y,w,h,tint)     — каменная колонна из блоков
   TEX.slab(ctx,x,y,w,h,c)          — плита-платформа: камень/металл, фаска, заклёпки, тень
   TEX.shade(c,k)                   — светлее (k>0) / темнее (k<0) цвет #rrggbb */
(function(){
  const S=256, cache={}, pats=new WeakMap();
  function rnd(seed){ let s=seed>>>0||1; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); }
  function mk(){ const c=document.createElement("canvas"); c.width=S; c.height=S; return c; }
  // рисуем элемент с переносом через края, чтобы плитка была бесшовной
  function wrap(fn,x,y,m){ for(const dx of [0,-S,S]) for(const dy of [0,-S,S]) if((dx===0||x+dx>-m&&x+dx<S+m)&&(dy===0||y+dy>-m&&y+dy<S+m)) fn(x+dx,y+dy); }
  const MAKERS={
    noise(k,r){ for(let i=0;i<5200;i++){ const v=r(); k.fillStyle=v<.5?`rgba(0,0,0,${.10+r()*.2})`:`rgba(255,255,255,${.06+r()*.14})`; k.fillRect(r()*S|0,r()*S|0,1+(r()<.15),1+(r()<.15)); } },
    grass(k,r){ k.lineCap="round"; for(let i=0;i<1700;i++){ const x=r()*S, y=r()*S, h=5+r()*9, lean=(r()-.5)*5, d=r();
        k.strokeStyle=d<.55?`rgba(0,40,0,${.16+r()*.22})`:`rgba(190,255,150,${.10+r()*.16})`; k.lineWidth=1+r()*1.2;
        wrap((X,Y)=>{ k.beginPath(); k.moveTo(X,Y); k.quadraticCurveTo(X+lean*.3,Y-h*.6,X+lean,Y-h); k.stroke(); },x,y,16); } },
    asphalt(k,r){ for(let i=0;i<9000;i++){ const v=r(); k.fillStyle=v<.6?`rgba(0,0,0,${.15+r()*.25})`:`rgba(255,255,255,${.05+r()*.16})`; const s=r()<.08?2.5:1.2; k.fillRect(r()*S,r()*S,s,s); }
        for(let i=0;i<6;i++){ k.strokeStyle="rgba(0,0,0,.18)"; k.lineWidth=1; let x=r()*S,y=r()*S; k.beginPath(); k.moveTo(x,y); for(let j=0;j<6;j++){ x+=(r()-.5)*30; y+=(r()-.5)*30; k.lineTo(x,y); } k.stroke(); } },
    stone(k,r){ for(let i=0;i<70;i++){ const x=r()*S,y=r()*S,R=14+r()*34, d=r()<.5; wrap((X,Y)=>{ const g=k.createRadialGradient(X,Y,0,X,Y,R); g.addColorStop(0,d?"rgba(0,0,0,.16)":"rgba(255,255,255,.10)"); g.addColorStop(1,"rgba(0,0,0,0)"); k.fillStyle=g; k.fillRect(X-R,Y-R,R*2,R*2); },x,y,R); }
        MAKERS.noise(k,r); k.lineWidth=1.2; for(let i=0;i<9;i++){ let x=r()*S,y=r()*S; k.strokeStyle="rgba(0,0,0,.28)"; k.beginPath(); k.moveTo(x,y); for(let j=0;j<5;j++){ x+=(r()-.5)*36; y+=(r()-.5)*36; k.lineTo(x,y); } k.stroke(); } },
    brick(k,r){ const bw=64,bh=32; MAKERS.stone(k,r); for(let row=0;row<S/bh;row++){ const off=row%2?bw/2:0; for(let c=-1;c<S/bw+1;c++){ const x=c*bw+off,y=row*bh;
        k.fillStyle=`rgba(${r()<.5?"0,0,0":"255,255,255"},${r()*.12})`; k.fillRect(x+2,y+2,bw-4,bh-4);
        k.fillStyle="rgba(255,255,255,.10)"; k.fillRect(x+2,y+2,bw-4,2); k.fillStyle="rgba(0,0,0,.22)"; k.fillRect(x+2,y+bh-4,bw-4,2); }
        k.fillStyle="rgba(0,0,0,.45)"; k.fillRect(0,row*bh,S,2); for(let c=-1;c<S/bw+1;c++) k.fillRect(c*bw+off,row*bh,2,bh); } },
    metal(k,r){ for(let i=0;i<420;i++){ const y=r()*S, a=r()*.10; k.fillStyle=r()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a*1.4})`; k.fillRect(0,y,S,.6+r()*1.4); }
        for(let i=0;i<1200;i++){ k.fillStyle=`rgba(0,0,0,${r()*.12})`; k.fillRect(r()*S,r()*S,1,1); } },
    wood(k,r){ for(let i=0;i<46;i++){ const y0=r()*S, amp=2+r()*5, ph=r()*6, a=.08+r()*.18; k.strokeStyle=r()<.6?`rgba(60,25,0,${a})`:`rgba(255,220,170,${a*.7})`; k.lineWidth=.8+r()*2;
        wrap((X,Y)=>{ k.beginPath(); for(let x=0;x<=S;x+=8){ const y=Y+Math.sin(x/S*Math.PI*2*2+ph)*amp; x?k.lineTo(x,y):k.moveTo(x,y); } k.stroke(); },0,y0,10); }
        for(let i=0;i<5;i++){ const x=r()*S,y=r()*S; wrap((X,Y)=>{ k.strokeStyle="rgba(60,25,0,.3)"; k.lineWidth=1.5; k.beginPath(); k.ellipse(X,Y,10,4,0,0,Math.PI*2); k.stroke(); k.beginPath(); k.ellipse(X,Y,4,1.5,0,0,Math.PI*2); k.stroke(); },x,y,12); } },
    velvet(k,r){ for(let i=0;i<S;i+=3){ k.fillStyle=`rgba(0,0,0,${.06+r()*.06})`; k.fillRect(0,i,S,1); k.fillRect(i,0,1,S); } for(let i=0;i<40;i++){ const x=r()*S,y=r()*S,R=20+r()*40; wrap((X,Y)=>{ const g=k.createRadialGradient(X,Y,0,X,Y,R); g.addColorStop(0,"rgba(255,255,255,.07)"); g.addColorStop(1,"rgba(255,255,255,0)"); k.fillStyle=g; k.fillRect(X-R,Y-R,R*2,R*2); },x,y,R); } },
    concrete(k,r){ MAKERS.noise(k,r); for(let i=0;i<260;i++){ const x=r()*S,y=r()*S,R=.8+r()*2.2; k.fillStyle=`rgba(0,0,0,${.2+r()*.25})`; k.beginPath(); k.arc(x,y,R,0,Math.PI*2); k.fill(); }
        for(let i=0;i<30;i++){ const x=r()*S,y=r()*S,R=20+r()*40; wrap((X,Y)=>{ const g=k.createRadialGradient(X,Y,0,X,Y,R); g.addColorStop(0,`rgba(0,0,0,${r()*.08})`); g.addColorStop(1,"rgba(0,0,0,0)"); k.fillStyle=g; k.fillRect(X-R,Y-R,R*2,R*2); },x,y,R); } },
    rock(k,r){ MAKERS.stone(k,r); for(let i=0;i<14;i++){ const y0=r()*S, a=.10+r()*.18; k.strokeStyle=`rgba(0,0,0,${a})`; k.lineWidth=1+r()*3; wrap((X,Y)=>{ k.beginPath(); for(let x=0;x<=S;x+=16){ const y=Y+Math.sin(x/S*Math.PI*2+y0)*6+(r()-.5)*3; x?k.lineTo(x,y):k.moveTo(x,y); } k.stroke(); },0,y0,10); } },
    crust(k,r){ // корка остывающей лавы: тёмные плиты и светящиеся трещины
      for(let i=0;i<46;i++){ const x=r()*S,y=r()*S,R=16+r()*26; wrap((X,Y)=>{ k.fillStyle=`rgba(40,8,0,${.25+r()*.25})`; k.beginPath(); for(let j=0;j<7;j++){ const a=j/7*Math.PI*2, rr=R*(.7+r()*.3); j?k.lineTo(X+Math.cos(a)*rr,Y+Math.sin(a)*rr):k.moveTo(X+Math.cos(a)*rr,Y+Math.sin(a)*rr); } k.closePath(); k.fill(); },x,y,R); }
      MAKERS.noise(k,r); },
    paper(k,r){ for(let i=0;i<3000;i++){ k.fillStyle=`rgba(${r()<.5?"0,0,0":"255,255,255"},${r()*.06})`; k.fillRect(r()*S,r()*S,2,2); } for(let i=0;i<80;i++){ k.strokeStyle=`rgba(0,0,0,${r()*.06})`; k.beginPath(); const x=r()*S,y=r()*S; k.moveTo(x,y); k.lineTo(x+(r()-.5)*40,y+(r()-.5)*40); k.stroke(); } },
    carbon(k,r){ for(let y=0;y<S;y+=8) for(let x=0;x<S;x+=8){ const d=((x+y)/8)%2; const g=k.createLinearGradient(x,y,x+8,y+8); g.addColorStop(0,d?"rgba(255,255,255,.07)":"rgba(0,0,0,.18)"); g.addColorStop(1,d?"rgba(0,0,0,.18)":"rgba(255,255,255,.07)"); k.fillStyle=g; k.fillRect(x,y,8,8); } },
    stars(k,r){ for(let i=0;i<220;i++){ const a=r(), R=a<.9?.6+r()*.8:1.4+r()*1.1; k.fillStyle=`rgba(255,255,255,${.25+r()*.6})`; k.beginPath(); k.arc(r()*S,r()*S,R,0,Math.PI*2); k.fill(); } },
  };
  function tile(name){ if(cache[name]) return cache[name]; const c=mk(), k=c.getContext("2d"); let h=0; for(const ch of name) h=(h*31+ch.charCodeAt(0))|0; (MAKERS[name]||MAKERS.noise)(k,rnd(h)); return cache[name]=c; }
  function pat(ctx,name){ let m=pats.get(ctx); if(!m){ m={}; pats.set(ctx,m); } return m[name]||(m[name]=ctx.createPattern(tile(name),"repeat")); }
  // кэш готовых слоёв: материал заранее «запечён» в холст нужного размера, в кадре — один drawImage
  const lay=new Map();
  function cached(key,w,h,fn){ let c=lay.get(key); if(!c){ c=document.createElement("canvas"); c.width=Math.max(1,Math.ceil(w)); c.height=Math.max(1,Math.ceil(h)); fn(c.getContext("2d"),c.width,c.height); lay.set(key,c); if(lay.size>160) lay.delete(lay.keys().next().value); } return c; }
  // размер слоя округляем вверх до 256, чтобы растущие объекты (башня, лава) не создавали холст каждый кадр
  function over(ctx,name,x,y,w,h,a=1,scale=1){ if(w<1||h<1) return; w=Math.ceil(w); h=Math.ceil(h); const cw=Math.ceil(w/256)*256, ch=Math.ceil(h/256)*256;
    const c=cached("o|"+name+"|"+cw+"|"+ch+"|"+scale,cw,ch,(k)=>{ k.fillStyle=k.createPattern(tile(name),"repeat"); if(scale!==1) k.scale(scale,scale); k.fillRect(0,0,cw/scale,ch/scale); });
    const ga=ctx.globalAlpha; ctx.globalAlpha=ga*a; ctx.drawImage(c,0,0,w,h,x,y,w,h); ctx.globalAlpha=ga; }
  function path(ctx,name,a=1,ox=0,oy=0,scale=1){ ctx.save(); ctx.globalAlpha*=a; const p=pat(ctx,name); if(p.setTransform&&typeof DOMMatrix!=="undefined") p.setTransform(new DOMMatrix([scale,0,0,scale,ox,oy])); ctx.fillStyle=p; ctx.fill(); if(p.setTransform&&typeof DOMMatrix!=="undefined") p.setTransform(new DOMMatrix()); ctx.restore(); }
  function shade(c,k){ const m=/^#?([0-9a-f]{6})$/i.exec(String(c||"")); if(!m) return c; const n=parseInt(m[1],16); let r=n>>16,g=n>>8&255,b=n&255;
    if(k>0){ r+=(255-r)*k; g+=(255-g)*k; b+=(255-b)*k; } else { r*=1+k; g*=1+k; b*=1+k; } return `rgb(${r|0},${g|0},${b|0})`; }
  function rrp(ctx,x,y,w,h,r){ r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ---- футбольный мяч: белые шестиугольники, чёрные пятиугольники, швы, объём (рисуется в кэш по углу поворота)
  const ballCache={};
  function ballSprite(rotStep){ const key=rotStep; if(ballCache[key]) return ballCache[key]; const R=64, c=document.createElement("canvas"); c.width=c.height=R*2+8; const k=c.getContext("2d"); k.translate(R+4,R+4);
    k.save(); k.beginPath(); k.arc(0,0,R,0,Math.PI*2); k.clip(); k.fillStyle="#f4f6fa"; k.fillRect(-R,-R,R*2,R*2);
    k.rotate(rotStep*Math.PI*2/24);
    const pent=(x,y,s,rot)=>{ k.beginPath(); for(let i=0;i<5;i++){ const a=rot+i*Math.PI*2/5-Math.PI/2; const px=x+Math.cos(a)*s, py=y+Math.sin(a)*s; i?k.lineTo(px,py):k.moveTo(px,py); } k.closePath(); };
    // центральный пятиугольник и 5 вокруг (сжатые к краю — эффект сферы)
    k.fillStyle="#16181d"; pent(0,0,R*.30,0); k.fill();
    k.strokeStyle="rgba(40,44,55,.55)"; k.lineWidth=2.2;
    for(let i=0;i<5;i++){ const a=i*Math.PI*2/5-Math.PI/2; // шов от вершины центрального к краю
      const vx=Math.cos(a)*R*.30, vy=Math.sin(a)*R*.30; k.beginPath(); k.moveTo(vx,vy); k.lineTo(Math.cos(a)*R*.62,Math.sin(a)*R*.62); k.stroke();
      const b=a+Math.PI/5, d=R*.92; k.save(); k.translate(Math.cos(b)*d,Math.sin(b)*d); k.rotate(b+Math.PI/2); k.scale(1,.55); k.fillStyle="#16181d"; pent(0,0,R*.32,Math.PI); k.fill(); k.restore();
      k.beginPath(); k.moveTo(Math.cos(a)*R*.62,Math.sin(a)*R*.62); k.lineTo(Math.cos(a-Math.PI/5)*R*.70,Math.sin(a-Math.PI/5)*R*.70); k.moveTo(Math.cos(a)*R*.62,Math.sin(a)*R*.62); k.lineTo(Math.cos(a+Math.PI/5)*R*.70,Math.sin(a+Math.PI/5)*R*.70); k.stroke(); }
    k.restore();
    // объём: тень снизу-справа, блик сверху-слева, обод
    const sh=k.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R); sh.addColorStop(0,"rgba(255,255,255,0)"); sh.addColorStop(.65,"rgba(0,0,0,.05)"); sh.addColorStop(1,"rgba(0,0,30,.45)");
    k.fillStyle=sh; k.beginPath(); k.arc(0,0,R,0,Math.PI*2); k.fill();
    const hl=k.createRadialGradient(-R*.38,-R*.42,0,-R*.38,-R*.42,R*.42); hl.addColorStop(0,"rgba(255,255,255,.85)"); hl.addColorStop(1,"rgba(255,255,255,0)"); k.fillStyle=hl; k.beginPath(); k.arc(0,0,R,0,Math.PI*2); k.fill();
    k.strokeStyle="rgba(0,0,0,.55)"; k.lineWidth=3; k.beginPath(); k.arc(0,0,R-1,0,Math.PI*2); k.stroke();
    return ballCache[key]=c; }
  function ball(ctx,x,y,r,rot=0){ const step=((Math.round(rot/(Math.PI*2/24))%24)+24)%24, c=ballSprite(step), s=r/64; ctx.drawImage(c,x-(c.width/2)*s,y-(c.height/2)*s,c.width*s,c.height*s); }

  function sphere(ctx,x,y,r,c1,c2){ const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r); g.addColorStop(0,shade(c1,.55)); g.addColorStop(.55,c1); g.addColorStop(1,c2||shade(c1,-.55));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }

  // ---- каменная колонна: блоки с растворными швами, объём по бокам
  function pillar(ctx,x,y,w,h,tint){ if(h<=0||w<=0) return; w=Math.round(w); const SH=2000, c=cached("p|"+w+"|"+tint,w,SH,(k)=>pillarRaw(k,0,0,w,SH,tint));
    h=Math.min(h,SH); ctx.drawImage(c,0,SH-h,w,h,x,y,w,h); }
  function pillarRaw(ctx,x,y,w,h,tint){ ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    const g=ctx.createLinearGradient(x,0,x+w,0); g.addColorStop(0,shade(tint||"#6b6f7a",-.45)); g.addColorStop(.35,shade(tint||"#6b6f7a",.12)); g.addColorStop(.7,tint||"#6b6f7a"); g.addColorStop(1,shade(tint||"#6b6f7a",-.55));
    ctx.fillStyle=g; ctx.fillRect(x,y,w,h);
    ctx.beginPath(); ctx.rect(x,y,w,h); path(ctx,"stone",.9,x,y);
    const bh=34; for(let yy=y+h; yy>y-bh; yy-=bh){ const row=Math.round((y+h-yy)/bh), off=row%2?w/2:w/4;
      ctx.fillStyle="rgba(0,0,0,.42)"; ctx.fillRect(x,yy-2,w,3); ctx.fillStyle="rgba(255,255,255,.10)"; ctx.fillRect(x,yy+1,w,1.5);

  function slab(ctx,x,y,w,h,c,opt={}){ w=Math.round(w); h=Math.round(h); const P=12, sp=cached("s|"+w+"|"+h+"|"+c+"|"+(opt.mat||"")+"|"+(opt.rivets!==false),w+P*2,h+P*2,(k)=>slabRaw(k,P,P,w,h,c,opt)); ctx.drawImage(sp,x-P,y-P); }

    if(opt.rivets!==false&&w>60){ for(const rx of [x+12,x+w-12]){ const ry=y+top+(h-top)/2; ctx.fillStyle=shade(c,-.6); ctx.beginPath(); ctx.arc(rx,ry,3.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath(); ctx.arc(rx-1,ry-1,1.4,0,Math.PI*2); ctx.fill(); } }
    ctx.strokeStyle="rgba(0,0,0,.5)"; ctx.lineWidth=2; rrp(ctx,x,y,w,h,8); ctx.stroke(); ctx.restore(); }

})();

<script>

const Q=new URLSearchParams(location.search);
if(Q.get("ws")) CONFIG.wsUrl=Q.get("ws");

(Q.get("map")||"").split(",").forEach(x=>{const [id,a,p]=x.split(":"); if(id&&a) GIFT_MAP.set(String(id).trim(),{action:a.trim().toLowerCase(),power:+p||0});});

if(OBS||!!window.obsstudio||(Q.has("src")&&Q.get("panel")!=="1")) document.getElementById("panel").style.display="none";
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, PW=W-CONFIG.safe.right, CX=PW/2+20, TOP=CONFIG.safe.top, CHAT_Y=1150; // ниже CHAT_Y у зрителей чат TikTok
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';
let time=0, shake=0, flash=0, parts=[], floaters=[], feed=[], banner=null;

let ws=null, wsState="wait";
function setStatus(s,t){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=t; }
function connect(){ try{ws=new WebSocket(CONFIG.wsUrl);}catch(e){setStatus("bad","❌ Неверный адрес");return;}
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl); ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{try{handleRaw(JSON.parse(e.data));}catch(_){}}; ws.onclose=()=>{setStatus("bad","🔴 Нет связи — переподключаюсь…");setTimeout(connect,3000);}; ws.onerror=()=>{try{ws.close();}catch(_){}}; }
function handleRaw(msg){
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user, base={uniqueId:u.id,nickname:u.name};   // формат лаунчера
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};

  const ev=String(msg.event||msg.type||"").toLowerCase(), d=msg.data||msg, uu=d.user||{};
  const u={id:String(d.uniqueId||d.userId||uu.uniqueId||"anon"), name:String(d.nickname||uu.nickname||d.uniqueId||"Зритель").slice(0,22), avatar:d.profilePictureUrl||uu.profilePictureUrl||null};

    case "chat": case "comment": onComment(u,String(d.comment||"")); break;

    case "follow": onFollow(u); break;

  }
}
/* лайки копятся у каждого зрителя: каждые N лайков = 1 очко */
function likePoints(u,n,per){ const b=(likeBanks.get(u.id)||0)+n, p=Math.floor(b/per); likeBanks.set(u.id,b%per); return p; }
function mapped(giftId){ return giftId!=null?GIFT_MAP.get(String(giftId)):null; }

function txt(s,x,y,size,c,align="center",w=900,stroke=true){ ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  if(ring){ ctx.lineWidth=Math.max(3,r*.14); ctx.strokeStyle=ring; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke(); } }
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function showBanner(title,sub,c){ banner={title,sub,c,life:2.8}; }

function burst(x,y,c,n){ for(let i=0;i<n&&parts.length<600;i++){const a=Math.random()*Math.PI*2,s=150+Math.random()*500; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,life:.8+Math.random()*.6,c,size:5+Math.random()*8,g:900});} }
function emo(x,y,e,size=32){ if(parts.length<600) parts.push({x,y,vx:(Math.random()-.5)*40,vy:-200,life:1.2,emo:e,size}); }
function floater(x,y,text,c="#fff",size=48){ floaters.push({x,y,text,c,size,life:1.4}); if(floaters.length>25) floaters.shift(); }
function updateFx(dt){
  shake=Math.max(0,shake-dt*2); flash=Math.max(0,flash-dt*2.5);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;} parts=parts.filter(p=>p.life>0);
  floaters.forEach(f=>{f.life-=dt;f.y-=60*dt;}); floaters=floaters.filter(f=>f.life>0);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);

}
function drawFx(){
  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); if(p.emo) txt(p.emo,p.x,p.y,p.size,"#fff","center",400,false); else {ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size);} }
  ctx.globalAlpha=1; for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life); txt(f.text,f.x,f.y,f.size,f.c); } ctx.globalAlpha=1;
  if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash*.35})`; ctx.fillRect(-40,-40,W+80,H+80); }
}
function drawHeader(title,color,sub){
  if(STREAMER) txt("@"+STREAMER,40,TOP-30,24,"rgba(255,255,255,.6)","left",700,false);
  if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",PW-60,TOP-30,22,"#f88","center",700);
  fit(title,CX,TOP+40,64,PW-60,color); if(sub) txt(sub,CX,TOP+100,34,"#fff");
}
function drawRules(y,l1,l2){ ctx.fillStyle="rgba(0,0,0,.5)"; rr(40,y,PW-40,100,18); ctx.fill(); fit(l1,CX,y+28,26,PW-80,"#fff"); fit(l2,CX,y+72,25,PW-80,"#ffd98a"); }
function drawFeed(y,gap=36){ feed.forEach((f,i)=>{ ctx.globalAlpha=Math.min(1,f.life); fit(f.text,CX,y+i*gap,26,PW-120,f.c); }); ctx.globalAlpha=1; }
function drawBanner(y){ if(!banner) return; const a=Math.min(1,banner.life*2), s=1+Math.max(0,banner.life-2.4)*1.2; ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,y); ctx.scale(s,s);
  ctx.fillStyle="rgba(0,0,0,.78)"; rr(-440,-80,880,160,30); ctx.fill(); fit(banner.title,0,-26,60,840,banner.c); fit(banner.sub,0,40,32,840,"#fff"); ctx.restore(); }
function dim(){ ctx.fillStyle="rgba(0,0,0,.8)"; ctx.fillRect(0,0,W,H); }
function topList(map,n){ return [...map.values()].sort((a,b)=>b.pts-a.pts).slice(0,n); }
function credit(map,u,pts,extra){ let c=map.get(u.id); if(!c){c={name:u.name,avatar:u.avatar,pts:0,...(extra||{})};map.set(u.id,c);} c.name=u.name; if(u.avatar)c.avatar=u.avatar; c.pts+=pts; return c; }
const BOTN=["Саня_228","katya.love","Мурат","DimonPro","Олежка","айгерим","Vlad_TT","Настя","Бека","Lena_K","Тимур","Ярик","ZhanaR","Макс","Polina","Арман","Dasha","Kostya","Аня","Mira"];
const bots=BOTN.map((n,i)=>({id:"bot"+i,name:n,act:Math.random()*3}));
function eachBot(dt,fn){ for(const b of bots){ b.act-=dt; if(b.act>0) continue; b.act=.8+Math.random()*2.8; fn({id:b.id,name:b.name},Math.random(),b); } }
function wirePanel(act,keys){
  const btn=document.getElementById("botsBtn"); const upd=()=>btn&&(btn.textContent="🤖 Демо-боты: "+(botsOn?"вкл":"выкл"));
  const run=a=>{ if(a==="bots") botsOn=!botsOn; else act(a); upd(); };
  document.getElementById("panel").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) run(b.dataset.a);});

function start(){

window.addEventListener("message",e=>{ if(e.data&&e.data.source==="magma-launcher"&&e.data.event){ try{ handleRaw(e.data.event); }catch(_){} } }); // GAME-CONTRACT §6

/* ===================== ИГРА ===================== */
let level=1, hp=0, maxHp=0, vhp=0, phase="play", phaseT=0, atkT=0, stun=0, shield=0, fans=new Map(), won=false, hitFx=0, pendingG=[], wins=0;

function newBoss(){ maxHp=Math.round(CONFIG.baseHp*Math.pow(CONFIG.hpGrowth,level-1)); hp=vhp=maxHp; phase="play"; phaseT=CONFIG.roundSeconds; atkT=CONFIG.attackEvery; stun=0; shield=0; fans=new Map(); won=false;
  showBanner(`👹 БОСС УРОВНЯ ${level}`,`${maxHp} здоровья · бейте подарками все вместе!`,"#ff5a5a");

const needShield=()=>CONFIG.shieldPerLevel*level;
function damage(u,d,label){ hp-=d; hitFx=1; credit(fans,u,d); shake=Math.min(1,shake+d/300); burst(CX+(Math.random()-.5)*200,760,"#ffb347",Math.min(40,5+d/5));
  floater(CX+(Math.random()-.5)*300,620,`-${Math.round(d)}`,d>=100?"#ffd23f":"#ff8080",d>=100?64:44); if(d>=30) addFeed(`⚔️ ${u.name}: ${label} → ${Math.round(d)} урона`,"#ffb3a0"); }
function onGift(u,unit,count,name,giftId){
  if(phase!=="play"){ if(pendingG.length<200) pendingG.push([u,unit,count,name,giftId]); return; }
  const mp=mapped(giftId); const kind=mp?mp.action:(unit>=100?"big":unit>=10?"mid":"small"); if(kind==="none") return;
  const coins=(mp?mp.power:unit)*count*CONFIG.coinDamage;
  if(kind==="shield"){ shield+=coins; return; }
  if(kind==="big"){ stun=Math.max(stun,CONFIG.stunSeconds); damage(u,coins*CONFIG.ultMult,name); showBanner(`💥 УЛЬТА: ${u.name}`,`${name}: ×${CONFIG.ultMult} урона и босс оглушён ${CONFIG.stunSeconds} с`,"#ffd23f"); }
  else if(kind==="mid") damage(u,coins*CONFIG.critMult,`${name} (крит ×${CONFIG.critMult})`);

function onLike(u,n){ if(phase!=="play") return; const p=likePoints(u,n,CONFIG.likesPerShield); if(p) shield+=p; if(Math.random()<.3) emo(CX+(Math.random()-.5)*600,CHAT_Y-40,"🛡",28); }
function onComment(u,text){ if(/^(!?атака|!?attack|⚔️|🗡)/i.test(text.trim())) emo(CX+(Math.random()-.5)*600,CHAT_Y-40,"⚔️",30); }
function onFollow(u){ shield+=10; addFeed(`➕ ${u.name} подписался: +10 щита`,"#9fe0ff"); }
function gameUpdate(dt){ phaseT-=dt; vhp+=(hp-vhp)*Math.min(1,dt*6); hitFx=Math.max(0,hitFx-dt*4);
  if(phase==="play"){
    if(stun>0) stun-=dt; else { atkT-=dt; if(atkT<=0){ atkT=CONFIG.attackEvery;
      if(shield>=needShield()){ showBanner("🛡 АТАКА ОТБИТА!",`Щит ${Math.floor(shield)} из ${needShield()} — босс не вылечился`,"#7fe0ff"); }
      else { const h=Math.round(maxHp*CONFIG.healShare); hp=Math.min(maxHp,hp+h); shake=1; showBanner("👹 БОСС АТАКУЕТ!",`Щита не хватило: босс вылечил ${h}. Лайкайте, чтобы держать щит!`,"#ff4040"); }

function drawBoss(x,y,s){

    ctx.fillStyle="#efe3c8"; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(d*40+i*26-9,160); ctx.lineTo(d*40+i*30,205); ctx.lineTo(d*40+i*26+9,160); ctx.fill(); }

    ctx.fillStyle=hg; ctx.beginPath(); ctx.moveTo(d*95,-120); ctx.quadraticCurveTo(d*250,-170,d*215,-310); ctx.quadraticCurveTo(d*190,-200,d*40,-150); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.lineWidth=5; for(let i=1;i<4;i++){ ctx.beginPath(); ctx.arc(d*(110+i*28),-150-i*35,26-i*4,0,Math.PI*2); ctx.stroke(); } }

    for(const c of cards){ c.bump=Math.max(0,c.bump-dt*4); c.t+=dt;

      else if(c.st===1){ const k=Math.min(1,c.t/.55), e=k*k*(3-2*k); c.x=c.sx+(c.tx-c.sx)*e; c.y=c.sy+(c.ty-c.sy)*e-Math.sin(k*Math.PI)*120; c.s=1-.75*e;
        if(sparks.length<120) for(let i=0;i<(c.tier==="big"?4:2);i++) sparks.push({x:c.x+(Math.random()-.5)*30,y:c.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.5,c:c.T.c1,r:3+Math.random()*4});
        if(k>=1){ c.st=2; const n=c.T.parts; for(let i=0;i<n&&sparks.length<160;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*(c.tier==="big"?700:380); sparks.push({x:c.tx,y:c.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7+Math.random()*.5,c:Math.random()<.5?c.tc:c.T.c1,r:3+Math.random()*(c.tier==="big"?9:5),gr:500}); }
          rings.push({x:c.tx,y:c.ty,r:10,max:c.tier==="big"?420:c.tier==="mid"?220:110,c:c.tc,life:1});
          pops.push({x:c.tx,y:c.ty-40,text:`+${c.coins} 💰`,c:"#fff",size:c.tier==="big"?72:c.tier==="mid"?56:42,life:1.3}); } } }
    cards=cards.filter(c=>c.st<2);
    for(const p of sparks){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.gr) p.vy+=p.gr*dt; } sparks=sparks.filter(p=>p.life>0);
    for(const r of rings){ r.life-=dt*1.6; r.r+=(r.max-r.r)*Math.min(1,dt*7); } rings=rings.filter(r=>r.life>0);
    for(const p of pops){ p.life-=dt; p.y-=70*dt; } pops=pops.filter(p=>p.life>0); if(pops.length>20) pops.splice(0,pops.length-20);
    flash=Math.max(0,flash-dt*2);
    const active=flash>0||cards.length||sparks.length||rings.length||pops.length;
    if(!active){ if(!MERGED){ if(!idle){ g.clearRect(0,0,1080,1920); idle=true; } requestAnimationFrame(step); } return; } idle=false;
    if(MERGED) g.save(); else { g.setTransform(.75,0,0,.75,0,0); g.clearRect(0,0,1080,1920); }
    if(flash>0){ g.globalAlpha=flash; g.drawImage(flashCv,0,0,1080,1920); g.globalAlpha=1; }
    for(const r of rings){ g.globalAlpha=Math.max(0,r.life); g.strokeStyle=r.c; g.lineWidth=10*r.life+2; g.beginPath(); g.arc(r.x,r.y,r.r,0,Math.PI*2); g.stroke(); } g.globalAlpha=1;
    for(const p of sparks){ g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); g.fillStyle=p.c; g.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } g.globalAlpha=1;
    for(const c of cards) if(c.tier!=="big") drawCard(c);
    for(const c of cards) if(c.tier==="big") drawCard(c); // большие всегда поверх
    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    if(MERGED) g.restore(); else requestAnimationFrame(step);
  }
  if(MERGED) window.__fxStep=step; else requestAnimationFrame(step);
})();
</script>
