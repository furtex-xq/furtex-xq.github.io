<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Трон королевства — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<div id="panel">
  <h3>👑 Пульт ведущего <small style="display:inline">(H — скрыть)</small></h3>
  <div id="status" class="wait">⏳</div>
  <div class="row"><button data-a="small">🌹 1 монета</button><button data-a="combo">🌹×10 комбо</button></div>
  <div class="row"><button data-a="mid">💎 30 монет</button><button data-a="big">🚀 199 монет</button></div>
  <div class="row"><button data-a="kingGift">🛡 подарок короля</button><button data-a="like">❤️ лайки</button></div>
  <button data-a="bots" id="botsBtn">🤖 Демо-боты</button>
  <button data-a="restart">🔄 Новый раунд</button>
  <small>Клавиши: G малый · S средний · M мега · K король укрепляет · L лайки · B боты · R рестарт · H пульт</small>
</div>
<script>
"use strict";
/* ===================== НАСТРОЙКИ (или параметры ссылки, см. README) ===================== */
const CONFIG = {
  wsUrl: "ws://localhost:21213/",
  roundSeconds: 180,
  endSeconds: 10,
  basePower: 10,         // запас прочности нового короля
  coinPower: 1,          // 1 монета = 1 сила (удар по королю или укрепление трона)
  likesPerPower: 50,     // 50 лайков = 1 удар силы 1
  decayPerSec: 0.025,    // трон «ржавеет»: -2.5% силы в секунду
  decayFlat: 0.25,
  safe: {top: 150, right: 110},
};
const Q=new URLSearchParams(location.search);
if(Q.get("ws")) CONFIG.wsUrl=Q.get("ws");
if(Q.get("round")) CONFIG.roundSeconds=Math.max(30,+Q.get("round")||180);
const SRC=(Q.get("src")||"demo").toLowerCase();
const STREAMER=(Q.get("user")||"").replace(/^@/,"").slice(0,30);
const LIKES_ON=Q.get("likes")!=="0";
const JOIN_CMD=(Q.get("join")||"!join").trim().toLowerCase();
// map=giftId:action:power — attack (удар N) · fortify (укрепить N, если ты король; иначе удар) · none
const GIFT_MAP=new Map();
(Q.get("map")||"").split(",").forEach(x=>{const [id,a,p]=x.split(":"); if(id&&a) GIFT_MAP.set(String(id).trim(),{action:a.trim().toLowerCase(),power:+p||0});});
const OBS=Q.get("obs")==="1";
if(OBS||!!window.obsstudio||(Q.has("src")&&Q.get("panel")!=="1")) document.getElementById("panel").style.display="none";

const cv=document.getElementById("game"), ctx=cv.getContext("2d");
const W=1080,H=1920, CX=(W-CONFIG.safe.right)/2+20;
const FONT='"Segoe UI","Arial Black",system-ui,sans-serif';

/* ===================== Состояние ===================== */
let king=null;            // {id,name,avatar,hp,maxHp,since}
let reign=new Map();      // id -> {name,sec,coins,avatar}
let phase="play", phaseT=CONFIG.roundSeconds, round=1, time=0, shake=0, flash=0;
let hits=[], parts=[], floaters=[], feed=[], banner=null, winner=null;
let likeBank=new Map(), crowd=0;
const streaks=new Map(), avatars=new Map();
let botsOn=SRC==="demo"||Q.get("demo")==="1";

function avatarImg(url){ if(!url) return null; if(avatars.has(url)) return avatars.get(url);
  const im=new Image(); im.src=url; avatars.set(url,im); return im; }
function rec(u){ let r=reign.get(u.id); if(!r){r={name:u.name,sec:0,coins:0,avatar:u.avatar};reign.set(u.id,r);} r.name=u.name; if(u.avatar) r.avatar=u.avatar; return r; }

function newRound(){ king=null; reign=new Map(); phase="play"; phaseT=CONFIG.roundSeconds; winner=null; hits=[]; likeBank.clear();
  showBanner("👑 ТРОН СВОБОДЕН","Первый подарок — и ты король!","#ffd23f");
  const q=pending; pending=[]; window.__giftReplay=true; try{ q.forEach(a=>onGift(...a)); }finally{ window.__giftReplay=false; }; }
function endRound(){
  phase="end"; phaseT=CONFIG.endSeconds;
  let best=null; reign.forEach((r,id)=>{ if(!best||r.sec>best.sec) best={...r,id}; });
  winner=best&&best.sec>0?best:null; if(winner) burst(CX,800,"#ffd23f",120);
}

/* ===================== Игровые действия ===================== */
function attack(u,power,label){
  if(phase!=="play"||power<=0) return;
  rec(u).coins+=0;
  if(!king){ crown(u,power+CONFIG.basePower); return; }
  if(king.id===u.id){ fortify(u,power,label); return; }
  hits.push({u,power,label,t:0,x:CX+(Math.random()-.5)*700,dur:.55});
}
function fortify(u,power,label){
  if(!king||king.id!==u.id) return attack(u,power,label);
  king.hp+=power; king.maxHp=Math.max(king.maxHp,king.hp);
  floaters.push({x:CX,y:640,text:`🛡 +${Math.round(power)}`,c:"#7fe0ff",life:1.6});
  addFeed(`🛡 ${king.name} укрепил трон +${Math.round(power)}${label?" ("+label+")":""}`,"#7fe0ff");
}
function landHit(h){
  if(phase!=="play") return;
  if(!king){ crown(h.u,h.power+CONFIG.basePower); return; }
  if(king.id===h.u.id){ fortify(h.u,h.power); return; }
  king.hp-=h.power; shake=Math.min(1,.15+h.power/80); flash=Math.min(1,h.power/60);
  floaters.push({x:CX+(Math.random()-.5)*200,y:700,text:`-${Math.round(h.power)}`,c:"#ff6b6b",life:1.4});
  burst(CX,780,"#ffb347",Math.min(60,8+h.power));
  addFeed(`⚔️ ${h.u.name} бьёт короля -${Math.round(h.power)}${h.label?" ("+h.label+")":""}`,"#ffb3a0");
  if(king.hp<=0) crown(h.u,-king.hp+CONFIG.basePower);
}
function crown(u,hp){
  const old=king;
  king={id:u.id,name:u.name,avatar:u.avatar,hp,maxHp:Math.max(hp,30),since:time};
  rec(u);
  shake=1; flash=1; burst(CX,700,"#ffd23f",90);
  showBanner(old?"⚔️ ПЕРЕВОРОТ!":"👑 НОВЫЙ КОРОЛЬ", old?`${u.name} сверг ${old.name}`:`${u.name} занял трон`,"#ffd23f");
}

/* ===================== События ===================== */
let pending=[]; // подарки во время экрана победителя — сработают в начале нового раунда
function onGift(u,unit,count,name,giftId){
  if(phase!=="play"){ if(pending.length<200) pending.push([u,unit,count,name,giftId]); return; }
  const coins=unit*count; rec(u).coins+=coins;
  const mp=giftId!=null&&GIFT_MAP.get(String(giftId));
  if(mp){ if(mp.action==="none") return; const p=mp.power*count; if(mp.action==="fortify") return fortify(u,p,name); return attack(u,p,name); }
  attack(u,coins*CONFIG.coinPower,`${name}×${count}`);
}
function onLike(u,n){
  if(phase!=="play"||!LIKES_ON) return; crowd=Math.min(1,crowd+n/300);
  const b=(likeBank.get(u.id)||0)+n; const p=Math.floor(b/CONFIG.likesPerPower); likeBank.set(u.id,b%CONFIG.likesPerPower);
  if(p>0 && king){ if(king.id===u.id) fortify(u,p,"лайки"); else attack(u,p,"лайки"); }
  if(Math.random()<.4) parts.push({x:80+Math.random()*(W-300),y:1700,vx:0,vy:-200-Math.random()*150,life:1.5,emo:"❤️",size:34});
}
function onComment(u,text){
  const t=String(text).trim().toLowerCase();
  if(t.startsWith(JOIN_CMD)||t.includes("👑")||t.includes("трон")) { if(Math.random()<.5) parts.push({x:80+Math.random()*(W-300),y:1650,vx:0,vy:-150,life:1.4,emo:"👑",size:30}); }
}
function onFollow(u){ addFeed(`➕ ${u.name} подписался — +5 к удару`,"#bfe"); attack(u,5,"подписка"); }

let ws=null, wsState="wait";
function setStatus(s,t){ wsState=s; const el=document.getElementById("status"); el.className=s; el.textContent=t; }
function connect(){
  try{ ws=new WebSocket(CONFIG.wsUrl);}catch(e){ setStatus("bad","❌ Неверный адрес"); return; }
  setStatus("wait","⏳ Подключение к "+CONFIG.wsUrl);
  ws.onopen=()=>setStatus("ok","🟢 Эфир подключён");
  ws.onmessage=e=>{ try{ handleRaw(JSON.parse(e.data)); }catch(_){} };
  ws.onclose=()=>{ setStatus("bad","🔴 Нет связи — переподключаюсь…"); setTimeout(connect,3000); };
  ws.onerror=()=>{ try{ws.close();}catch(_){} };
}
function handleRaw(msg){
  if(msg.type&&msg.user&&!msg.data){ const u=msg.user, base={uniqueId:u.id,nickname:u.name};
    if(msg.type==="gift") msg={event:"gift",data:{...base,giftId:msg.gift?.id,giftName:msg.gift?.name,diamondCount:msg.gift?.coins,repeatCount:msg.gift?.count,giftType:0}};
    else if(msg.type==="like") msg={event:"like",data:{...base,likeCount:msg.likes}};
    else if(msg.type==="comment") msg={event:"chat",data:{...base,comment:msg.text}};
    else msg={event:msg.type,data:base}; }
  const ev=String(msg.event||msg.type||"").toLowerCase(), d=msg.data||msg, uu=d.user||{};
  const u={id:String(d.uniqueId||d.userId||uu.uniqueId||"anon"), name:String(d.nickname||uu.nickname||d.uniqueId||"Зритель").slice(0,22),
    avatar:d.profilePictureUrl||uu.profilePictureUrl||(uu.avatarThumb&&uu.avatarThumb.urlList&&uu.avatarThumb.urlList[0])||null};
  switch(ev){
    case "chat": case "comment": onComment(u,d.comment||""); break;
    case "like": onLike(u,Math.min(200,+d.likeCount||1)); break;
    case "follow": onFollow(u); break;
    case "gift": {
      const unit=+(d.diamondCount||1), name=String(d.giftName||"подарок").slice(0,20), rc=+(d.repeatCount||1);
      if(+d.giftType===1){ const key=u.id+"|"+(d.giftId||name), prev=streaks.get(key)||0, delta=(prev>0&&rc>=prev)?rc-prev:rc;
        if(d.repeatEnd) streaks.delete(key); else streaks.set(key,rc); if(delta>0) onGift(u,unit,delta,name,d.giftId); }
      else onGift(u,unit,rc,name,d.giftId);
    }
  }
}

/* ===================== Обновление ===================== */
function update(dt){
  phaseT-=dt; crowd=Math.max(0,crowd-dt*.25);
  if(phase==="play"){
    if(king){ king.hp-=(king.hp*CONFIG.decayPerSec+CONFIG.decayFlat)*dt; rec(king).sec+=dt;
      if(king.hp<=0){ showBanner("🪑 ТРОН ПУСТ","Король ослаб и упал. Хватай корону!","#ff9d2e"); king=null; } }
    if(phaseT<=0) endRound();
  } else if(phaseT<=0) newRound();
  for(const h of hits){ h.t+=dt/h.dur; if(h.t>=1&&!h.done){h.done=true; landHit(h);} }
  hits=hits.filter(h=>!h.done);
  shake=Math.max(0,shake-dt*2); flash=Math.max(0,flash-dt*2.5);
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=p.g*dt;} parts=parts.filter(p=>p.life>0); if(parts.length>500) parts.splice(0,parts.length-500);
  floaters.forEach(f=>{f.life-=dt;f.y-=60*dt;}); floaters=floaters.filter(f=>f.life>0); if(floaters.length>25) floaters.splice(0,floaters.length-25);
  feed.forEach(f=>f.life-=dt); feed=feed.filter(f=>f.life>0);
  if(banner){banner.life-=dt; if(banner.life<=0) banner=null;}
  if(botsOn) runBots(dt);
}

/* ===================== Отрисовка ===================== */
function txt(s,x,y,size,c,align="center",w=900,stroke=true){ ctx.font=`${w} ${size}px ${FONT}`; ctx.textAlign=align; ctx.textBaseline="middle";
  if(stroke){ctx.lineWidth=Math.max(4,size/6);ctx.strokeStyle="rgba(0,0,0,.85)";ctx.lineJoin="round";ctx.strokeText(s,x,y);} ctx.fillStyle=c; ctx.fillText(s,x,y); }
function fit(s,x,y,size,maxW,c){ ctx.font=`900 ${size}px ${FONT}`; while(size>14&&ctx.measureText(s).width>maxW){size--;ctx.font=`900 ${size}px ${FONT}`;} txt(s,x,y,size,c); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function avatar(name,url,x,y,r,ring){
  ctx.save(); ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.closePath();
  const im=avatarImg(url);
  if(im&&im.complete&&im.naturalWidth){ ctx.clip(); ctx.drawImage(im,x-r,y-r,r*2,r*2); }
  else { let hsh=0; for(const ch of name) hsh=(hsh*31+ch.charCodeAt(0))|0; ctx.fillStyle=`hsl(${Math.abs(hsh)%360},65%,45%)`; ctx.fill(); ctx.restore(); ctx.save(); txt([...name][0].toUpperCase(),x,y+2,r*1.1,"#fff","center",900,false); }
  ctx.restore(); ctx.lineWidth=r*.12; ctx.strokeStyle=ring; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
}

function draw(){
  ctx.save(); if(shake>0) ctx.translate((Math.random()-.5)*30*shake,(Math.random()-.5)*30*shake);
  // зал
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,"#140a22"); bg.addColorStop(.6,"#2a1238"); bg.addColorStop(1,"#120818"); ctx.fillStyle=bg; ctx.fillRect(-40,-40,W+80,H+80);
  // колонны и знамёна
  for(const x of [90,W-CONFIG.safe.right-90]){ ctx.fillStyle="#2d1d3a"; ctx.fillRect(x-45,400,90,1300); ctx.fillStyle="#3d2a4e"; ctx.fillRect(x-55,390,110,30); ctx.fillRect(x-55,1690,110,30);
    ctx.fillStyle="#8a1e3a"; ctx.beginPath(); ctx.moveTo(x-38,440); ctx.lineTo(x+38,440); ctx.lineTo(x+38,820); ctx.lineTo(x,780); ctx.lineTo(x-38,820); ctx.fill(); txt("👑",x,560,46,"#ffd23f","center",400,false); }
  // ковёр
  ctx.fillStyle="#7a1430"; ctx.beginPath(); ctx.moveTo(CX-110,1080); ctx.lineTo(CX+110,1080); ctx.lineTo(CX+300,1920); ctx.lineTo(CX-300,1920); ctx.fill();
  ctx.strokeStyle="#d9a53a"; ctx.lineWidth=6; ctx.stroke();
  // ступени
  for(let i=0;i<4;i++){ ctx.fillStyle=i%2?"#4a3560":"#5a4372"; ctx.fillRect(CX-260+i*25,1000+i*-0+i*28,520-i*50,28); }
  // трон
  const ty=560;
  ctx.fillStyle="#b8862b"; rr(CX-210,ty,420,470,40); ctx.fill();
  ctx.fillStyle="#7a1430"; rr(CX-160,ty+50,320,330,30); ctx.fill();
  ctx.fillStyle="#d9a53a"; for(const dx of [-210,170]) { rr(CX+dx,ty-60,40,520,14); ctx.fill(); txt("◆",CX+dx+20,ty-70,46,"#ffe27a","center",900,false); }
  ctx.fillStyle="#9c6e22"; rr(CX-240,ty+360,480,90,20); ctx.fill();
  // король
  if(king){
    const bob=Math.sin(time*2)*6;
    avatar(king.name,king.avatar,CX,ty+200+bob,120,"#ffd23f");
    txt("👑",CX,ty+40+bob,110,"#fff","center",400,false);
    fit(king.name,CX,ty+410,58,460,"#fff");
    // сила трона
    const k=Math.max(0,Math.min(1,king.hp/king.maxHp)); const bx=CX-320,by=1010;
    ctx.fillStyle="rgba(0,0,0,.6)"; rr(bx,by,640,44,22); ctx.fill();
    ctx.fillStyle=k<.25?"#ff4a4a":k<.5?"#ffb02e":"#5fe07a"; rr(bx+4,by+4,Math.max(0,632*k),36,18); ctx.fill();
    txt(`🛡 ${Math.ceil(Math.max(0,king.hp))}  ·  ⏳ ${fmt(time-king.since)}`,CX,by+23,30,"#fff");
  } else {
    txt("🪑",CX,ty+200,160,"#fff","center",400,false);
    fit("ТРОН СВОБОДЕН",CX,ty+410,58,460,"#ffd23f");
    txt("любой подарок = корона",CX,1032,36,"#fff");
  }
  if(flash>0){ ctx.fillStyle=`rgba(255,255,255,${flash*.35})`; ctx.fillRect(0,0,W,H); }
  // удары
  for(const h of hits){ const sx=h.x, sy=1750, ex=CX, ey=780, k=h.t; const x=sx+(ex-sx)*k, y=sy+(ey-sy)*k-Math.sin(k*Math.PI)*200;
    const big=h.power>=100; txt(big?"☄️":h.power>=10?"🗡️":"🏹",x,y,big?110:h.power>=10?70:50,"#fff","center",400,false);
    if(h.power>=10) fit(h.u.name,x,y+60,28,300,"#ffd8b0"); }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life)); if(p.emo) txt(p.emo,p.x,p.y,p.size,"#fff","center",400,false); else {ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.size,p.size);} } ctx.globalAlpha=1;
  for(const f of floaters){ ctx.globalAlpha=Math.min(1,f.life); txt(f.text,f.x,f.y,56,f.c); } ctx.globalAlpha=1;
  ctx.restore();
  drawHud();
}
function drawHud(){
  const top=CONFIG.safe.top;
  if(STREAMER) txt("@"+STREAMER,40,top-30,24,"rgba(255,255,255,.6)","left",700,false);
  if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",W-CONFIG.safe.right-60,top-30,22,"#f88","center",700);
  txt("👑 ТРОН КОРОЛЕВСТВА",CX,top+40,66,"#ffd23f");
  txt(phase==="play"?`Раунд ${round} · ⏱ ${fmt(phaseT)}`:`Раунд ${round} окончен`,CX,top+102,34,"#fff");
  ctx.fillStyle="rgba(0,0,0,.45)"; rr(40,top+140,W-80-CONFIG.safe.right+40,64,18); ctx.fill();
  txt(`🎁 1 монета = 1 удар по королю · король дарит = трон крепче`,CX,top+172,26,"#ffd98a","center",800);
  // топ правления
  const top3=[...reign.entries()].map(([id,r])=>({id,...r})).filter(r=>r.sec>0.5).sort((a,b)=>b.sec-a.sec).slice(0,3);
  let y=top+250; txt("⏳ Дольше всех на троне",CX,y,30,"#fff","center",800); y+=48;
  top3.forEach((r,i)=>{ const x0=CX-300; avatar(r.name,r.avatar,x0+30,y,22,["#ffd23f","#c0c8d8","#d9904a"][i]); ctx.font=`800 30px ${FONT}`;
    txt(`${["🥇","🥈","🥉"][i]} ${r.name.length>16?r.name.slice(0,15)+"…":r.name}`,x0+66,y,30,"#fff","left",800); txt(fmt(r.sec),CX+300,y,30,"#ffd23f","right",800); y+=50; });
  // лента
  feed.forEach((f,i)=>{ ctx.globalAlpha=Math.min(1,f.life); fit(f.text,CX,1082+i*34,26,W-240,f.c); }); ctx.globalAlpha=1;
  if(banner&&phase==="play"){ const a=Math.min(1,banner.life*2), s=1+Math.max(0,banner.life-2.4)*1.2; ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,560); ctx.scale(s,s);
    ctx.fillStyle="rgba(0,0,0,.7)"; rr(-440,-85,880,170,30); ctx.fill(); fit(banner.title,0,-28,68,840,banner.c); fit(banner.sub,0,42,36,840,"#fff"); ctx.restore(); }
  if(phase==="end") drawWinner();
}
function drawWinner(){
  ctx.fillStyle="rgba(0,0,0,.78)"; ctx.fillRect(0,0,W,H);
  if(!winner){ txt("Никто не сел на трон 🪑",CX,900,60,"#ffd23f"); txt(`Новый раунд через ${Math.ceil(phaseT)}…`,CX,1000,36,"#ccc"); return; }
  txt("👑 КОРОЛЬ РАУНДА 👑",CX,520,72,"#ffd23f");
  avatar(winner.name,winner.avatar,CX,800,170,"#ffd23f"); txt("👑",CX,590,120,"#fff","center",400,false);
  fit(winner.name,CX,1050,90,860,"#fff");
  txt(`правил ${fmt(winner.sec)} · подарил ${winner.coins} 💰`,CX,1140,38,"#ffe6b0");
  txt(`Новый раунд через ${Math.ceil(phaseT)}…`,CX,1300,36,"#ccc");
}
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function showBanner(title,sub,c){ banner={title,sub,c,life:2.8}; }
function addFeed(text,c){ feed.unshift({text,c,life:6}); if(feed.length>2) feed.pop(); }
function burst(x,y,c,n){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=150+Math.random()*500; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-200,life:.8+Math.random()*.6,c,size:5+Math.random()*8,g:900});} }

/* ===================== Боты и пульт ===================== */
const BOTN=["Саня_228","katya.love","Мурат","DimonPro","Олежка","айгерим","Vlad_TT","Настя","Бека","Lena_K","Тимур","Ярик","ZhanaR","Макс","Polina","Арман"];
const bots=BOTN.map((n,i)=>({id:"bot"+i,name:n,act:Math.random()*3,rich:i%5===0}));
function runBots(dt){ for(const b of bots){ b.act-=dt; if(b.act>0) continue; b.act=.8+Math.random()*3; const u={id:b.id,name:b.name}; const r=Math.random();
  if(r<.6) onLike(u,10+Math.floor(Math.random()*30)); else if(r<.9) onGift(u,1,1+Math.floor(Math.random()*5),"Роза");
  else if(r<.98) onGift(u,b.rich?30:5,1,b.rich?"Кристалл":"Пончик"); else onGift(u,199,1,"Ракета"); } }
let tN=0; const tU=()=>({id:"t"+(tN++%6),name:"Тест-"+((tN-1)%6+1)});
function act(a){ switch(a){
  case "small": onGift(tU(),1,1,"Роза"); break; case "mid": onGift(tU(),30,1,"Кристалл"); break; case "big": onGift(tU(),199,1,"Ракета"); break;
  case "combo": { const u=tU(); for(let i=1;i<=10;i++) setTimeout(()=>handleRaw({event:"gift",data:{uniqueId:u.id,nickname:u.name,giftType:1,giftId:5655,giftName:"Роза",diamondCount:1,repeatCount:i,repeatEnd:i===10}}),i*120); break; }
  case "kingGift": if(king) onGift({id:king.id,name:king.name,avatar:king.avatar},10,1,"Подарок"); break;
  case "like": onLike(tU(),60); break; case "bots": botsOn=!botsOn; break; case "restart": newRound(); break; }
  document.getElementById("botsBtn").textContent="🤖 Демо-боты: "+(botsOn?"вкл":"выкл"); }
document.getElementById("panel").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) act(b.dataset.a);});
addEventListener("keydown",e=>{ const k=e.key.toLowerCase(); const m={g:"small",п:"small",s:"mid",ы:"mid",m:"big",ь:"big",k:"kingGift",л:"kingGift",l:"like",д:"like",b:"bots",и:"bots",r:"restart",к:"restart"};
  if(m[k]) act(m[k]); else if(k==="h"||k==="р"){ const p=document.getElementById("panel"); p.style.display=p.style.display==="none"?"":"none"; } });

function resize(){ const s=Math.min(innerWidth/W,innerHeight/H); cv.style.width=W*s+"px"; cv.style.height=H*s+"px"; }
addEventListener("resize",resize); resize();
newRound(); if(SRC==="demo") setStatus("wait","🤖 Демо-режим (без эфира)"); else connect(); act("noop");
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; update(dt); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
window.__game={get king(){return king},get phase(){return phase},handleRaw,act};
window.addEventListener("message",e=>{ if(e.data&&e.data.source==="magma-launcher"&&e.data.event){ try{ handleRaw(e.data.event); }catch(_){} } }); // GAME-CONTRACT §6
</script>
<script id="giftfx">
"use strict";
window.GIFT_FX_TARGET=id=>({x:CX,y:760,color:"#ffd23f"});
/* ===================== ЭФФЕКТ ПОДАРКА: видно, кто подарил, что и куда это пошло ===================== */
(function(){
  const base=document.getElementById("game"); if(!base) return;
  let g;
  const fx=document.createElement("canvas"); fx.width=810; fx.height=1440; // 0.75 разрешения: в 4/3 дешевле, на стриме 720p разницы не видно fx.id="giftfx";
  fx.style.cssText="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:3";
  document.body.appendChild(fx); g=fx.getContext("2d");
  const F='"Segoe UI","Arial Black",system-ui,sans-serif';
  const TIERS={ small:{c1:"#ff7eb3",c2:"#ff4f8b",hold:.55,scale:1,emo:"🌹",parts:14},
                mid:{c1:"#7fd8ff",c2:"#3b7bff",hold:.95,scale:1.1,emo:"💎",parts:40},
                big:{c1:"#ffe27a",c2:"#ff8a00",hold:1.7,scale:1.7,emo:"🚀",parts:110} };
  const tierOf=u=>u>=100?"big":u>=10?"mid":"small";
  let cards=[], sparks=[], rings=[], pops=[], flash=0, last=performance.now();
  const imgs=new Map(), rate=[];
  function img(url){ if(!url) return null; if(imgs.has(url)) return imgs.get(url); const im=new Image(); im.src=url; imgs.set(url,im); return im; }
  function target(uid){ try{ const t=window.GIFT_FX_TARGET&&window.GIFT_FX_TARGET(uid); if(t) return t; }catch(e){} return {x:540,y:330,color:"#ffd23f"}; }
  function add(u,unit,count,name,pic){
    const tier=tierOf(unit), coins=unit*count, key=u.id+"|"+name, now=performance.now();
    // комбо: тот же зритель и тот же подарок подряд — одна карточка, счётчик ×N растёт
    const ex=cards.find(c=>c.key===key&&c.st<2&&now-c.born<2500);
    if(ex){ ex.count+=count; ex.coins+=coins; ex.bump=1; ex.dirty=true; ex.t=Math.min(ex.t,.3); return; }
    const T=TIERS[tier]; const lane=cards.filter(c=>c.st<2&&c.tier!=="big").length;
    rate.push(now); while(rate.length&&now-rate[0]>1000) rate.shift();
    if(tier!=="big"&&(lane>=(tier==="small"?3:4)||rate.length>10)){ // поток: без карточек, только вспышка и +X // поток мелких подарков: без карточки, сразу вспышка и «+X» у своей команды
      const tg=target(u.id); rings.push({x:tg.x,y:tg.y,r:10,max:tier==="mid"?160:90,c:tg.color||T.c1,life:1}); pops.push({x:tg.x+(Math.random()-.5)*60,y:tg.y-40,text:`+${coins} 💰`,c:"#fff",size:38,life:1.1}); return; }
    const big=tier==="big";
    if(big&&cards.filter(c=>c.tier==="big"&&c.st<2).length>=2){ const tg=target(u.id); rings.push({x:tg.x,y:tg.y,r:10,max:300,c:tg.color||T.c1,life:1}); pops.push({x:tg.x,y:tg.y-40,text:`+${coins} 💰`,c:"#ffe27a",size:64,life:1.3}); flash=Math.max(flash,.6); return; }
    // свободный слот (2×2 сетка), чтобы карточки не лезли друг на друга; большая — отдельно сверху
    const used=new Set(cards.filter(c=>c.st===0&&c.slot!=null).map(c=>c.slot)); let slot=0; while(used.has(slot)&&slot<3) slot++;
    const bigUsed=cards.some(c=>c.st===0&&c.tier==="big");
    cards.push({key,u,name,pic,tier,T,count,coins,born:now,st:0,t:0,bump:0,slot:big?null:slot,
      x:big?520:265+((slot%2)*470), y:big?(bigUsed?1060:880):680+Math.floor(slot/2)*130, s:0});
    if(cards.length>10) cards.splice(0,cards.length-10);
    if(big) flash=1;
  }
  // перехватываем события, не меняя логику игры: картинки/аватары — из сырых событий, сам подарок — из onGift игры
  const pics=new Map(), avs=new Map();
  if(typeof window.handleRaw==="function"){ const oh=window.handleRaw; window.handleRaw=function(msg){
    try{ const d=(msg&&msg.data)||{}, uu=d.user||{}; const id=String(d.uniqueId||d.userId||uu.uniqueId||"");
      if(id){ const av=d.profilePictureUrl||uu.profilePictureUrl; if(av) avs.set(id,av); const pic=d.giftPictureUrl||(d.giftDetails&&d.giftDetails.giftImage&&d.giftDetails.giftImage.giftPictureUrl); if(pic) pics.set(id+"|"+String(d.giftName||"").slice(0,16),pic); } }catch(e){}
    return oh.apply(this,arguments); }; }
  if(typeof window.onGift!=="function") return;
  const og=window.onGift; window.onGift=function(u,unit,count,name){
    const r=og.apply(this,arguments);
    if(window.__giftReplay) return r; // повтор подарков с экрана победы — карточка уже была
    try{ const nm=String(name||"подарок").slice(0,16), id=String(u&&u.id||"anon"), n=Math.max(1,+count||1);
      add({id,name:String(u&&u.name||"Зритель").slice(0,20),avatar:(u&&u.avatar)||avs.get(id)||null},Math.max(1,+unit||1),n,nm,pics.get(id+"|"+nm)||null); }catch(e){}
    return r; };
  function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
  function text(s,x,y,size,c,al="center",w=900){ g.font=`${w} ${size}px ${F}`; g.textAlign=al; g.textBaseline="middle"; g.lineWidth=Math.max(4,size/6); g.strokeStyle="rgba(0,0,0,.85)"; g.lineJoin="round"; g.strokeText(s,x,y); g.fillStyle=c; g.fillText(s,x,y); }
  function fitW(s,size,maxW){ g.font=`900 ${size}px ${F}`; while(size>12&&g.measureText(s).width>maxW){ size--; g.font=`900 ${size}px ${F}`; } return size; }
  // карточка рисуется один раз в отдельный холст (и заново только при комбо или когда загрузилась картинка)
  const CW=420, CH=110, PAD=40;
  function ready(im){ return !!(im&&im.complete&&im.naturalWidth); }
  function renderCard(c){
    const T=c.T, cv=c.cv||(c.cv=document.createElement("canvas")); cv.width=CW+PAD*2; cv.height=CH+PAD*2; const q=cv.getContext("2d");
    const G=g; g=q; g.save(); g.translate(PAD+CW/2,PAD+CH/2);
    if(c.tier!=="small"){ g.shadowColor=T.c1; g.shadowBlur=c.tier==="big"?36:22; }
    const gr=g.createLinearGradient(-CW/2,0,CW/2,0); gr.addColorStop(0,T.c2); gr.addColorStop(1,T.c1);
    g.fillStyle=gr; rr(-CW/2,-CH/2,CW,CH,CH/2); g.fill(); g.shadowBlur=0;
    g.lineWidth=5; g.strokeStyle="rgba(255,255,255,.9)"; rr(-CW/2,-CH/2,CW,CH,CH/2); g.stroke();
    const ax=-CW/2+CH/2, R=42, av=img(c.u.avatar); g.save(); g.beginPath(); g.arc(ax,0,R,0,Math.PI*2); g.clip();
    if(ready(av)) g.drawImage(av,ax-R,-R,R*2,R*2); else { let hh=0; for(const ch of c.u.name) hh=(hh*31+ch.charCodeAt(0))|0; g.fillStyle=`hsl(${Math.abs(hh)%360},60%,42%)`; g.fillRect(ax-R,-R,R*2,R*2); text(([...c.u.name][0]||"?").toUpperCase(),ax,3,44,"#fff"); }
    g.restore(); g.lineWidth=5; g.strokeStyle="#fff"; g.beginPath(); g.arc(ax,0,R,0,Math.PI*2); g.stroke();
    const nx=ax+R+12, tw=CW-CH-100;
    text(c.u.name,nx,-21,fitW(c.u.name,34,tw),"#fff","left");
    const gl=c.name+(c.count>1?` ×${c.count}`:""); text(gl,nx,22,fitW(gl,28,tw),"#fff","left",800);
    const gx=CW/2-54, pic=img(c.pic);
    if(ready(pic)) g.drawImage(pic,gx-42,-42,84,84); else { g.font=`400 64px ${F}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(T.emo,gx,3); }
    if(c.count>1) text("×"+c.count,CW/2-6,-CH/2+6,40,"#ffe600");
    g.restore(); g=G;
    c.dirty=false; c.imgsOk=ready(av)||!c.u.avatar; c.picOk=ready(pic)||!c.pic;
  }
  const flashCv=document.createElement("canvas"); flashCv.width=270; flashCv.height=480;
  { const fg=flashCv.getContext("2d"), gr=fg.createRadialGradient(135,190,12,135,190,225); gr.addColorStop(0,"rgba(255,220,120,.45)"); gr.addColorStop(1,"rgba(255,140,0,0)"); fg.fillStyle=gr; fg.fillRect(0,0,270,480); }
  // «+X» рисуем один раз в маленький холст, дальше только drawImage
  function popCv(p){ const tmp=g, c=document.createElement("canvas"); g=c.getContext("2d"); g.font=`900 ${p.size}px ${F}`; const w=Math.ceil(g.measureText(p.text).width)+p.size; c.width=w; c.height=Math.ceil(p.size*1.6); g=c.getContext("2d"); text(p.text,w/2,c.height/2,p.size,p.c); g=tmp; p.cv=c; }
  let idle=false, lastW="";
  function drawCard(c){
    if(!c.cv||c.dirty||(!c.imgsOk&&ready(img(c.u.avatar)))||(!c.picOk&&ready(img(c.pic)))) renderCard(c);
    const sc=c.s*(1+c.bump*.12)*c.T.scale; if(sc<=0) return;
    g.save(); g.translate(c.x,c.y); g.scale(sc,sc); g.drawImage(c.cv,-(CW/2+PAD),-(CH/2+PAD)); g.restore();
  }
  function step(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    if(base.style.width!==lastW){ lastW=base.style.width; fx.style.width=base.style.width; fx.style.height=base.style.height; }
    for(const c of cards){ c.bump=Math.max(0,c.bump-dt*4); c.t+=dt;
      if(c.st===0){ c.s=Math.min(1,c.t/.18)*(1+Math.sin(Math.min(1,c.t/.3)*Math.PI)*.18); if(c.t>=c.T.hold+.2){ c.st=1; c.t=0; const tg=target(c.u.id); c.tx=tg.x; c.ty=tg.y; c.tc=tg.color||c.T.c1; c.sx=c.x; c.sy=c.y; } }
      else if(c.st===1){ const k=Math.min(1,c.t/.55), e=k*k*(3-2*k); c.x=c.sx+(c.tx-c.sx)*e; c.y=c.sy+(c.ty-c.sy)*e-Math.sin(k*Math.PI)*120; c.s=1-.75*e;
        if(sparks.length<120) for(let i=0;i<(c.tier==="big"?4:2);i++) sparks.push({x:c.x+(Math.random()-.5)*30,y:c.y+(Math.random()-.5)*30,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,life:.5,c:c.T.c1,r:3+Math.random()*4});
        if(k>=1){ c.st=2; const n=c.T.parts; for(let i=0;i<n&&sparks.length<160;i++){ const a=Math.random()*Math.PI*2, sp=120+Math.random()*(c.tier==="big"?700:380); sparks.push({x:c.tx,y:c.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.7+Math.random()*.5,c:Math.random()<.5?c.tc:c.T.c1,r:3+Math.random()*(c.tier==="big"?9:5),gr:500}); }
          rings.push({x:c.tx,y:c.ty,r:10,max:c.tier==="big"?420:c.tier==="mid"?220:110,c:c.tc,life:1});
          pops.push({x:c.tx,y:c.ty-40,text:`+${c.coins} 💰`,c:"#fff",size:c.tier==="big"?72:c.tier==="mid"?56:42,life:1.3}); } } }
    cards=cards.filter(c=>c.st<2);
    for(const p of sparks){ p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.gr) p.vy+=p.gr*dt; } sparks=sparks.filter(p=>p.life>0);
    for(const r of rings){ r.life-=dt*1.6; r.r+=(r.max-r.r)*Math.min(1,dt*7); } rings=rings.filter(r=>r.life>0);
    for(const p of pops){ p.life-=dt; p.y-=70*dt; } pops=pops.filter(p=>p.life>0); if(pops.length>20) pops.splice(0,pops.length-20);
    flash=Math.max(0,flash-dt*2);
    const active=flash>0||cards.length||sparks.length||rings.length||pops.length;
    if(!active){ if(!idle){ g.clearRect(0,0,1080,1920); idle=true; } requestAnimationFrame(step); return; } idle=false;
    g.setTransform(.75,0,0,.75,0,0); g.clearRect(0,0,1080,1920);
    if(flash>0){ g.globalAlpha=flash; g.drawImage(flashCv,0,0,1080,1920); g.globalAlpha=1; }
    for(const r of rings){ g.globalAlpha=Math.max(0,r.life); g.strokeStyle=r.c; g.lineWidth=10*r.life+2; g.beginPath(); g.arc(r.x,r.y,r.r,0,Math.PI*2); g.stroke(); } g.globalAlpha=1;
    for(const p of sparks){ g.globalAlpha=Math.max(0,Math.min(1,p.life*1.5)); g.fillStyle=p.c; g.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); } g.globalAlpha=1;
    for(const c of cards) if(c.tier!=="big") drawCard(c);
    for(const c of cards) if(c.tier==="big") drawCard(c); // большие всегда поверх
    for(const p of pops){ g.globalAlpha=Math.min(1,p.life*1.5); const s=1+Math.max(0,p.life-1)*1.5; if(!p.cv) popCv(p); const w=p.cv.width*s, h=p.cv.height*s; g.drawImage(p.cv,p.x-w/2,p.y-h/2,w,h); } g.globalAlpha=1;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
