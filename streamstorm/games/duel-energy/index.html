<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Энергошар — TikTok LIVE игра</title>
<style>
  html,body{margin:0;height:100%;background:#07050c;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif}
  #game{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
  #panel{position:fixed;right:8px;top:8px;width:250px;background:rgba(18,14,26,.94);color:#eee;font-size:13px;padding:10px;border-radius:12px;z-index:5;box-shadow:0 6px 24px #0008;max-height:96vh;overflow:auto}
  #panel h3{margin:0 0 6px;font-size:15px}
  #panel button{margin:2px 0;width:100%;padding:7px 6px;border:0;border-radius:8px;background:#2e2640;color:#fff;font-size:13px;cursor:pointer;text-align:left}
  #panel button:hover{background:#463a62}
  #panel .row{display:flex;gap:4px}#panel .row button{flex:1;text-align:center}
  #status{padding:6px 8px;border-radius:8px;margin:4px 0 8px;font-weight:600}
  .ok{background:#164a2a}.bad{background:#5a1a1a}.wait{background:#4a3c12}
  #panel small{color:#aaa;display:block;margin-top:6px;line-height:1.35}
</style>
<script id="sspro" data-game="duel-energy">
/* ===================== StreamStorm PRO: гибкие настройки + премиальный стиль текста =====================
   1) Настройки. Любой ключ CONFIG можно поменять:
      ?c.roundSeconds=60&c.gifts.smallMax=4   (точка = вложенный ключ)
      ?cfg=<base64url JSON {"roundSeconds":60}>
      ?power=2      сила подарков (монеты ×2; 0.25–10)
      ?title=Текст  своё название игры в шапке;  ?accent=%23F5C542  цвет акцента
      Лаунчер: игра шлёт parent.postMessage({type:"ss-schema",game,title,schema}); живые правки
      {type:"ss-set",values:{"roundSeconds":60}}, каталог подарков {type:"ss-gifts",list:[{name,coins,img}]}.
   2) Стиль: шрифт Inter / SF / Segoe Variable, мягкая обводка, тёмно-синие стеклянные подложки вместо чёрных. */
(function(){
  "use strict";
  const Q=new URLSearchParams(location.search);
  // пока игра не получила свой масштаб — не показываем её (иначе первые кадры видно огромный заголовок)
  try{ const st=document.createElement("style"); st.textContent='#game:not([style*="width"]),#stage:not([style*="transform"]),#stagebg:not([style*="transform"]){visibility:hidden} html,body{background:#0A1428}'; document.head.appendChild(st); }catch(e){}

  // непрозрачные холсты (игра и рамка сцены): браузеру не нужно смешивать их с фоном страницы — дешевле на 120/144 Гц
  try{ const gc=HTMLCanvasElement.prototype.getContext; HTMLCanvasElement.prototype.getContext=function(t,o){ if(t==="2d"&&(this.id==="game"||this.id==="stagebg")) o=Object.assign({alpha:false},o||{}); return gc.call(this,t,o); }; }catch(e){}

  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const SKIP={wsUrl:1,safe:1};
  const num=(v,d)=>{ const n=parseFloat(v); return isFinite(n)?n:d; };
  // ---------- значения из ссылки
  const SET={};
  try{ const c=Q.get("cfg"); if(c){ const j=JSON.parse(decodeURIComponent(escape(atob(c.replace(/-/g,"+").replace(/_/g,"/"))))); if(j&&typeof j==="object") Object.assign(SET,flat(j)); } }catch(e){}
  for(const [k,v] of Q) if(k.startsWith("c.")&&k.length>2) SET[k.slice(2)]=v;
  function flat(o,p="",r={}){ for(const k in o){ const v=o[k], kk=p?p+"."+k:k; if(v&&typeof v==="object"&&!Array.isArray(v)) flat(v,kk,r); else r[kk]=v; } return r; }
  function coerce(old,v){ if(typeof old==="number") return num(v,old); if(typeof old==="boolean") return v===true||v==="1"||v==="true";
    if(Array.isArray(old)){ if(Array.isArray(v)) return v; const a=String(v).split(",").map(s=>s.trim()).filter(Boolean); return old.length&&typeof old[0]==="number"?a.map(x=>num(x,0)):a; }
    if(typeof old==="string") return String(v).slice(0,200); return v; }
  function setPath(C,path,v){ const ks=path.split("."); let o=C; for(let i=0;i<ks.length-1;i++){ if(!o||typeof o[ks[i]]!=="object") return false; o=o[ks[i]]; }
    const last=ks[ks.length-1]; if(!o||!(last in o)||SKIP[ks[0]]) return false; const old=o[last]; if(old&&typeof old==="object"&&!Array.isArray(old)) return false; o[last]=coerce(old,v); return true; }
  // ---------- схема для лаунчера: ключи CONFIG + подписи из комментариев исходника
  function schema(C,src){ const lab={}; if(src){ const m=src.match(/const CONFIG\s*=\s*\{[\s\S]*?\n\};/); if(m) for(const line of m[0].split("\n")){ const r=line.match(/^\s*(\w+)\s*:[^\/]*\/\/\s*(.+)$/); if(r) lab[r[1]]=r[2].trim().slice(0,120); } }
    const out=[]; (function walk(o,p){ for(const k in o){ if(!p&&SKIP[k]) continue; const v=o[k], kk=p?p+"."+k:k;
      if(v&&typeof v==="object"&&!Array.isArray(v)){ walk(v,kk); continue; }
      const t=Array.isArray(v)?(v.every(x=>typeof x!=="object")?"list":null):typeof v; if(!t||t==="function") continue;
      out.push({k:kk,type:t,v,label:lab[k]||LBL[kk]||LBL[k]||""}); } })(C,"");
    return out; }
  // подписи по умолчанию (если у ключа в CONFIG нет комментария)
  const LBL={endSeconds:"Экран победителя, сек",matchEndSeconds:"Экран победителя матча, сек",roundSeconds:"Длина раунда, сек",lobbySeconds:"Сбор перед раундом, сек",
    a:"Команда слева (код страны или цвета)",b:"Команда справа (код страны или цвета)",teams:"Команды (коды через запятую)",
    "vsTheme.from":"Фон дуэли: верхний цвет","vsTheme.to":"Фон дуэли: нижний цвет","vsTheme.edge":"Фон дуэли: цвет кромки","vsTheme.icon":"Значок дуэли (эмодзи)",
    burnerMult:"Горелка: множитель подъёма",stormLoss:"Шторм: потеря высоты",maxPerEvent:"Максимум за один подарок",maxPerSecond:"Максимум в секунду",
    maxPlayers:"Максимум бойцов",baseHP:"HP на старте",maxHP:"Максимум HP",hpGrowth:"Рост HP босса за раунд",stunSeconds:"Оглушение, сек",healShare:"Доля лечения",
    friction:"Трение мяча",distance:"Длина трассы",turboSeconds:"Турбо, сек",chargeMult:"Заряд: множитель",debateLen:"Длина дебатов, сек",debateBonus:"Бонус дебатов",
    blizzardMult:"Метель: множитель",contractIncome:"Доход контракта",tariffFactor:"Сила пошлины",housePerWave:"Домик: +HP за волну",fuelDrain:"Расход бензина в секунду",
    nitroMult:"Нитро: множитель",rocketMult:"Турбо-реактор: множитель",rageMult:"Ярость: множитель",spurMult:"Шпоры: множитель",shoeMult:"Золотая подкова: множитель",
    windGain:"Второе дыхание: прибавка",lives:"Жизни",likesPerPower:"Лайков на 1 очко силы",maxHeight:"Максимальная высота, м",followLift:"Подписка: подъём, м",
    shareLift:"Репост: подъём, м",joinLift:"Вход в команду: подъём, м","gifts.smallLiftPerCoin":"Мелкий подарок: подъём за монету, м","gifts.shieldSeconds":"Щит, сек",
    "gifts.freezeSeconds":"Заморозка лавы, сек",cols:"Колонок на карте",rows:"Рядов на карте",likesPerArmy:"Лайков на 1 армию",fortifyAmount:"Укрепление: сила",
    decayFlat:"Трон слабеет в секунду",likesPerCoin:"Лайков = 1 монета",likesPerStep:"Лайков на 1 шаг",anchorMax:"Якорь: максимум, сек",likesPerDamage:"Лайков на 1 урон",
    pauseSeconds:"Пауза между раундами, сек",hearts:"Сердца на старте",speed:"Скорость",energyPerCoin:"Энергия за монету",waveEvery:"Новая волна каждые, сек",houseHP:"HP домика",
    "giftWindow.mode":"Окно подарков: right = справа внизу, over = поверх игры, off = выкл","giftWindow.size":"Окно подарков: размер, % (60–160)",
    "giftWindow.x":"Окно подарков: сдвиг вправо (+) / влево (−), px","giftWindow.y":"Окно подарков: сдвиг вниз (+) / вверх (−), px","giftWindow.opacity":"Окно подарков: плотность фона, %",
    winsNeeded:"Побед до победы в матче",track:"Длина каната, шагов",coinPull:"Шагов за монету",drift:"Канат к центру, шаг/сек",anchorSeconds:"Якорь, сек"};
  let CFG=null;
  window.SS_APPLY=function(C){ CFG=C; window.SS_CFG=C; let src="";
    // окно подарков (giftfx): общие для всех игр настройки, видны в лаунчере как параметры игры
    try{ if(!C.giftWindow){ const qn=(k,d)=>num(Q.get(k),d); C.giftWindow={mode:(Q.get("gw")||"right").toLowerCase().slice(0,10),size:qn("gws",100),x:qn("gwx",0),y:qn("gwy",0),opacity:qn("gwo",88)}; } }catch(e){} try{ src=document.currentScript?document.currentScript.textContent:""; }catch(e){}
    const def=JSON.parse(JSON.stringify(C,(k,v)=>typeof v==="function"?undefined:v));
    for(const k in SET) setPath(C,k,SET[k]);
    const sc=schema(def,src); window.SS_SCHEMA=sc;
    const send=()=>{ try{ if(parent&&parent!==window) parent.postMessage({type:"ss-schema",game:GAME,title:document.title.split(" — ")[0],schema:sc,current:flat(JSON.parse(JSON.stringify(C)))},"*"); }catch(e){} };
    send(); addEventListener("load",send); };
  addEventListener("message",e=>{ const d=e.data; if(!d||typeof d!=="object") return;
    if(d.type==="ss-set"&&CFG&&d.values&&typeof d.values==="object"){ for(const k in d.values) setPath(CFG,k,d.values[k]); }
    if(d.type==="ss-gifts"&&Array.isArray(d.list)){ const put=()=>{ const G=window.SSGifts; if(!G) return setTimeout(put,300); d.list.slice(0,300).forEach(x=>{ try{ G.put(x.name,x.coins,x.img||x.image||x.giftPictureUrl); }catch(_){} }); }; put(); } });
  // ---------- сила подарков (power= или diff=easy|normal|hard), подарки по имени в map=, likerate=
  const DIFF={easy:1.5,normal:1,hard:.7}[(Q.get("diff")||"").toLowerCase()]||1;
  const POWER=Math.max(.25,Math.min(10,num(Q.get("power"),1)*DIFF)), LR=Math.max(1,Math.min(500,num(Q.get("likerate"),0)))||0;
  window.SS_POWER=POWER;
  addEventListener("DOMContentLoaded",()=>{
    if(typeof window.onGift==="function"){ const og=window.onGift;   // map по имени подарка (повтор безопасен)
      window.onGift=function(u,unit,count,name,giftId,...r){
        try{ if(typeof GIFT_MAP!=="undefined"&&name){ const nk=String(name).toLowerCase(); if(!(giftId!=null&&GIFT_MAP.has(String(giftId)))&&GIFT_MAP.has(nk)) giftId=nk; } }catch(e){}
        return og.call(this,u,unit,count,name,giftId,...r); }; }
    // сила подарков — один раз, на входе события (перенос подарков между раундами не умножается повторно); дробный остаток копится у зрителя
    if(POWER!==1&&typeof window.handleRaw==="function"){ const oh=window.handleRaw, rem=new Map(), stk=new Map();
      window.handleRaw=function(msg){ try{
        const L=msg&&msg.type==="gift"&&msg.gift, ev=!L&&msg&&String(msg.event||msg.type||"").toLowerCase()==="gift", d=L?msg.gift:ev?(msg.data||msg):null;
        if(d){ const uid=String((msg.user&&msg.user.id)||d.uniqueId||d.userId||(d.user&&d.user.uniqueId)||"anon"), unit=Math.max(1,+(L?d.coins:d.diamondCount)||1);
          let n=Math.max(1,+(L?d.count:d.repeatCount)||1);
          if(!L&&+d.giftType===1){ const k=uid+"|"+(d.giftId||d.giftName), prev=stk.get(k)||0; n=(prev>0&&n>=prev)?n-prev:n; if(d.repeatEnd) stk.delete(k); else stk.set(k,+d.repeatCount||1); if(n<=0) return; }
          // монеты комбо целиком × сила + остаток зрителя; цена штуки ≈ цена×сила, чтобы ярус подарка не прыгал
          const T=unit*n*POWER+(rem.get(uid)||0), nu=Math.max(1,Math.floor(unit*POWER+1e-9)), nc=Math.floor(T/nu+1e-9);
          rem.set(uid,T-nc*nu); if(nc<=0) return;
          msg=JSON.parse(JSON.stringify(msg));
          if(L){ msg.gift.coins=nu; msg.gift.count=nc; } else { const dd=msg.data||msg; dd.diamondCount=nu; dd.repeatCount=nc; dd.giftType=0; delete dd.repeatEnd; } }
      }catch(e){} return oh.call(this,msg); }; }
    if(Q.has("likerate")&&typeof window.likePoints==="function"){ const lp=window.likePoints; window.likePoints=function(u,n,per){ return lp.call(this,u,n,num(Q.get("likerate"),per)||per); }; }
  });
  // ---------- премиальный HUD для игр на общем ядре: стеклянная шапка, баннер и лента
  addEventListener("DOMContentLoaded",()=>{ if(Q.get("style")==="classic") return; try{
    if(typeof drawHeader!=="function"||typeof rr!=="function"||typeof ctx==="undefined") return;
    const mk=(w,h)=>{ const c=document.createElement("canvas"); c.width=Math.ceil(w); c.height=Math.ceil(h); return c; };
    const rk=(k,x,y,w,h,r)=>{ k.beginPath(); k.moveTo(x+r,y); k.arcTo(x+w,y,x+w,y+h,r); k.arcTo(x+w,y+h,x,y+h,r); k.arcTo(x,y+h,x,y,r); k.arcTo(x,y,x+w,y,r); k.closePath(); };
    const glass=(k,x,y,w,h,r,a)=>{ const gr=k.createLinearGradient(0,y,0,y+h); gr.addColorStop(0,`rgba(30,46,82,${a})`); gr.addColorStop(1,`rgba(10,20,40,${a+.08})`); k.fillStyle=gr; rk(k,x,y,w,h,r); k.fill(); k.lineWidth=2; k.strokeStyle="rgba(255,255,255,.16)"; k.stroke(); };
    const tx=(k,t,x,y,size,c,w,maxW)=>{ k.font=`${w} ${size}px ${FAM}`; while(maxW&&size>14&&k.measureText(t).width>maxW){ size--; k.font=`${w} ${size}px ${FAM}`; }
      k.textAlign="center"; k.textBaseline="middle"; k.lineJoin="round"; k.lineWidth=Math.max(3,size/9*.62*1.6); k.strokeStyle="rgba(6,12,28,.62)"; k.strokeText(t,x,y+1); k.fillStyle=c; k.fillText(t,x,y); };
    let hk="", hc=null, hw=0;
    window.drawHeader=function(title,color,sub){
      if(STREAMER) txt("@"+STREAMER,40,TOP-30,24,"rgba(255,255,255,.6)","left",700,false);
      if(SRC!=="demo"&&wsState!=="ok") txt(wsState==="bad"?"🔴 нет связи":"⏳",PW-60,TOP-30,22,"#f88","center",700);
      const key=title+"|"+color+"|"+(sub||"");
      if(key!==hk||!hc){ hk=key; const k0=mk(4,4).getContext("2d"); k0.font=`900 60px ${FAM}`; const tw=Math.min(PW-60,k0.measureText(TITLE&&window.SS_TITLE_SRC===title?TITLE:title).width), w=Math.min(PW-30,Math.max(tw+120,sub?620:0)), h=sub?136:84;
        hw=w; hc=mk(PW,h+8); const k=hc.getContext("2d"); const ox=CX-w/2; glass(k,ox,2,w,h,34,.5); k.fillStyle=color; k.globalAlpha=.9; rk(k,CX-60,h-5,120,4,2); k.fill(); k.globalAlpha=1;
        tx(k,title,CX,42,60,color,900,PW-80); if(sub) tx(k,sub,CX,102,30,"#E2E8F0",700,w-40); }
      ctx.drawImage(hc,0,TOP-6); };
    const bc=new WeakMap();
    window.drawBanner=function(y){ if(!banner) return; let c=bc.get(banner);
      if(!c){ c=mk(960,250); const k=c.getContext("2d"); k.translate(480,115); k.shadowColor="rgba(0,0,0,.5)"; k.shadowBlur=30; k.shadowOffsetY=10; glass(k,-440,-84,880,168,38,.86); k.shadowBlur=0; k.shadowOffsetY=0;
        k.fillStyle=banner.c; rk(k,-90,-84,180,5,3); k.fill(); tx(k,banner.title,0,-24,58,banner.c,900,820); tx(k,banner.sub,0,38,30,"#F8FAFC",700,820); bc.set(banner,c); }
      const a=Math.min(1,banner.life*2), kk=Math.min(1,Math.max(0,(2.8-banner.life)/.25)), s=.92+.08*(1-Math.pow(1-kk,3));
      ctx.save(); ctx.globalAlpha=a; ctx.translate(CX,y); ctx.scale(s,s); ctx.drawImage(c,-480,-115); ctx.restore(); };
    const fc2=new WeakMap();
    window.drawFeed=function(y,gap=36){ feed.forEach((f,i)=>{ let c=fc2.get(f);
        if(!c){ c=mk(PW,gap); const k=c.getContext("2d"); k.font=`700 24px ${FAM}`; const w=Math.min(PW-80,k.measureText(f.text).width+44); k.fillStyle="rgba(14,26,52,.66)"; rk(k,CX-w/2,3,w,gap-6,(gap-6)/2); k.fill(); tx(k,f.text,CX,gap/2,24,f.c,800,PW-120); fc2.set(f,c); }
        ctx.globalAlpha=Math.min(1,f.life); ctx.drawImage(c,0,y+i*gap-gap/2); }); ctx.globalAlpha=1; };
  }catch(e){} });
  // ---------- премиальный текст: шрифт, мягкая обводка, стекло вместо чёрного
  const FAM='"Inter","SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif';
  try{ const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap"; document.head.appendChild(l); }catch(e){}
  const TITLE=(Q.get("title")||"").slice(0,40), ACC=/^#[0-9a-f]{3,8}$/i.test(Q.get("accent")||"")?Q.get("accent"):null;
  const P=CanvasRenderingContext2D.prototype, fd=Object.getOwnPropertyDescriptor(P,"font"), sd=Object.getOwnPropertyDescriptor(P,"strokeStyle"), fsd=Object.getOwnPropertyDescriptor(P,"fillStyle");
  const fc=new Map();
  if(fd&&fd.set) Object.defineProperty(P,"font",{get:fd.get,set(v){ let r=fc.get(v); if(r===undefined){ r=String(v).replace(/"Segoe UI",\s*"Arial Black",\s*system-ui,\s*sans-serif|"Arial Black",\s*"Segoe UI"[^;]*?sans-serif|Arial Black|Impact/g,FAM); if(fc.size>800) fc.clear(); fc.set(v,r); } fd.set.call(this,r); },configurable:true});
  // чёрные подложки и затемнения → глубокий navy (стекло StreamStorm)
  const navy=new Map();
  const tint=v=>{ if(typeof v!=="string") return v; let r=navy.get(v); if(r===undefined){ const m=v.match(/^rgba\(\s*0\s*,\s*0\s*,\s*0\s*,\s*([\d.]+)\s*\)$/); r=m?`rgba(8,16,34,${Math.min(.92,+m[1]+.04)})`:v; if(ACC&&/^#(F5C542|FFD23F|FFD978|F5C542)$/i.test(v)) r=ACC; if(navy.size>400) navy.clear(); navy.set(v,r); } return r; };
  if(fsd&&fsd.set) Object.defineProperty(P,"fillStyle",{get:fsd.get,set(v){ fsd.set.call(this,tint(v)); },configurable:true});
  // обводка текста: чёрная толстая → мягкая полупрозрачная тонкая
  const st=P.strokeText;
  P.strokeText=function(t,x,y,...a){ const ss=sd.get.call(this); if(typeof ss==="string"&&/^rgba\(0,\s*0,\s*0,\s*\.?[5-9]|^#000/.test(ss)&&this.lineWidth>=4){ const lw=this.lineWidth; sd.set.call(this,"rgba(6,12,28,.62)"); this.lineWidth=Math.max(3,lw*.62); st.call(this,TITLE&&window.SS_TITLE_SRC===t?TITLE:t,x,y+1,...a); this.lineWidth=lw; sd.set.call(this,ss); return; } return st.call(this,TITLE&&window.SS_TITLE_SRC===t?TITLE:t,x,y,...a); };
  if(TITLE){ const ft=P.fillText, mt=P.measureText; window.SS_TITLE_SRC=null;
    const isT=t=>{ if(typeof t!=="string") return false; if(window.SS_TITLE_SRC) return t===window.SS_TITLE_SRC; const base=document.title.split(" — ")[0].replace(/[^\p{L}\p{N} ]/gu,"").trim().toUpperCase(); const tt=t.replace(/[^\p{L}\p{N} ]/gu,"").trim().toUpperCase(); if(base&&tt===base){ window.SS_TITLE_SRC=t; return true; } return false; };
    P.fillText=function(t,...a){ return ft.call(this,isT(t)?TITLE:t,...a); }; P.measureText=function(t){ return mt.call(this,isT(t)?TITLE:t); }; }
})();
</script>
<script id="modes" data-game="duel-energy">
/* ===================== РЕЖИМЫ StreamStorm: выбор категории до эфира (?mode=) =====================
   Лаунчер добавляет &mode=<id>. Режим только подставляет состав команд (параметры teams / a,b),
   поэтому правила игры не меняются. Явные teams=, a=, b= в ссылке важнее режима. */
(function(){
  const GAME=(document.currentScript&&document.currentScript.dataset.game)||"";
  const MODES={
    "lava-rising":  {countries:{teams:"KZ,UZ,PL,DE,TR,BR"}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "country-race": {countries:{}, duel:{teams:"KZ,UZ"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "tower":        {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},
    "paint-map":    {countries:{}, duel:{teams:"KZ,PL"}, colors:{teams:"RED,BLU,GRN,YEL"}},

  }
  function histPush(u,name,pic,tier,count,coins){ const key=u.id+"|"+name, now=performance.now(), h=hist[0];

  // ---- полёт: из окна по дуге к цели в игре

  function arrive(f,u,pic,tier,count,coins,tg){ const T=TIERS[tier], c=tg.color||T.c1, n=Math.round(T.parts*.45);
    for(let i=0;i<n&&sparks.length<120;i++){ const a=Math.random()*Math.PI*2, sp=90+Math.random()*(tier==="big"?380:200); sparks.push({x:tg.x,y:tg.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.45+Math.random()*.3,c:Math.random()<.5?c:T.c1,r:2+Math.random()*(tier==="big"?6:3.5),gr:500}); }
    rings.push({x:tg.x,y:tg.y,r:8,max:tier==="big"?200:tier==="mid"?120:70,c,life:.8});
    if(tier==="big") flash=Math.max(flash,.35); }
  function gwAdd(u,unit,count,name,pic){ const tier=tierOf(unit), coins=unit*count, key=u.id+"|"+name, now=performance.now();
    histPush(u,name,pic,tier,count,coins);
    if(hero&&hero.key===key&&hero.st<2){ hero.count+=count; hero.coins+=coins; hero.bump=1; hero.dirty=true; if(hero.st===1) hero.t=Math.min(hero.t,.15); return; }
    const q=heroQ.find(h=>h.key===key); if(q){ q.count+=count; q.coins+=coins; return; }
    rate.push(now); while(rate.length&&now-rate[0]>1000) rate.shift();
    const busy=rate.length>6||heroQ.length>=3;
    if((tier==="small"&&busy)||heroQ.length>=10||(tier==="mid"&&heroQ.length>=6)){ fly(L2G(LAUNCH.x,LAUNCH.y-40),u,pic,tier,count,coins,tier==="small"?.5:.65); return; }  // поток: сразу летит из окна, без остановки
    const h={key,u,name,pic,tier,T:TIERS[tier],count,coins,st:0,t:0,bump:0,dirty:true};
    if(tier==="big"){ let i=0; while(i<heroQ.length&&heroQ[i].tier==="big") i++; heroQ.splice(i,0,h); } else heroQ.push(h);
    if(tier==="big") flash=Math.max(flash,.35); }
  // подпись под подарком в окне (кэш, заново только при комбо)
  function heroLabel(h){ const cv=h.cv||(h.cv=document.createElement("canvas")); cv.width=GW_W; cv.height=96; const k=cv.getContext("2d");

    const s2=h.name+(h.count>1?"  ×"+h.count:""); tk(k,s2,GW_W/2,54,fitK(k,s2,21,GW_W-24,800),h.T.c1,"center",800);
    tk(k,"+"+fmt(h.coins),GW_W/2,82,fitK(k,"+"+fmt(h.coins),22,GW_W-24),"#FFD978","center",900); h.dirty=false; h.lblPic=ready(img(h.pic)); }
  const HOLD={small:.75,mid:1.15,big:1.7};
  function gwTick(dt){ gwSync(); if(gwM!=="right"){ if(hero||heroQ.length){ for(const h of [hero,...heroQ]) if(h) fly({x:540,y:900},h.u,h.pic,h.tier,h.count,h.coins,.6); hero=null; heroQ.length=0; } }
    if(!hero&&heroQ.length&&R){ hero=heroQ.shift(); chromeDirty=true; }
    if(hero){ const h=hero; h.t+=dt; h.bump=Math.max(0,h.bump-dt*4);
      const hold=heroQ.length>2?.35:heroQ.length?HOLD[h.tier]*.6:HOLD[h.tier];
      if(h.st===0&&h.t>=.32){ h.st=1; h.t=0; } else if(h.st===1&&h.t>=hold){ fly(L2G(HERO.x,HERO.y),h.u,h.pic,h.tier,h.count,h.coins,R?R.s:1); hero=null; if(!heroQ.length) chromeDirty=true; } }
    for(const f of flights){ f.t+=dt;
      if(f.t<f.dur&&sparks.length<150&&Math.random()<.7){ const p=flightPos(f); sparks.push({x:p.x+(Math.random()-.5)*24,y:p.y+(Math.random()-.5)*24,vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60+40,life:.45,c:TIERS[f.tier].c1,r:2+Math.random()*4}); }
      if(f.t>=f.dur){ f.done=true; arrive(f,f.u,f.pic,f.tier,f.count,f.coins,f.tg); } }
    for(let i=flights.length-1;i>=0;i--) if(flights[i].done) flights.splice(i,1);
    const now=performance.now(); if(chromeDirty&&now-chromeAt>120){ chromeAt=now; drawChrome(); } }
  function flightPos(f){ const k=Math.min(1,f.t/f.dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, x1=f.tg.x, y1=f.tg.y;

    const dt=Math.min(.05,(now-last)/1000); last=now;

    gwTick(dt);
    for(const c of cards){ c.bump=Math.max(0,c.bump-dt*4); c.t+=dt;

      else if(c.st===1){ const k=Math.min(1,c.t/.55), e=k*k*(3-2*k); c.x=c.sx+(c.tx-c.sx)*e; c.y=c.sy+(c.ty-c.sy)*e-Math.sin(k*Math.PI)*120; c.s=1-.75*e;

    for(const p of pops){ p.life-=dt; p.y-=70*dt; } pops=pops.filter(p=>p.life>0); if(pops.length>20) pops.splice(0,pops.length-20);

    if(MERGED) g.restore(); else requestAnimationFrame(step);
  }
  if(MERGED) window.__fxStep=step; else requestAnimationFrame(step);
})();

/* StreamStorm: проверка ключа в игре. Только при src=tikfinity; демо не трогаем.

(function(){

  var q=new URLSearchParams(location.search);
  if((q.get("src")||"demo").toLowerCase()!=="tikfinity"||!window.SSLicense) return;
  var key=q.get("key")||SSLicense.saved(), mark=null;
  function place(){ if(!mark) return; var k=Math.min(innerWidth/1080,innerHeight/1920), r={left:(innerWidth-1080*k)/2, top:(innerHeight-1920*k)/2}; mark.style.left=(r.left+24*k)+"px"; mark.style.top=(r.top+968*k)+"px"; mark.style.fontSize=Math.max(9,22*k)+"px"; }
  function show(on){

      document.body.appendChild(mark); place(); addEventListener("resize",place); }
    else if(!on&&mark){ mark.remove(); mark=null; }
  }
  /* нет связи с сервером ключей -> метку не показываем (платный стример не должен видеть DEMO), повтор через 60 с */
  var tm=0;

      var net=r.reason==="offline_no_cache"||r.reason==="rate_limited";

      tm=setTimeout(run,net?60*1000:30*60*1000); })
    .catch(function(){ tm=setTimeout(run,60*1000); }); }
  run();
})();
