<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Alisa Dumych">
<meta name="copyright" content="© 2026 Alisa Dumych">
<meta name="description" content="Floristika – interaktivní prezentace o květinách. Alisa Dumych.">
<title>Floristika</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Mulish:wght@400;500;700&display=swap">
<style>
/* Layout: one long scroll of full-screen "beds"; each snaps into place, its photo opens through an arched greenhouse window, and the living background re-tints to that flower */
:root{
  --ink:#2f2429;
  --ink-soft:#5f4e55;
  --paper:#fbf6f2;
  --line:rgba(47,36,41,.14);
  --leaf:#7d9a73;
  --bg-now:#f6dde0;
  --ac-now:#b8546a;
  --display:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --body:"Mulish","Segoe UI",system-ui,-apple-system,sans-serif;
  --t-hero:clamp(3.2rem,9vw,8.4rem);
  --t-h1:clamp(2.4rem,5.3vw,5.3rem);
  --t-h2:clamp(1.4rem,2.45vw,2.45rem);
  --t-body:clamp(1rem,.55rem + .92vw,1.5rem);
  --t-small:clamp(.8rem,.66rem + .36vw,1rem);
  --gut:max(clamp(16px,6vw,110px), env(safe-area-inset-left,0px));
  --gutr:max(clamp(16px,6vw,110px), env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-now);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background-color 1.2s ease}

/* ---------- living background ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg-now);transition:background-color 1.2s ease}
#bg .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;will-change:transform}
#bg .b1{width:55vmax;height:45vmax;right:-14vmax;top:-16vmax;background:color-mix(in srgb,var(--ac-now) 38%, white);animation:drift1 26s ease-in-out infinite;transition:background-color 1.4s}
#bg .b2{width:46vmax;height:40vmax;left:-14vmax;bottom:-16vmax;background:color-mix(in srgb,var(--leaf) 45%, white);animation:drift2 32s ease-in-out infinite}
#bg .b3{width:30vmax;height:28vmax;left:34%;top:30%;background:rgba(255,255,255,.75);animation:drift3 22s ease-in-out infinite}
#bg .b4{width:22vmax;height:22vmax;right:18%;bottom:6%;background:color-mix(in srgb,var(--ac-now) 22%, #ffe9b8);animation:drift2 28s ease-in-out infinite reverse;transition:background-color 1.4s}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8vmax,6vmax) scale(1.12)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vmax,-5vmax) scale(1.08)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}33%{transform:translate(-6vmax,4vmax)}66%{transform:translate(5vmax,-3vmax)}}
#bg .grain{position:absolute;inset:-50%;opacity:.16;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .28  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#bg .lines{position:absolute;inset:0;opacity:.35;background:
  radial-gradient(circle at 50% 50%, transparent 0 34vmax, color-mix(in srgb,var(--ac-now) 12%, transparent) 34vmax calc(34vmax + 1px), transparent calc(34vmax + 1px)),
  radial-gradient(circle at 50% 50%, transparent 0 46vmax, color-mix(in srgb,var(--ac-now) 9%, transparent) 46vmax calc(46vmax + 1px), transparent calc(46vmax + 1px));
  animation:breathe 14s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}

/* ---------- deck = scroll container ---------- */
.deck{position:fixed;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.deck::-webkit-scrollbar{width:0;height:0}
.slide{position:relative;min-height:100vh;min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always;display:grid}
.inner{position:relative;z-index:2;display:grid;align-items:center;align-content:center;gap:clamp(24px,5vw,90px);
  padding-block:clamp(70px,10vh,110px) clamp(84px,12vh,120px);padding-left:var(--gut);padding-right:var(--gutr)}

/* ---------- type ---------- */
.eyebrow{font:700 var(--t-small)/1.2 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:var(--t-h1);line-height:.95}
h1 em{font-style:italic;color:var(--ac);font-weight:500}
.latin{font:italic 500 var(--t-h2)/1 var(--display);color:var(--ink-soft)}
.copy{display:grid;gap:clamp(12px,1.8vh,22px);min-width:0;max-width:40ch;align-content:center}
.copy p{margin:0;font-size:var(--t-body);line-height:1.45}
.copy p+p{color:var(--ink-soft)}
.ch{display:inline-block}
.w{display:inline-block;white-space:nowrap}

/* fact strip */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1.5px solid var(--ac);margin:clamp(4px,1vh,12px) 0 0}
.facts div{padding:12px 14px 2px 0;display:grid;gap:5px;min-width:0;align-content:start}
.facts div+div{padding-left:14px;border-left:1px solid var(--line)}
.facts dt{font:700 clamp(.72rem,.6rem + .3vw,.95rem)/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.facts dd{margin:0;font:600 clamp(1.05rem,.72rem + .75vw,1.55rem)/1.15 var(--display)}

/* ---------- photo frames ---------- */
.split{grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr)}
.split.flip{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr)}
.split.flip .media{order:2}
.media{position:relative;justify-self:center;height:min(70vh,760px);aspect-ratio:3/4;max-width:100%}
.arch{position:absolute;inset:0;border-radius:999px 999px 18px 18px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 22%, white),color-mix(in srgb,var(--ac) 40%, white));box-shadow:0 40px 70px -36px color-mix(in srgb,var(--ac) 70%, black)}
.arch img,.kph img,.hph img,.bleed img,.minis img{width:100%;height:100%;object-fit:cover;display:block}
.arch img,.bleed img{transform:translate3d(0,var(--py,0px),0);scale:1.14;transition:scale 1.2s var(--ease);will-change:transform}
.media:hover .arch img{scale:1.22}
.arch-ring{position:absolute;inset:-14px;border:1.5px solid var(--ac);border-radius:999px 999px 26px 26px;opacity:.5;pointer-events:none}
.tag{position:absolute;left:50%;bottom:-18px;translate:-50% 0;background:var(--paper);color:var(--ac);font:italic 600 var(--t-small)/1 var(--display);padding:10px 18px;border-radius:99px;white-space:nowrap;box-shadow:0 10px 24px -12px rgba(0,0,0,.35);z-index:2}
.noimg{display:grid;place-items:center}
.noimg img{display:none}
.noimg::after{content:attr(data-label);font:italic 600 var(--t-h2)/1 var(--display);color:color-mix(in srgb,var(--ac) 80%, black);opacity:.6;text-align:center;padding:12px}

/* origin map behind each flower */
.geo{position:absolute;z-index:1;top:50%;width:min(92vh,62vw);aspect-ratio:1;translate:0 -50%;pointer-events:none;color:var(--ac)}
.geo svg{width:100%;height:100%;overflow:visible;animation:geofloat 18s ease-in-out infinite}
.geo path{fill:currentColor;fill-opacity:.1;stroke:currentColor;stroke-opacity:.35;stroke-width:1.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke}
.geo{width:min(82vh,48vw)}.g-left{left:1vw}.g-right{right:1vw}.g-text{right:1vw}
.g-text path{fill-opacity:.1}
@keyframes geofloat{50%{transform:translate(1.5%,-2%) rotate(1.5deg)}}
.js .slide .geo{transition:opacity 1.6s ease .2s, transform 1.8s var(--ease) .2s}
.js .slide:not(.in) .geo{opacity:0;transform:scale(.88) rotate(-6deg)}
.geocap{display:inline-flex;align-items:center;gap:10px;justify-self:start;font:600 clamp(.8rem,.68rem + .3vw,1rem)/1.2 var(--body);color:var(--ac);background:rgba(255,255,255,.62);border:1px solid color-mix(in srgb,var(--ac) 30%, transparent);padding:7px 14px 7px 10px;border-radius:99px}
.geocap i{position:relative;width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.geocap i::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ac);animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}

/* full-bleed */
.full{grid-template-columns:1fr}
.full .bleed{position:absolute;inset:0;z-index:0;overflow:hidden}
.full .bleed::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent 18%, color-mix(in srgb,var(--bg) 90%, transparent) 50%, var(--bg) 70%)}
.full .inner{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.full .copy{grid-column:2}

/* title */
.title .inner{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.hero{font-size:var(--t-hero);font-family:var(--display);font-weight:600;line-height:.85;margin:0;letter-spacing:-.02em}
.hero .sub{display:block;font-style:italic;font-weight:500;color:var(--ac);font-size:.4em;letter-spacing:0;margin-top:.3em;line-height:1}
.hint{font-size:var(--t-small);color:var(--ink-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
kbd{font:700 .85em var(--body);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:2px 8px;background:rgba(255,255,255,.6)}
.scrollcue{display:inline-flex;align-items:center;gap:10px}
.scrollcue i{width:22px;height:34px;border:1.5px solid var(--ink-soft);border-radius:12px;position:relative}
.scrollcue i::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;background:var(--ac);translate:-50% 0;animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* stacks */
.stack .inner{grid-template-columns:minmax(0,1fr)}
.head{display:grid;gap:12px;max-width:min(100%,980px)}
.head .lead{font-size:var(--t-body);margin:0;color:var(--ink-soft);max-width:48ch;line-height:1.45}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2vw,28px)}
.kind{position:relative;overflow:hidden;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.95);border-radius:22px;padding:clamp(16px,2.2vw,30px);display:grid;gap:10px;align-content:start;min-width:0;box-shadow:0 24px 50px -36px color-mix(in srgb,var(--ac) 80%, black)}
.kind::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(280px circle at var(--gx,50%) var(--gy,0%), rgba(255,255,255,.7), transparent 60%);opacity:0;transition:opacity .4s}
.kind.hot::after{opacity:1}
.kph{margin:calc(-1 * clamp(16px,2.2vw,30px));margin-bottom:8px;height:clamp(130px,20vh,230px);overflow:hidden;position:relative;background:color-mix(in srgb,var(--ac) 25%, white)}
.kph img{transition:scale 1s var(--ease)}
.kind:hover .kph img{scale:1.08}
.kind h3{font-size:var(--t-h2);line-height:1}
.kind p{margin:0;font-size:clamp(.98rem,.72rem + .55vw,1.3rem);line-height:1.45;color:var(--ink-soft)}
.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2.4vw,34px) clamp(18px,3vw,44px)}
.hue{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.hph{width:clamp(72px,7.5vw,118px);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;background:var(--hc);box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--hc),0 18px 30px -18px rgba(0,0,0,.5);transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.hph.noimg::after{display:none}
.hue:hover .hph{transform:rotate(-10deg) scale(1.1)}
.hue b{display:block;font:600 var(--t-h2)/1 var(--display)}
.hue span{font-size:clamp(.98rem,.72rem + .55vw,1.3rem);color:var(--ink-soft)}

/* collage */
.collage{position:relative;height:min(70vh,740px);aspect-ratio:1/1.05;max-width:100%;justify-self:center}
.collage .arch{inset:auto}
.collage .c1{left:0;top:6%;width:52%;height:68%}
.collage .c2{right:0;top:0;width:44%;height:52%}
.collage .c3{right:6%;bottom:0;width:40%;height:42%;border-radius:18px 18px 999px 999px}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:clamp(10px,1.6vh,18px);counter-reset:s}
.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:baseline;font-size:var(--t-body);line-height:1.35;counter-increment:s}
.steps li::before{content:counter(s);font:italic 600 1.5em/1 var(--display);color:var(--ac);min-width:1ch}

/* quiz */
.quiz{background:rgba(255,255,255,.7);border-radius:28px;padding:clamp(20px,3vw,44px);display:grid;gap:18px;min-width:0;border:1px solid rgba(255,255,255,.95);max-width:1100px;width:100%}
.qtop{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-small);color:var(--ink-soft)}
.qbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ac);transition:width .6s var(--ease)}
.qtext{font:600 var(--t-h2)/1.1 var(--display);margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{font:500 clamp(1rem,.72rem + .55vw,1.3rem)/1.3 var(--body);text-align:left;padding:16px 20px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:border-color .2s, background .2s, transform .25s var(--ease)}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateY(-3px)}
.opt:focus-visible,.qnext:focus-visible,.nav button:focus-visible,.dots button:focus-visible{outline:3px solid var(--ac-now);outline-offset:2px}
.opt.ok{background:#e3efdc;border-color:#5e8a4f}
.opt.no{background:#f6dcdc;border-color:#b34a4a;animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt:disabled{cursor:default}
.qfb{min-height:1.6em;font-size:clamp(1rem,.72rem + .55vw,1.3rem);color:var(--ink-soft);margin:0}
.qnext{justify-self:start;font:700 var(--t-small) var(--body);background:var(--ac);color:#fff;border:0;border-radius:99px;padding:12px 24px;cursor:pointer}

/* centre + credits */
.center .inner{grid-template-columns:1fr;justify-items:center;text-align:center}
.center .copy{max-width:52ch;justify-items:center}
.byline{font:italic 600 clamp(1.8rem,1.1rem + 2vw,3.2rem)/1.05 var(--display);color:var(--ink);display:flex;flex-wrap:wrap;align-items:baseline;gap:.35em}
.byline span{font:700 clamp(.8rem,.65rem + .3vw,1rem)/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.author{font:italic 500 clamp(1.3rem,.9rem + .9vw,2rem)/1.2 var(--display);color:var(--ink-soft)}
.minis{display:flex;gap:clamp(8px,1.2vw,16px);justify-content:center;flex-wrap:wrap}
.minis .m{width:clamp(52px,6.5vw,104px);aspect-ratio:3/4;border-radius:999px 999px 10px 10px;overflow:hidden;box-shadow:0 14px 30px -18px rgba(0,0,0,.5);transition:transform .5s cubic-bezier(.3,1.5,.5,1);background:color-mix(in srgb,var(--ac) 25%, white)}
.minis .m:hover{transform:translateY(-12px) rotate(-4deg)}
.credits{width:100%;columns:2 320px;column-gap:40px;margin:0;padding:0;list-style:none;font-size:clamp(.85rem,.75rem + .2vw,1rem);line-height:1.45;color:var(--ink-soft);text-align:left}
.credits li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line)}
.credits b{color:var(--ink);font-weight:700}
.credits a{color:var(--ac)}
.copyright{margin:8px 0 0;font:italic 500 clamp(1rem,.85rem + .35vw,1.3rem)/1.4 var(--display);color:var(--ink)}

/* ---------- reveal on scroll (enabled only when JS runs) ---------- */
.js .slide .rv>*{transition:opacity .9s var(--ease), transform 1s var(--ease);transition-delay:calc(.15s + var(--i,0) * .1s)}
.js .slide:not(.in) .rv>*{opacity:0;transform:translateY(30px)}
.js .slide h1 .ch{transition:opacity .7s var(--ease), transform .9s var(--ease), filter .7s;transition-delay:calc(.2s + var(--c,0) * .028s)}
.js .slide:not(.in) h1 .ch{opacity:0;transform:translateY(.5em) rotate(8deg);filter:blur(6px)}
.js .slide .arch{transition:clip-path 1.3s cubic-bezier(.7,0,.2,1)}
.js .slide:not(.in) .arch{clip-path:inset(100% 0 0 0 round 999px 999px 18px 18px)}
.js .slide.in .arch{clip-path:inset(0 0 0 0 round 999px 999px 18px 18px)}
.js .slide .collage .c3{transition-delay:.25s}.js .slide .collage .c2{transition-delay:.12s}
.js .slide .arch-ring,.js .slide .tag{transition:opacity 1s .7s, transform 1.2s .6s var(--ease)}
.js .slide:not(.in) .arch-ring{opacity:0;transform:scale(.92)}
.js .slide:not(.in) .tag{opacity:0;transform:translateY(14px)}
.js .full .bleed{transition:clip-path 1.4s cubic-bezier(.7,0,.2,1)}
.js .full:not(.in) .bleed{clip-path:inset(0 0 0 100%)}
.js .full.in .bleed{clip-path:inset(0 0 0 0)}
.js .slide:not(.in) .kind{opacity:0;transform:translateY(50px) rotate(-2deg)}
.js .slide .kind{transition:opacity .9s var(--ease), transform 1s var(--ease), box-shadow .4s;transition-delay:calc(.25s + var(--i,0) * .12s)}
.js .slide.in .kind.hot{transition:transform .12s linear, box-shadow .4s}
.js .slide:not(.in) .hph{opacity:0;transform:scale(.3) rotate(-60deg)}
.js .slide .hph{transition:opacity .8s, transform 1s cubic-bezier(.3,1.5,.5,1);transition-delay:calc(.3s + var(--i,0) * .1s)}
.js .slide:not(.in) .facts{clip-path:inset(0 100% 0 0)}
.js .slide .facts{transition:clip-path 1.1s cubic-bezier(.7,0,.2,1) .7s}
.js .slide.in .facts{clip-path:inset(0 0 0 0)}
.tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.media.tilt{transition:transform .6s var(--ease)}
.media.tilt.hot{transition:transform .12s linear}

/* ---------- chrome ---------- */
#petals{position:fixed;inset:0;z-index:5;pointer-events:none}
.bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:20}
.bar i{display:block;height:100%;width:0;background:var(--ac-now);transition:background .6s}
.nav{position:fixed;z-index:20;right:max(16px, calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px;border-radius:99px;box-shadow:0 12px 30px -18px rgba(0,0,0,.45)}
.nav button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:20px;transition:background .2s}
.nav button:hover{background:rgba(0,0,0,.06)}
.count{font:600 1.05rem var(--display);min-width:5ch;text-align:center;font-variant-numeric:tabular-nums}
.dots{position:fixed;z-index:20;right:max(14px, calc(env(safe-area-inset-right,0px) + 14px));top:50%;translate:0 -50%;display:grid;gap:6px}
.dots button{position:relative;width:12px;height:12px;border:0;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.dots button::before{content:"";width:6px;height:6px;border-radius:99px;background:var(--ink);opacity:.25;transition:all .4s var(--ease)}
.dots button.on::before{height:14px;opacity:1;background:var(--ac-now)}
.dots button span{position:absolute;right:22px;top:50%;translate:0 -50%;white-space:nowrap;font:600 .95rem var(--display);background:var(--paper);padding:4px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s, translate .2s;box-shadow:0 8px 20px -12px rgba(0,0,0,.4)}
.dots button:hover span,.dots button:focus-visible span{opacity:1;translate:-4px -50%}
.wm{position:fixed;z-index:20;left:var(--gut);top:calc(env(safe-area-inset-top,0px) + 18px);font:italic 600 clamp(1.15rem,.9rem + .6vw,1.6rem)/1 var(--display);color:var(--ink)!important;color:var(--ink-soft);pointer-events:none;letter-spacing:.02em}
.wm b{font-style:normal;font-family:var(--body);font-weight:700;font-size:.55em;letter-spacing:.16em;text-transform:uppercase;color:var(--ac-now);margin-right:8px;transition:color .6s}
.toast{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 22px);translate:-50% -20px;opacity:0;max-width:min(92vw,560px);background:var(--ink);color:#fff;font:500 1rem/1.4 var(--body);padding:14px 20px;border-radius:14px;box-shadow:0 18px 40px -20px rgba(0,0,0,.6);transition:opacity .35s, translate .35s;pointer-events:none}
.toast.show{opacity:1;translate:-50% 0}
.cursor{position:fixed;z-index:40;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border:1.5px solid var(--ac-now);border-radius:50%;pointer-events:none;opacity:0;transition:width .3s, height .3s, margin .3s, opacity .3s, background .3s, border-color .6s}
.cursor.big{width:70px;height:70px;margin:-35px 0 0 -35px;background:color-mix(in srgb,var(--ac-now) 12%, transparent)}
.loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--bg-now);transition:opacity .9s ease, visibility 0s .9s}
.loader.done{opacity:0;visibility:hidden}
.loader b{font:600 clamp(3rem,9vw,7rem)/1 var(--display);letter-spacing:-.02em;color:var(--ink);display:flex;overflow:hidden}
.loader b span{display:inline-block;animation:ldIn .9s var(--ease) both;animation-delay:calc(var(--c) * .06s)}
@keyframes ldIn{from{transform:translateY(105%)}to{transform:none}}
.ldby{font:italic 500 clamp(1.2rem,1rem + 1vw,2rem)/1 var(--display);color:var(--ink-soft);animation:ldIn 1s .5s var(--ease) both}
.loader i{position:absolute;left:50%;bottom:22%;width:min(220px,50vw);height:2px;translate:-50% 0;background:var(--line);overflow:hidden}
.loader i::after{content:"";position:absolute;inset:0;background:var(--ac-now);transform-origin:left;animation:ld 1.1s var(--ease) both}
@keyframes ld{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ---------- phones & small tablets: same story, stacked ---------- */
@media (max-width:860px){
  .deck{scroll-snap-type:y proximity}
  .slide{scroll-snap-stop:normal}
  .inner,.title .inner,.full .inner,.split,.split.flip{grid-template-columns:minmax(0,1fr)!important;align-content:start;gap:28px}
  .inner{padding-block:70px 104px}
  .split.flip .media{order:0}
  .media,.collage{height:auto;width:min(80vw,400px)}
  .media{aspect-ratio:4/5}
  .collage{aspect-ratio:1/1.05}
  .geo,.g-text{width:105vw;top:auto;bottom:-6vh;translate:0 0}.g-left,.g-right,.g-text{left:auto;right:-30vw}
  .full .bleed{position:relative;height:52svh;inset:auto}

  .full .copy{grid-column:1}
  .full{grid-template-rows:auto 1fr}
  .full .inner{padding-top:0;margin-top:-60px}
  .copy{max-width:none}
  .grid4,.grid6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .opts{grid-template-columns:1fr}
  .dots{display:none}
  .wm{font-size:.85rem;top:calc(env(safe-area-inset-top,0px) + 16px)}
  .facts div{padding-right:8px}.facts div+div{padding-left:8px}
}
@media (max-width:480px){
  .grid4{gap:12px}
  .kph{height:120px}
  .kind h3{font-size:1.45rem}
  .kind p{font-size:.92rem}
  .grid6{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .facts div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
}
@media (hover:none){.cursor{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}

}

      k.replaceWith(frag)}

/* ============ petals, pollen, gusts (canvas) ============ */
const Petals=(()=>{
  const cv=document.getElementById('petals'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,ps=[],base='#b8546a',ambient=14,shapes=null;
  const resize=()=>{const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0)};
  resize();addEventListener('resize',resize);
  const mix=(hex,t)=>{const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;return `rgb(${Math.round(r+(255-r)*t)},${Math.round(g+(255-g)*t)},${Math.round(b+(255-b)*t)})`};
  const make=(x,y,burst)=>{const a=Math.random()*6.283,sp=burst?2+Math.random()*5:0;
    const o={x,y,vx:burst?Math.cos(a)*sp:(Math.random()-.5)*.4,vy:burst?Math.sin(a)*sp-2:.4+Math.random()*.8,r:6+Math.random()*9,rot:Math.random()*6.28,vr:(Math.random()-.5)*.06,sw:Math.random()*6.28,col:mix(base,.25+Math.random()*.55),life:burst?1:2,burst,shape:'petal'};
    if(shapes){const sp=shapes[Math.floor(Math.random()*shapes.length)];o.shape=sp[0];o.col=sp[1][Math.floor(Math.random()*sp[1].length)];if(o.shape==='seed'||o.shape==='pollen')o.r*=.55;if(o.shape==='bud')o.r*=.8}
    return o};
  const setColor=(c,id)=>{base=c;shapes=PARTS[id]||null;ambient=(id==='uvod'||id==='dekuji')?20:(shapes?12:6)};
  const burst=(x,y,n=22)=>{if(!reduce)for(let i=0;i<n;i++)ps.push(make(x,y,true))};
  let lastSweep=0;
  const sweep=dir=>{const t=performance.now();if(reduce||t-lastSweep<1100)return;lastSweep=t;
    for(let i=0;i<30;i++){const p=make(W*Math.random(),dir>0?H+20+Math.random()*160:-20-Math.random()*160,true);
    p.vy=-dir*(14+Math.random()*10);p.vx=(Math.random()-.5)*4;p.life=1;p.gust=true;ps.push(p)}};
  const trail=(x,y)=>{if(!reduce)ps.push({x,y,vx:(Math.random()-.5)*.6,vy:-.2-Math.random()*.6,r:1.2+Math.random()*2.2,life:1,dot:true,burst:true})};
  function draw(p){
    if(p.dot){const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(255,214,120,${.9*p.life})`);g.addColorStop(1,'rgba(255,214,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,6.283);ctx.fill();return}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.scale(1,.75+.25*Math.sin(p.sw*2));ctx.globalAlpha=Math.min(1,p.life)*.85;ctx.fillStyle=p.col;ctx.beginPath();
    const r=p.r;
    if(p.shape==='seed'){ctx.ellipse(0,0,r*.55,r,0,0,6.283);ctx.fill();ctx.globalAlpha*=.5;ctx.strokeStyle='#d9c9a8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-r*.7);ctx.lineTo(0,r*.7);ctx.stroke();ctx.restore();return}
    if(p.shape==='pollen'){ctx.arc(0,0,r*.6,0,6.283);ctx.fill();ctx.restore();return}
    if(p.shape==='bud'){for(let k=-1;k<=1;k++){ctx.beginPath();ctx.ellipse(k*r*.15,k*r*.75,r*.3,r*.45,k*.3,0,6.283);ctx.fill()}ctx.restore();return}
    if(p.shape==='floret'){for(let k=0;k<4;k++){ctx.rotate(1.5708);ctx.beginPath();ctx.ellipse(0,-r*.5,r*.32,r*.5,0,0,6.283);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*.14,0,6.283);ctx.fill();ctx.restore();return}
    if(p.shape==='sliver'){ctx.ellipse(0,0,r*.2,r*1.1,0,0,6.283);ctx.fill();ctx.restore();return}
    if(p.shape==='leaf'){ctx.moveTo(0,-r*1.2);ctx.quadraticCurveTo(r*.8,0,0,r*1.2);ctx.quadraticCurveTo(-r*.8,0,0,-r*1.2);ctx.fill();ctx.globalAlpha*=.5;ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.stroke();ctx.restore();return}
    ctx.moveTo(0,-r);ctx.bezierCurveTo(r*.9,-r*.6,r*.7,r*.7,0,r);ctx.bezierCurveTo(-r*.7,r*.7,-r*.9,-r*.6,0,-r);ctx.fill();
    ctx.globalAlpha*=.35;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-r*.7);ctx.lineTo(0,r*.7);ctx.stroke();ctx.restore()}
  function tick(){ctx.clearRect(0,0,W,H);
    let amb=0;for(const p of ps)if(!p.burst)amb++;
    if(amb<ambient&&Math.random()<.08)ps.push(make(Math.random()*W,-20,false));
    for(const p of ps){p.sw=(p.sw||0)+.02;
      if(p.dot)p.life-=.022;else if(p.gust){p.vx+=Math.sin(p.sw*3)*.15;p.life-=.012}else if(p.burst){p.vy+=.08;p.vx*=.98;p.vy*=.98;p.life-=.012}else p.vx+=Math.sin(p.sw)*.01;
      p.x+=p.vx+(p.burst?0:Math.sin(p.sw)*.5);p.y+=p.vy;p.rot+=p.vr||0;draw(p)}
    ps=ps.filter(p=>p.life>0&&p.y<H+300&&p.y>-300&&p.x>-60&&p.x<W+60);
    requestAnimationFrame(tick)}
  if(!reduce)requestAnimationFrame(tick);
  return {setColor,burst,sweep,trail};
})();

/* ============ navigation & scroll-driven state ============ */
const els=[...deck.querySelectorAll('.slide')],N=els.length;
const count=document.getElementById('count'),bar=document.getElementById('barFill'),dotsBox=document.getElementById('dots');
dotsBox.innerHTML=els.map((s,i)=>`<button aria-label="${s.getAttribute('aria-label')}" data-i="${i}"><span>${s.getAttribute('aria-label')}</span></button>`).join('');
const dots=[...dotsBox.children];
dots.forEach(b=>b.onclick=()=>goTo(+b.dataset.i));
let cur=-1;
function setActive(n){
  if(n===cur)return;const dir=n>cur?1:-1,first=cur<0;cur=n;const s=els[n];
  count.textContent=(n+1)+' / '+N;dots.forEach((d,i)=>d.classList.toggle('on',i===n));
  const root=document.documentElement.style;root.setProperty('--bg-now',s.dataset.bg);root.setProperty('--ac-now',s.dataset.ac);
  Petals.setColor(s.dataset.ac,s.id);if(!first)Petals.sweep(dir);
  try{history.replaceState(null,'','#'+s.id)}catch(e){}
}
function goTo(n){n=Math.max(0,Math.min(N-1,n));els[n].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}
document.getElementById('prevBtn').onclick=()=>goTo(cur-1);
document.getElementById('nextBtn').onclick=()=>goTo(cur+1);

// reveal state: a slide is "in" while a good part of it is on screen; leaving resets it so it replays
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting&&e.intersectionRatio>=.35)e.target.classList.add('in');
  else if(!e.isIntersecting)e.target.classList.remove('in');
}),{root:deck,threshold:[0,.35,.6]});
els.forEach(s=>io.observe(s));

// per-frame: active slide, progress bar, photo parallax
function frameLoop(){
  const H=deck.clientHeight,st=deck.scrollTop,max=deck.scrollHeight-H;
  bar.style.width=(max>0?st/max*100:0)+'%';
  let best=0,bestD=1e9;
  els.forEach((s,i)=>{const r=s.getBoundingClientRect();const d=Math.abs(r.top);if(d<bestD){bestD=d;best=i}
    if(r.bottom>-H*.2&&r.top<H*1.2){const p=(r.top+r.height/2-H/2)/H;
      s.querySelectorAll('.arch img,.bleed img').forEach(im=>im.style.setProperty('--py',(p*-70).toFixed(1)+'px'));}});
  setActive(best);
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);

addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button'))if(e.key===' '||e.key==='Enter')return;
  if(['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();goTo(cur+1)}
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(cur-1)}
  else if(e.key==='Home'){e.preventDefault();goTo(0)}else if(e.key==='End'){e.preventDefault();goTo(N-1)}
  else if(e.key==='f'||e.key==='F')toggleFs();
});

/* fullscreen with fallback message */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),4200)}
const isFs=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const fsFail=()=>toast('V tomto okně celá obrazovka nejde. Otevřete prezentaci na samostatné stránce, nebo stiskněte F11.');
function toggleFs(){const d=document,el=d.documentElement;
  try{if(isFs()){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!req||(d.fullscreenEnabled===false&&!d.webkitFullscreenEnabled)){fsFail();return}
    const pr=req.call(el);if(pr&&pr.catch)pr.catch(fsFail);setTimeout(()=>{if(!isFs())fsFail()},800)}catch(e){fsFail()}}
document.getElementById('fsBtn').onclick=toggleFs;

/* pointer effects: pollen, parallax of the background, cursor ring, 3D tilt */
const cursor=document.getElementById('cursor');let cx=-100,cy=-100,tx=-100,ty=-100,lastTrail=0;
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;tx=e.clientX;ty=e.clientY;cursor.style.opacity=1;
  const t=performance.now();if(t-lastTrail>30){lastTrail=t;Petals.trail(tx,ty)}
  cursor.classList.toggle('big',!!e.target.closest('.tilt,button,a,.hph,.minis .m'));
  const bx=(tx/innerWidth-.5),by=(ty/innerHeight-.5);
  document.querySelectorAll('#bg .blob').forEach((b,i)=>b.style.translate=`${bx*(i+1)*-18}px ${by*(i+1)*-14}px`);
});
(function follow(){cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;cursor.style.transform=`translate(${cx}px,${cy}px)`;requestAnimationFrame(follow)})();
deck.addEventListener('pointermove',e=>{
  const el=e.target.closest('.tilt');deck.querySelectorAll('.tilt.hot').forEach(x=>{if(x!==el){x.classList.remove('hot');x.style.setProperty('--rx','0deg');x.style.setProperty('--ry','0deg')}});
  if(!el||e.pointerType!=='mouse')return;
  const b=el.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
  el.classList.add('hot');el.style.setProperty('--ry',((x-.5)*12).toFixed(2)+'deg');el.style.setProperty('--rx',((.5-y)*10).toFixed(2)+'deg');
  el.style.setProperty('--gx',(x*100).toFixed(1)+'%');el.style.setProperty('--gy',(y*100).toFixed(1)+'%');
});
deck.addEventListener('pointerleave',()=>deck.querySelectorAll('.tilt.hot').forEach(x=>{x.classList.remove('hot');x.style.setProperty('--rx','0deg');x.style.setProperty('--ry','0deg')}));
addEventListener('click',e=>{if(e.target.closest('.nav,.dots'))return;Petals.burst(e.clientX,e.clientY,e.target.closest('.opt')?10:18)});
let lastHover=0;
deck.addEventListener('mousemove',e=>{if(!e.target.closest('.media,.collage .arch,.minis .m,.kind,.hph'))return;const t=performance.now();if(t-lastHover>150){lastHover=t;Petals.burst(e.clientX,e.clientY,2)}});

/* ============ quiz ============ */
(function(){
  const box=document.getElementById('quiz');let qi=0,score=0;
  function render(){
    if(qi>=QUIZ.length){
      box.innerHTML=`<div class="qtop"><span>Hotovo</span><span>${score} / ${QUIZ.length}</span></div><div class="qbar"><i style="width:100%"></i></div>
      <p class="qtext">${score===QUIZ.length?'Výborně, všechno správně!':score>=3?'Pěkný výsledek!':'Nevadí, květiny se dají poznávat celý život.'}</p>
      <p class="qfb">Správně jste odpověděli na ${score} z ${QUIZ.length} otázek.</p>
      <button class="qnext" id="qagain">Zkusit znovu</button>`;
      document.getElementById('qagain').onclick=e=>{e.stopPropagation();qi=0;score=0;render()};
      if(score>=3){const r=box.getBoundingClientRect();Petals.burst(r.left+r.width/2,r.top+r.height/2,60)}
      return}
    const q=QUIZ[qi];
    box.innerHTML=`<div class="qtop"><span>Otázka ${qi+1} z ${QUIZ.length}</span><span>Skóre ${score}</span></div><div class="qbar"><i style="width:${qi/QUIZ.length*100}%"></i></div>
     <p class="qtext">${q.q}</p>
     <div class="opts">${q.o.map((o,i)=>`<button class="opt" id="q${qi}o${i}" data-i="${i}">${o}</button>`).join('')}</div>
     <p class="qfb" id="qfb">&nbsp;</p>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=ev=>{
      ev.stopPropagation();const i=+b.dataset.i,ok=i===q.a;if(ok)score++;
      box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('ok');else if(j===i)x.classList.add('no')});
      document.getElementById('qfb').textContent=(ok?'Správně. ':'Tentokrát ne. ')+q.e;
      const r=b.getBoundingClientRect();Petals.burst(r.left+r.width/2,r.top+r.height/2,ok?30:6);
      const nb=document.createElement('button');nb.className='qnext';nb.id='qnext'+qi;nb.textContent=qi<QUIZ.length-1?'Další otázka':'Zobrazit výsledek';
      nb.onclick=e=>{e.stopPropagation();qi++;render()};box.appendChild(nb);nb.focus({preventScroll:true});
    });
  }
  render();
})();

/* photo credits (written by the download script next to the photos) */
fetch('img/credits.json').then(r=>r.ok?r.json():null).then(list=>{if(!list)return;
  const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.getElementById('credits').insertAdjacentHTML('beforeend',list.map(c=>`<li><b>${esc(c.label)}</b> · ${esc(c.artist)} · <a href="${esc(c.page)}" target="_blank" rel="noopener">${esc(c.license)}</a>, Wikimedia Commons</li>`).join(''));
}).catch(()=>{});

/* start at #slide deep link */
const startId=(location.hash||'').slice(1);const si=els.findIndex(s=>s.id===startId);
if(si>0)requestAnimationFrame(()=>{deck.style.scrollBehavior='auto';els[si].scrollIntoView({block:'start'});deck.style.scrollBehavior=''});
</script>
