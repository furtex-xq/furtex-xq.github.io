name: Template check (iPhone WebKit + desktop Chromium)

on:
  push:
    branches: ["ci/template-check"]
    paths: ["urls.txt", "check.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: template-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps webkit chromium
      - run: node check.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report
          git commit -m "Check report $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
