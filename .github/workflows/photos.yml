name: Template photos

on:
  push:
    branches: ["template/**"]
    paths:
      - "tools/chosen.json"
      - "tools/fetch_photos.py"

permissions:
  contents: write

concurrency:
  group: photos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch photos
        run: python tools/fetch_photos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/photos
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Photos: download chosen stock photos into the repo"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
