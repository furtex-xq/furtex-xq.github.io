<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ansaro Technologies — Roblox development</title>
<meta name="description" content="Ansaro: cheap custom 3D models for Roblox from $10 / 500 Robux. Pet eggs, potions, props, buildings and vehicles in live 3D. Free mini test.">
<meta property="og:title" content="Ansaro Technologies — Roblox development">
<meta property="og:description" content="Custom 3D models for Roblox from $10. Live 3D showcase and order catalog.">
<meta property="og:image" content="renders/o_dm_eggs.webp">
<meta name="theme-color" content="#050505">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-label="3D model viewer"></canvas>
<div class="vignette" aria-hidden="true"></div>

<!-- вступление -->
<section id="intro" class="intro">
  <div class="intro-bg" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="lines"></i></div>
  <div class="intro-inner">
    <div class="intro-bar"><button class="icon-btn" data-open="pricing" data-t="pricing"></button><span class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ru">RU</button></span></div>
    <p class="eyebrow" data-t="eyebrow"></p>
    <h1><span>ANSARO</span><em>TECHNOLOGIES</em></h1>
    <p class="dev"><span data-t="developer"></span> <b>nochevvsky</b></p>
    <p class="lead" data-t="lead"></p>
    <div class="cta"><button class="btn-primary" data-open="pricing" data-t="ctaPrice"></button></div>
    <p class="free"><span class="logo-dot"></span><span data-t="freeTest"></span></p>
    <h2 class="sec-t"><span data-t="clientsTitle"></span></h2>
    <div class="clients" id="clients"></div>
  </div>
</section>

<!-- интерфейс просмотра -->
<header class="top">
  <a class="brand" href="#" id="home"><span class="logo-dot"></span>ANSARO<small>TECHNOLOGIES</small></a>
  <nav class="tabs" id="tabs" aria-label="Collections"></nav>
  <div class="top-actions">
    <button class="icon-btn" id="bCats" data-t="clients"></button>
    <button class="icon-btn" id="bOrder" data-t="order"></button>
    <button class="icon-btn accent" data-open="pricing" data-t="pricing"></button>
    <span class="lang" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="ru">RU</button></span>
    <button class="icon-btn round hide-s" id="bFull" data-ta="full"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<section class="info" id="info" aria-live="polite">
  <div class="meta"><span class="col" id="iCol"></span><span class="rar" id="iRar"></span></div>
  <h2 id="iName"></h2>
  <p class="en" id="iEn"></p>
  <p class="desc" id="iDesc"></p>
</section>

<div class="counter" id="counter"><b id="cNow">01</b><span>/</span><i id="cAll">42</i></div>

<div class="controls">
  <button class="nav-btn" id="prev" aria-label="Previous model"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="pill" id="bPlay" aria-pressed="false"><span class="dot"></span><span id="playTxt" data-t="autoplay"></span></button>
  <button class="pill on" id="bSpin" aria-pressed="true" data-t="spin"></button>
  <button class="nav-btn" id="next" aria-label="Next model"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<div class="strip-wrap"><div class="strip" id="strip" role="listbox" aria-label="Models"></div></div>

<div class="hint" id="hint" data-t="hint"></div>
<div class="loader" id="loader"><span></span></div>

<!-- галерея рендеров -->
<div class="lightbox" id="lightbox" hidden>
  <div class="lb-head"><h3 id="lbTitle" data-t="renders"></h3><button class="icon-btn round" id="lbClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="lb-grid" id="lbGrid"></div>
  <div class="lb-view" id="lbView" hidden><img id="lbImg" alt=""><p id="lbCap"></p><button class="nav-btn" id="lbPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="nav-btn" id="lbNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
</div>

<!-- каталог заказов, заказ, цены -->
<div class="panel" id="pReview" hidden>
  <div class="p-head"><div><h3 data-t="review"></h3></div><button class="icon-btn round" data-close data-ta="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="review" id="rvBody"></div>
</div>
<div class="panel" id="pOrder" hidden>
  <div class="p-head"><button class="icon-btn" id="oBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span data-t="clients"></span></button><button class="icon-btn round" data-close data-ta="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="o-detail" id="oDetail"></div>
</div>
<div class="panel" id="pPricing" hidden>
  <div class="p-head"><div><h3 data-t="prTitle"></h3><p data-t="prLead"></p></div><button class="icon-btn round" data-close data-ta="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="pricing" id="prBody"></div>
</div>

<footer class="foot" data-t="foot"></footer>
<script type="module" src="app.js?v=13"></script>
</body>
</html>
