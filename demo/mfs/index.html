<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Math for Speed</title>
  <link rel="stylesheet" href="fonts.css?v=1.25">
  <link rel="stylesheet" href="styles.css?v=1.25">
  <link rel="stylesheet" href="animations.css?v=1.25">
  <link rel="stylesheet" href="features.css?v=1.25">
  <link rel="stylesheet" href="profile.css?v=1.25">
  <link rel="stylesheet" href="plus.css?v=1.25">
  <style>
    /* Заставка при запуске — в самой странице, чтобы появилась сразу */
    .intro { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(120% 80% at 50% 42%, #17130b 0%, #0a0a0a 58%); color: #f5f2ea; touch-action: none; }
    .intro-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .intro-mark { position: relative; width: 112px; height: 140px; }
    .intro-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .intro-mark path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .intro-sketch { stroke: #d6b25e; stroke-width: 1.2; opacity: .55; stroke-dasharray: 1; stroke-dashoffset: 1; animation: introDraw .75s cubic-bezier(.6,.1,.3,1) .05s forwards, introFade .5s ease 1.1s forwards; }
    .intro-ink { stroke: url(#introGold); stroke-width: 5.5; stroke-dasharray: 1; stroke-dashoffset: 1; animation: introDraw .8s cubic-bezier(.55,.05,.25,1) .25s forwards; filter: drop-shadow(0 0 10px rgba(214,178,94,.45)); }
    .intro-glow { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; background: radial-gradient(circle, rgba(214,178,94,.28), transparent 65%); opacity: 0; transform: scale(.6); animation: introGlow 1.1s ease-out .75s forwards; }
    .intro-name { font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif; font-weight: 600; font-size: 30px; letter-spacing: .02em; display: flex; overflow: hidden; padding: 2px 4px; }
    .intro-name span { display: inline-block; white-space: pre; opacity: 0; transform: translateY(70%); animation: introUp .5s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(.8s + var(--i) * 28ms); }
    .intro-name .g { color: #e3c06f; }
    .intro-line { width: 160px; height: 1px; background: linear-gradient(90deg, transparent, #d6b25e, transparent); transform: scaleX(0); animation: introLine .7s cubic-bezier(.2,.8,.2,1) 1.05s forwards; }
    .intro-tag { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: #8a8a8a; opacity: 0; animation: introFadeIn .6s ease 1.2s forwards; }
    .intro.out { animation: introOut .45s cubic-bezier(.4,0,.2,1) forwards; pointer-events: none; }
    .intro.out .intro-inner { animation: introZoom .45s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes introDraw { to { stroke-dashoffset: 0; } }
    @keyframes introFade { to { opacity: 0; } }
    @keyframes introFadeIn { to { opacity: 1; } }
    @keyframes introGlow { 40% { opacity: 1; transform: scale(1.05); } to { opacity: .55; transform: scale(1); } }
    @keyframes introUp { to { opacity: 1; transform: none; } }
    @keyframes introLine { to { transform: scaleX(1); } }
    @keyframes introOut { to { opacity: 0; } }
    @keyframes introZoom { to { transform: scale(1.08); filter: blur(2px); } }
    @media (prefers-reduced-motion: reduce) { .intro { display: none; } }
  </style>
<style>html{scrollbar-width:none}::-webkit-scrollbar{display:none}</style>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-inner">
      <div class="intro-mark">
        <div class="intro-glow"></div>
        <svg viewBox="0 0 40 50">
          <defs><linearGradient id="introGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7e3a3"/><stop offset=".45" stop-color="#d9ae55"/><stop offset="1" stop-color="#8d6a2d"/></linearGradient></defs>
          <path class="intro-sketch" pathLength="1" d="M33.4 6.6H7.4l14.7 18.1L6.6 43.3h28.6"/>
          <path class="intro-ink" pathLength="1" d="M34 7H7l15 18L7 43h28"/>
        </svg>
      </div>
      <div class="intro-name"><span style="--i:0">M</span><span style="--i:1">a</span><span style="--i:2">t</span><span style="--i:3">h</span><span style="--i:4"> </span><span style="--i:5">f</span><span style="--i:6">o</span><span style="--i:7">r</span><span style="--i:8"> </span><span style="--i:9" class="g">S</span><span style="--i:10">p</span><span style="--i:11">e</span><span style="--i:12">e</span><span style="--i:13">d</span></div>
      <div class="intro-line"></div>
      <div class="intro-tag" data-i18n="Считай быстрее">Считай быстрее</div>
    </div>
  </div>
  <header class="topbar">
    <div class="brand" data-action="nav" data-view="dashboard">
      <span class="brand-mark">∑</span>
      <span class="brand-divider"></span>
      <span class="brand-name">Math for <em>S</em>peed</span>
    </div>
    <div class="topbar-right">
      <button class="icon-sq" id="soundBtn" data-action="sound" aria-label="Звук" data-i18n-aria="Звук"></button>
      <div class="level-chip" id="levelChip"></div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" aria-label="Навигация" data-i18n-aria="Навигация">
    <button class="nav-item" data-action="nav" data-view="dashboard"><span class="nav-ico" data-ico="home"></span><span data-i18n="Главная">Главная</span></button>
    <button class="nav-item" data-action="nav" data-view="training"><span class="nav-ico" data-ico="bolt"></span><span data-i18n="Тренировка">Тренировка</span></button>
    <button class="nav-fab" data-action="start-last" aria-label="Быстрый старт" data-i18n-aria="Быстрый старт"><span class="fab-ico"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M11.5 7.2c-1.3-.8-3 .2-3 1.7v14.2c0 1.5 1.7 2.5 3 1.7l11.8-7.1c1.3-.8 1.3-2.6 0-3.4Z"/></svg></span></button>
    <button class="nav-item" data-action="nav" data-view="stats"><span class="nav-ico" data-ico="donut"></span><span data-i18n="Статистика">Статистика</span></button>
    <button class="nav-item" data-action="nav" data-view="settings"><span class="nav-ico" data-ico="gear"></span><span data-i18n="Настройки">Настройки</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="i18n.js?v=1.25"></script>
  <!-- Загружаем только словарь выбранного языка -->
  <script>(function () { var l = I18N.lang; if (l !== 'ru') document.write('<script src="lang-' + l + '.js?v=1.25"><' + '/script>'); })();</script>
  <script src="hooks.js?v=1.25"></script>
  <script src="icons.js?v=1.25"></script>
  <script src="features.js?v=1.25"></script>
  <script src="gen.js?v=1.25"></script>
  <script src="sound.js?v=1.25"></script>
  <script src="fx.js?v=1.25"></script>
  <script src="native.js?v=1.25"></script>
  <script src="ui.js?v=1.25"></script>
  <script src="extras.js?v=1.25"></script>
  <script src="modes.js?v=1.25"></script>
  <script src="learn.js?v=1.25"></script>
  <script src="meta.js?v=1.25"></script>
  <script src="insights.js?v=1.25"></script>
  <script src="polish.js?v=1.25"></script>
  <script src="app.js?v=1.25"></script>
</body>
</html>
