<style id="ansaro-splash-css">#ansaro-splash{position:fixed;inset:0;z-index:99999;background:#141414;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:system-ui,sans-serif;color:#f5f3ff;transition:opacity .35s}#ansaro-splash.gone{opacity:0;pointer-events:none}#ansaro-splash i{width:54px;height:54px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#3b82f6;border-right-color:#facc15;animation:ansp .9s linear infinite}#ansaro-splash b{font-size:20px;font-weight:800}@keyframes ansp{to{transform:rotate(360deg)}}</style></head>
<body>
<div id="ansaro-splash"><i></i><b>#PYTHON</b></div><script>(function(){var s=document.getElementById('ansaro-splash');function h(){if(s){s.classList.add('gone');setTimeout(function(){s.remove()},400)}}window.addEventListener('flutter-first-frame',h);setTimeout(h,25000)})()</script>
